<body>
<header class="top">
  <div class="topbar">
    <button class="iconbtn" id="home" aria-label="Accueil">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    </button>
    <div class="searchwrap"><input id="q" type="search" placeholder="Chercher une notion (pivot, pointeur, jointure…)" autocomplete="off"></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<script>
const AP1 = {code:"EP1.1.1", nom:"Algorithmique et programmation 1 : impérative", ects:8, h:"12h CM · 18h TD · 30h TP",
resume:"Le gros morceau du semestre 1 (8 ECTS à lui seul). On part de zéro : écrire un algorithme, le traduire dans un langage impératif, le compiler, le tester. Les exemples ci-dessous sont en C et en pseudo-code ; selon ton groupe le langage support peut être Python, mais les notions sont identiques.",
chapitres:[
{t:"Algorithme, programme, compilation", obj:["Distinguer algorithme, programme et exécutable","Comprendre la chaîne de compilation","Écrire et lancer un premier programme"], html:`
<h4>Ce qu'est un algorithme</h4>
<div class="def"><b>Définition.</b> Un algorithme est une suite finie d'instructions non ambiguës qui, à partir de données d'entrée, produit un résultat en un nombre fini d'étapes.</div>
<p>Trois propriétés à vérifier systématiquement : la <strong>terminaison</strong> (l'algorithme s'arrête), la <strong>correction</strong> (il produit le bon résultat) et l'<strong>efficacité</strong> (il le fait avec des ressources raisonnables). En L1 on te demandera surtout de justifier les deux premières.</p>
<h4>Le paradigme impératif</h4>
<p>Programmer en impératif, c'est décrire une suite de <em>changements d'état</em> de la mémoire. On dispose de variables, on les modifie par affectation, et on contrôle l'ordre des opérations avec des séquences, des tests et des boucles. C'est le paradigme de C, de Python, de Java. Il s'oppose au paradigme fonctionnel (que tu croiseras plus tard) où l'on décrit des transformations sans état modifiable.</p>
<h4>De la source à l'exécutable</h4>
<p>En C, le fichier source n'est pas exécutable. Quatre étapes le transforment :</p>
<ol>
<li><strong>Préprocesseur</strong> : traite les lignes qui commencent par un dièse, remplace les inclusions et les macros.</li>
<li><strong>Compilation</strong> : traduit le C en assembleur, signale les erreurs de syntaxe et de type.</li>
<li><strong>Assemblage</strong> : produit un fichier objet en code machine.</li>
<li><strong>Édition de liens</strong> : relie ton objet aux bibliothèques (par exemple la bibliothèque standard) pour produire l'exécutable.</li>
</ol>
<pre><code>gcc -Wall -Wextra -std=c17 -o bonjour bonjour.c
./bonjour</code></pre>
<p>Prends tout de suite l'habitude des options <code>-Wall -Wextra</code> : elles activent les avertissements. Un avertissement ignoré en L1 devient un bug introuvable en L2.</p>
<h4>Premier programme</h4>
<pre><code>#include &lt;stdio.h&gt;

int main(void) {
    printf("Bonjour Blois\\n");
    return 0;
}</code></pre>
<p>La fonction <code>main</code> est le point d'entrée : c'est elle que le système appelle. Le <code>return 0</code> signale au système que tout s'est bien passé.</p>`,
retenir:"Un algorithme se raisonne sur papier, un programme se compile. Les erreurs de compilation sont tes amies : elles arrivent avant l'exécution. Les erreurs qui n'apparaissent qu'à l'exécution coûtent bien plus cher.",
exos:[{q:"Un algorithme qui affiche indéfiniment les entiers naturels est-il un algorithme au sens strict ?",r:"Non : il ne termine pas. La finitude du nombre d'étapes fait partie de la définition. C'est un procédé de calcul, mais pas un algorithme."},{q:"À quelle étape est détectée l'erreur « référence indéfinie vers la fonction f » ?",r:"À l'édition de liens. Le compilateur a accepté l'appel parce qu'il connaissait le prototype de f, mais aucun fichier objet ne fournit son code."}]},

{t:"Variables, types, affectation", obj:["Choisir le bon type primitif","Comprendre ce que fait vraiment une affectation","Éviter les débordements et les conversions implicites"], html:`
<h4>Une variable, c'est une case mémoire nommée</h4>
<p>Déclarer une variable réserve un emplacement en mémoire, lui donne un nom et fixe son <strong>type</strong>. Le type détermine deux choses : la taille de l'emplacement, et la façon dont les bits qu'il contient doivent être interprétés.</p>
<pre><code>int n = 42;          /* entier signé, 4 octets en général */
double x = 3.5;      /* flottant double précision, 8 octets */
char c = 'A';        /* un caractère, 1 octet */
_Bool ok = 1;        /* booléen */</code></pre>
<h4>L'affectation n'est pas une égalité</h4>
<p>L'instruction <code>n = n + 1;</code> n'a aucun sens mathématique. Elle se lit : « évalue l'expression à droite, puis range le résultat dans la case de gauche ». La flèche du pseudo-code, <code>n &lt;- n + 1</code>, est plus honnête que le signe égal du C.</p>
<div class="piege"><b>Piège classique.</b> En C, <code>=</code> est l'affectation et <code>==</code> le test d'égalité. Écrire <code>if (n = 0)</code> compile, affecte 0 à n, et le test est toujours faux. Les avertissements du compilateur signalent ce cas.</div>
<h4>Portée et durée de vie</h4>
<p>Une variable déclarée dans un bloc n'existe que dans ce bloc : c'est sa <strong>portée</strong>. Elle est créée à l'entrée du bloc et détruite à la sortie. Une variable globale, déclarée hors de toute fonction, est visible partout et vit pendant toute l'exécution — à éviter sauf raison sérieuse, car elle rend le programme difficile à raisonner.</p>
<h4>Conversions</h4>
<p>Quand une expression mélange des types, le C convertit automatiquement vers le type le plus large. C'est pratique et dangereux :</p>
<pre><code>int a = 7, b = 2;
double r1 = a / b;         /* 3.0 : la division entière a lieu AVANT */
double r2 = (double)a / b; /* 3.5 : conversion explicite d'abord */</code></pre>
<h4>Débordement</h4>
<p>Un <code>int</code> sur 4 octets couvre environ de -2 147 483 648 à 2 147 483 647. Dépasser cette borne ne provoque pas d'erreur : la valeur « boucle ». C'est la cause de bugs célèbres, et un point que le cours d'Architecture reprendra avec le complément à deux.</p>`,
retenir:"Le type d'une variable n'est pas une décoration : il fixe la taille, l'intervalle des valeurs et le comportement des opérateurs. La division de deux entiers est entière, même si le résultat est rangé dans un flottant.",
exos:[{q:"Que vaut x après int a=5, b=2; double x = a/b + 0.5; ?",r:"3.5. La division a/b est entière et vaut 2, puis 2 + 0.5 = 2.5... attention : 2 + 0.5 = 2.5, donc x vaut 2.5. Le piège est bien que a/b vaille 2 et non 2.5."},{q:"Comment échanger le contenu de deux variables entières a et b ?",r:"Avec une variable temporaire : t = a ; a = b ; b = t. Sans temporaire on peut faire a = a+b ; b = a-b ; a = a-b, mais ce n'est pas robuste aux débordements."}]},

{t:"Instructions conditionnelles", obj:["Écrire des conditions correctes et lisibles","Maîtriser les opérateurs logiques et l'évaluation paresseuse","Choisir entre if imbriqués et switch"], html:`
<h4>La forme de base</h4>
<pre><code>if (note &gt;= 10) {
    printf("Admis\\n");
} else if (note &gt;= 8) {
    printf("Rattrapage\\n");
} else {
    printf("Ajourne\\n");
}</code></pre>
<p>Mets toujours les accolades, même pour une seule instruction. Sans elles, ajouter une ligne plus tard change silencieusement le sens du programme.</p>
<h4>Opérateurs de comparaison et booléens</h4>
<p>Comparaisons : <code>==</code>, <code>!=</code>, <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code>. Connecteurs : <code>&amp;&amp;</code> (et), <code>||</code> (ou), <code>!</code> (non). En C, toute valeur non nulle est vraie et zéro est faux.</p>
<h4>Évaluation paresseuse</h4>
<div class="def"><b>Court-circuit.</b> Dans <code>A &amp;&amp; B</code>, si A est faux, B n'est jamais évalué. Dans <code>A || B</code>, si A est vrai, B n'est pas évalué.</div>
<p>Ce n'est pas un détail : c'est ce qui permet d'écrire <code>if (i &lt; n &amp;&amp; tab[i] == 0)</code> sans risquer un accès hors du tableau. L'ordre des conditions devient significatif.</p>
<h4>Lois de De Morgan</h4>
<p>Pour simplifier une négation, tu utiliseras constamment les règles vues en Logique : la négation de « A et B » est « non A ou non B », et la négation de « A ou B » est « non A et non B ». Le cours de Logique pour l'informatique les démontre proprement ; ici on s'en sert pour rendre un test lisible.</p>
<h4>switch</h4>
<pre><code>switch (choix) {
    case 1: ajouter();  break;
    case 2: supprimer(); break;
    default: printf("Choix inconnu\\n");
}</code></pre>
<div class="piege"><b>Piège.</b> Sans <code>break</code>, l'exécution continue dans le cas suivant. Ce comportement est parfois volontaire, mais l'oubli est une source de bugs fréquente.</div>`,
retenir:"Les conditions se lisent de gauche à droite avec court-circuit : place à gauche le test qui protège celui de droite. Accolades systématiques, break systématique dans un switch.",
exos:[{q:"Écris la négation de la condition (a > 0 && a < 10).",r:"a <= 0 || a >= 10, par De Morgan. Attention à bien inverser chaque comparaison ET le connecteur."},{q:"Pourquoi if (tab[i] != 0 && i < n) est-il dangereux ?",r:"Parce que tab[i] est lu avant de vérifier que i est dans les bornes. Si i vaut n, on lit hors du tableau. Il faut inverser les deux tests."}]},

{t:"Boucles et invariants", obj:["Choisir entre while, do-while et for","Prouver la terminaison d'une boucle","Formuler un invariant de boucle"], html:`
<h4>Les trois formes</h4>
<pre><code>/* while : le test d'abord, 0 tour possible */
while (condition) { ... }

/* do-while : au moins un tour */
do { ... } while (condition);

/* for : initialisation, test, incrementation */
for (int i = 0; i &lt; n; i++) { ... }</code></pre>
<p>Le <code>for</code> s'utilise quand le nombre d'itérations est connu à l'avance, le <code>while</code> quand il dépend d'une condition dynamique (lecture au clavier, convergence, parcours jusqu'à une sentinelle).</p>
<h4>Terminaison</h4>
<div class="def"><b>Variant de boucle.</b> Une quantité entière positive qui décroît strictement à chaque tour. Comme elle ne peut pas décroître indéfiniment en restant positive, la boucle termine.</div>
<p>Pour <code>while (n &gt; 1) n = n / 2;</code> le variant est simplement n. C'est le raisonnement qu'on te demandera de rédiger en TD, et c'est un cousin direct de la récurrence vue en Calculus et Raisonnement.</p>
<h4>Invariant de boucle</h4>
<div class="def"><b>Invariant.</b> Une propriété vraie avant la boucle, préservée par chaque tour, et qui donne le résultat voulu à la sortie.</div>
<pre><code>int somme = 0;
for (int i = 0; i &lt; n; i++) {
    somme = somme + tab[i];
}
/* Invariant : avant chaque tour, somme contient la
   somme des i premiers elements de tab. */</code></pre>
<p>À la sortie, i vaut n, donc somme contient la somme des n premiers éléments : c'est bien le résultat attendu. Cette technique est la manière rigoureuse de prouver qu'une boucle est correcte, et elle revient à chaque partiel.</p>
<h4>Boucles imbriquées</h4>
<pre><code>for (int i = 0; i &lt; n; i++)
    for (int j = 0; j &lt; n; j++)
        printf("%d ", i * j);</code></pre>
<p>Deux boucles imbriquées sur n donnent n fois n itérations. Retiens ce réflexe de comptage : il fonde le calcul de complexité du dernier chapitre.</p>
<div class="piege"><b>Erreur de bord.</b> <code>i &lt;= n</code> au lieu de <code>i &lt; n</code> fait un tour de trop et lit une case inexistante. On appelle ça une erreur « à un près » ; c'est statistiquement la faute la plus fréquente en L1.</div>`,
retenir:"Toute boucle doit avoir un variant (elle termine) et un invariant (elle calcule la bonne chose). Savoir énoncer l'invariant d'un parcours de tableau est un attendu d'examen.",
exos:[{q:"Donne un variant pour while (a != b) { if (a > b) a = a - b; else b = b - a; }",r:"a + b : la somme décroît strictement à chaque tour et reste strictement positive tant que a et b le sont. C'est l'algorithme d'Euclide par soustractions."},{q:"Quel est l'invariant de la recherche du maximum d'un tableau ?",r:"Avant chaque tour d'indice i, la variable max contient le maximum des i premiers éléments du tableau."}]},

{t:"Fonctions et procédures", obj:["Découper un programme en fonctions","Comprendre le passage de paramètres par valeur","Écrire des prototypes corrects"], html:`
<h4>Pourquoi découper</h4>
<p>Une fonction donne un nom à un traitement, permet de le réutiliser, et surtout permet de le tester isolément. La règle empirique : si tu ne peux pas décrire ce que fait une fonction en une phrase, elle en fait trop.</p>
<pre><code>/* Prototype : contrat, place en haut du fichier ou dans un .h */
int maximum(int a, int b);

/* Definition */
int maximum(int a, int b) {
    if (a &gt; b) return a;
    return b;
}</code></pre>
<h4>Passage par valeur</h4>
<div class="def"><b>Règle du C.</b> Les arguments sont copiés. Modifier un paramètre dans la fonction ne modifie pas la variable de l'appelant.</div>
<pre><code>void rate(int x) { x = 99; }
int n = 1;
rate(n);      /* n vaut toujours 1 */</code></pre>
<p>Pour qu'une fonction modifie une variable de l'appelant, il faut lui passer son <strong>adresse</strong> — c'est l'objet du chapitre sur les pointeurs. Un tableau fait exception apparente : son nom se transforme en adresse de sa première case, donc une fonction peut modifier son contenu.</p>
<h4>Procédure</h4>
<p>Une fonction de type <code>void</code> ne renvoie rien : on parle de procédure. Elle agit par effet de bord (affichage, modification via pointeur, écriture dans un fichier).</p>
<h4>Pile d'appels</h4>
<p>Chaque appel empile un <em>bloc d'activation</em> contenant les paramètres, les variables locales et l'adresse de retour. Au retour, le bloc est dépilé. C'est pour cela que les variables locales disparaissent, et c'est aussi ce qui rend la récursivité possible et coûteuse en mémoire.</p>
<h4>Style</h4>
<ul>
<li>Un seul rôle par fonction, un nom qui décrit ce rôle.</li>
<li>Évite les variables globales : passe l'information en paramètre.</li>
<li>Documente en commentaire ce que la fonction attend (préconditions) et ce qu'elle garantit (postconditions).</li>
</ul>`,
retenir:"En C tout est passé par valeur. Si tu veux qu'une fonction modifie la variable de l'appelant, passe un pointeur. La pile d'appels explique la portée et la durée de vie des variables locales.",
exos:[{q:"Écris une fonction qui indique si un entier est premier.",r:"int estPremier(int n) { if (n < 2) return 0; for (int d = 2; d*d <= n; d++) if (n % d == 0) return 0; return 1; } — le test d*d <= n suffit car un diviseur au-delà de la racine a un cofacteur en dessous."},{q:"Pourquoi echange(a, b) avec des paramètres int ne fonctionne-t-il pas ?",r:"Parce que la fonction échange ses copies locales. Il faut la signature void echange(int *a, int *b) et l'appel echange(&x, &y)."}]},

{t:"Tableaux", obj:["Déclarer et parcourir un tableau","Passer un tableau à une fonction","Comprendre pourquoi la taille doit être transmise"], html:`
<h4>Déclaration et indices</h4>
<pre><code>int tab[5] = {3, 7, 1, 9, 4};
tab[0] = 10;              /* premier element */
int dernier = tab[4];     /* dernier element */</code></pre>
<div class="def"><b>Indexation.</b> Les indices vont de 0 à taille-1. Un tableau de 5 cases n'a pas de case d'indice 5.</div>
<p>Les cases sont <strong>contiguës en mémoire</strong>, ce qui rend l'accès à <code>tab[i]</code> immédiat : l'adresse se calcule par une addition. En revanche, insérer un élément au milieu impose de décaler tout le reste.</p>
<h4>Parcours</h4>
<pre><code>int somme = 0;
for (int i = 0; i &lt; n; i++)
    somme += tab[i];</code></pre>
<h4>Tableaux et fonctions</h4>
<pre><code>double moyenne(int tab[], int n) {
    int s = 0;
    for (int i = 0; i &lt; n; i++) s += tab[i];
    return (double)s / n;
}</code></pre>
<p>Le C ne transmet pas la taille : <code>tab</code> devient un pointeur vers la première case. Tu <strong>dois</strong> donc toujours passer n en second paramètre. Oublier cela est la source numéro un des débordements de tableau.</p>
<h4>Tableaux à deux dimensions</h4>
<pre><code>int m[3][4];                 /* 3 lignes, 4 colonnes */
for (int i = 0; i &lt; 3; i++)
    for (int j = 0; j &lt; 4; j++)
        m[i][j] = i + j;</code></pre>
<p>En mémoire, les lignes sont stockées les unes après les autres. Parcourir ligne par ligne est plus rapide que colonne par colonne : le cache mémoire, vu en Architecture, aime les accès contigus.</p>
<div class="piege"><b>Pas de vérification.</b> Le C ne contrôle pas les bornes. <code>tab[7]</code> sur un tableau de 5 cases compile, s'exécute, et lit ou écrit n'importe quoi. Le programme peut planter... ou pire, sembler fonctionner.</div>`,
retenir:"Un tableau en C, c'est une zone contiguë plus une taille que tu transportes toi-même. Accès en temps constant, insertion coûteuse : c'est exactement le compromis qui motivera les listes chaînées au semestre 2.",
exos:[{q:"Écris une fonction qui inverse un tableau sur place.",r:"void inverser(int t[], int n) { for (int i = 0; i < n/2; i++) { int tmp = t[i]; t[i] = t[n-1-i]; t[n-1-i] = tmp; } } — la boucle s'arrête à n/2, sinon on inverse deux fois."},{q:"Combien d'accès mémoire pour trouver le minimum d'un tableau de n éléments ?",r:"n lectures, soit une complexité linéaire. On ne peut pas faire mieux : il faut regarder chaque élément au moins une fois."}]},

{t:"Chaînes de caractères", obj:["Comprendre la convention du caractère nul","Utiliser les fonctions de string.h","Éviter les débordements de tampon"], html:`
<h4>Une chaîne est un tableau de char</h4>
<div class="def"><b>Convention C.</b> Une chaîne est un tableau de caractères terminé par le caractère nul, noté <code>'\\0'</code>. Ce marqueur n'est pas affiché mais occupe une case.</div>
<pre><code>char mot[6] = "Tours";  /* 5 lettres + le '\\0' = 6 cases */</code></pre>
<p>Réserver seulement 5 cases pour "Tours" produit une chaîne non terminée : toutes les fonctions qui la parcourent liront au-delà jusqu'à tomber par hasard sur un octet nul.</p>
<h4>Parcourir</h4>
<pre><code>int longueur(const char s[]) {
    int i = 0;
    while (s[i] != '\\0') i++;
    return i;
}</code></pre>
<h4>Les fonctions standard</h4>
<table><tr><th>Fonction</th><th>Rôle</th></tr>
<tr><td><code>strlen(s)</code></td><td>longueur sans le caractère nul</td></tr>
<tr><td><code>strcpy(dst, src)</code></td><td>copie (dangereux si dst trop petit)</td></tr>
<tr><td><code>strcmp(a, b)</code></td><td>compare : 0 si égales, négatif ou positif sinon</td></tr>
<tr><td><code>strcat(dst, src)</code></td><td>concatène</td></tr></table>
<div class="piege"><b>Comparaison.</b> <code>if (a == b)</code> sur deux chaînes compare les adresses, pas le contenu. Il faut <code>if (strcmp(a, b) == 0)</code>.</div>
<h4>Lecture au clavier</h4>
<p>Évite <code>gets</code>, supprimé du langage car il ne limite pas la taille lue. Utilise <code>fgets(buffer, taille, stdin)</code>, qui borne la lecture — c'est le réflexe de sécurité que la suite du parcours SLS développera.</p>
<h4>Caractères</h4>
<p>Un <code>char</code> est un petit entier. En codage ASCII, <code>'A'</code> vaut 65 et <code>'a'</code> vaut 97, ce qui permet des astuces utiles : <code>c - '0'</code> convertit le caractère d'un chiffre en sa valeur, <code>c + 32</code> passe une majuscule en minuscule. Le chapitre sur le codage des caractères en Architecture explique pourquoi.</p>`,
retenir:"Le caractère nul final n'est pas optionnel : c'est lui qui définit la fin de la chaîne. Toujours prévoir une case de plus, toujours borner les lectures.",
exos:[{q:"Que renvoie strlen(\"info\") et combien de cases occupe cette chaîne ?",r:"strlen renvoie 4, mais la chaîne occupe 5 octets à cause du caractère nul final."},{q:"Écris une fonction qui compte les voyelles d'une chaîne.",r:"Parcourir avec un while jusqu'au caractère nul, et pour chaque caractère tester s'il appartient à aeiouy, en pensant aux majuscules."}]},

{t:"Pointeurs et mémoire", obj:["Lire et écrire une adresse","Utiliser les pointeurs pour modifier un argument","Allouer dynamiquement de la mémoire"], html:`
<h4>Adresse et déréférencement</h4>
<div class="def"><b>Pointeur.</b> Variable dont la valeur est l'adresse d'une autre variable. <code>&amp;x</code> donne l'adresse de x ; si p contient cette adresse, <code>*p</code> désigne la variable pointée.</div>
<pre><code>int x = 10;
int *p = &amp;x;    /* p pointe vers x */
*p = 20;        /* x vaut maintenant 20 */
printf("%d\\n", x);</code></pre>
<h4>Le cas qui motive tout</h4>
<pre><code>void echanger(int *a, int *b) {
    int t = *a;
    *a = *b;
    *b = t;
}
int u = 1, v = 2;
echanger(&amp;u, &amp;v);   /* u vaut 2, v vaut 1 */</code></pre>
<p>C'est exactement ce que <code>scanf("%d", &amp;n)</code> fait depuis le premier TP : il a besoin de l'adresse pour pouvoir écrire dans ta variable.</p>
<h4>Pointeurs et tableaux</h4>
<p>Le nom d'un tableau s'évalue comme l'adresse de sa première case. Ainsi <code>tab[i]</code> est strictement équivalent à <code>*(tab + i)</code> : l'arithmétique des pointeurs avance de la taille du type pointé, pas d'un octet.</p>
<h4>Allocation dynamique</h4>
<pre><code>#include &lt;stdlib.h&gt;
int *t = malloc(n * sizeof(int));
if (t == NULL) { /* echec : traiter l'erreur */ }
/* ... utilisation ... */
free(t);
t = NULL;</code></pre>
<p>Un tableau déclaré normalement a une taille fixée à la compilation et vit dans la pile. <code>malloc</code> réserve de la place dans le <strong>tas</strong>, avec une taille décidée à l'exécution, et cette place reste réservée jusqu'à <code>free</code>.</p>
<h4>Les trois fautes à connaître</h4>
<ul>
<li><strong>Fuite mémoire</strong> : on oublie <code>free</code>, la mémoire n'est jamais rendue.</li>
<li><strong>Pointeur pendouillant</strong> : on utilise un pointeur après <code>free</code>. Mettre le pointeur à NULL après libération limite les dégâts.</li>
<li><strong>Déréférencement de NULL</strong> : provoque une erreur de segmentation. Toujours tester le retour de <code>malloc</code>.</li>
</ul>`,
retenir:"Un pointeur contient une adresse ; l'étoile ouvre la case pointée. Pile pour les variables locales, tas pour l'allocation dynamique. Chaque malloc doit avoir son free.",
exos:[{q:"Que vaut *p après int a=3, b=8, *p=&a; p=&b; ?",r:"8. La deuxième affectation change ce que pointe p, elle ne modifie pas a."},{q:"Écris l'allocation d'un tableau de n doubles avec vérification.",r:"double *t = malloc(n * sizeof(double)); if (t == NULL) { fprintf(stderr, \"memoire insuffisante\\n\"); return 1; } — et ne pas oublier free(t) à la fin."}]},

{t:"Structures et fichiers", obj:["Regrouper des données hétérogènes","Utiliser typedef","Lire et écrire dans un fichier texte"], html:`
<h4>Structures</h4>
<pre><code>typedef struct {
    char nom[40];
    int  numero;
    double moyenne;
} Etudiant;

Etudiant e;
e.numero = 12345;
e.moyenne = 13.5;</code></pre>
<p>Une structure agrège des champs de types différents sous un seul nom. Avec un pointeur sur structure, on écrit <code>p-&gt;numero</code>, notation équivalente à <code>(*p).numero</code>.</p>
<p>Un tableau de structures est la façon naturelle de représenter une petite base de données en C — et c'est un avant-goût direct du modèle relationnel vu au semestre 2 : chaque structure est une ligne, chaque champ une colonne.</p>
<h4>Fichiers texte</h4>
<pre><code>FILE *f = fopen("notes.txt", "r");
if (f == NULL) { perror("notes.txt"); return 1; }

char ligne[256];
while (fgets(ligne, sizeof(ligne), f) != NULL) {
    printf("%s", ligne);
}
fclose(f);</code></pre>
<p>Modes principaux : <code>"r"</code> lecture, <code>"w"</code> écriture (écrase le fichier), <code>"a"</code> ajout en fin. Toujours tester le retour de <code>fopen</code> et toujours refermer : un fichier non fermé peut perdre les dernières écritures restées en tampon.</p>
<h4>Écriture formatée</h4>
<pre><code>FILE *g = fopen("resultat.txt", "w");
fprintf(g, "%s;%d;%.2f\\n", e.nom, e.numero, e.moyenne);
fclose(g);</code></pre>
<p>Le format CSV, une valeur par colonne séparée par un point-virgule, est le pont naturel entre tes programmes C et un tableur ou une base de données.</p>`,
retenir:"struct pour regrouper, typedef pour nommer, la flèche pour accéder via un pointeur. Un fichier s'ouvre, se teste, s'utilise, se ferme — dans cet ordre, sans exception.",
exos:[{q:"Quelle est la différence entre e.nom et p->nom ?",r:"e est une structure, p un pointeur sur structure. p->nom est un raccourci pour (*p).nom."},{q:"Que se passe-t-il si on ouvre en mode w un fichier existant ?",r:"Son contenu est effacé immédiatement. Pour ajouter à la fin sans perdre l'existant, il faut le mode a."}]},

{t:"Récursivité", obj:["Écrire une fonction récursive correcte","Identifier cas de base et cas récursif","Comparer récursif et itératif"], html:`
<h4>Le principe</h4>
<div class="def"><b>Fonction récursive.</b> Fonction qui s'appelle elle-même sur une donnée strictement plus petite, avec au moins un cas de base qui n'engendre pas d'appel.</div>
<pre><code>int factorielle(int n) {
    if (n &lt;= 1) return 1;        /* cas de base */
    return n * factorielle(n-1); /* cas recursif */
}</code></pre>
<p>Sans cas de base, ou si l'argument ne décroît pas, la pile d'appels finit par déborder : c'est l'erreur de débordement de pile.</p>
<h4>Le lien avec la récurrence</h4>
<p>Prouver qu'une fonction récursive est correcte, c'est faire une récurrence : on montre le cas de base, puis on suppose la correction pour n-1 pour en déduire celle pour n. Le cours de Calculus et Raisonnement te donne l'outil, l'informatique en fait le squelette d'un programme.</p>
<h4>Un exemple utile : la dichotomie</h4>
<pre><code>int rechercher(int t[], int g, int d, int v) {
    if (g &gt; d) return -1;
    int m = g + (d - g) / 2;
    if (t[m] == v) return m;
    if (t[m] &lt; v) return rechercher(t, m+1, d, v);
    return rechercher(t, g, m-1, v);
}</code></pre>
<p>Le calcul du milieu s'écrit <code>g + (d-g)/2</code> plutôt que <code>(g+d)/2</code> pour éviter un débordement quand les indices sont grands.</p>
<h4>Récursif ou itératif ?</h4>
<table><tr><th></th><th>Récursif</th><th>Itératif</th></tr>
<tr><td>Lisibilité</td><td>proche de la définition mathématique</td><td>parfois plus lourde</td></tr>
<tr><td>Mémoire</td><td>un bloc de pile par appel</td><td>constante</td></tr>
<tr><td>Vitesse</td><td>surcoût d'appel</td><td>plus rapide en général</td></tr></table>
<p>Toute fonction récursive peut se réécrire itérativement, éventuellement en gérant sa propre pile. On garde le récursif quand il rend le code nettement plus clair : parcours d'arbres, diviser pour régner.</p>
<div class="piege"><b>Récursivité naïve.</b> La suite de Fibonacci écrite par double appel recalcule les mêmes valeurs des milliers de fois. Le nombre d'appels croît exponentiellement.</div>`,
retenir:"Cas de base + décroissance stricte = terminaison. La récursivité est la traduction directe d'une définition par récurrence, mais chaque appel coûte un bloc de pile.",
exos:[{q:"Écris récursivement la somme des n premiers entiers.",r:"int somme(int n) { if (n == 0) return 0; return n + somme(n-1); } — cas de base n=0, décroissance de 1 à chaque appel."},{q:"Combien d'appels pour fibonacci(5) en version naïve à deux appels ?",r:"15 appels au total. Le nombre d'appels suit lui-même une suite proche de Fibonacci, donc croît exponentiellement."}]},

{t:"Tris, recherche et complexité", obj:["Connaître les tris élémentaires","Compter les opérations d'un algorithme","Manipuler la notation grand O"], html:`
<h4>Recherche séquentielle et dichotomique</h4>
<p>Dans un tableau quelconque, il faut parcourir : n comparaisons au pire, complexité linéaire. Si le tableau est <strong>trié</strong>, la dichotomie coupe l'espace de recherche en deux à chaque étape : environ log n comparaisons. Pour un million d'éléments, on passe de 1 000 000 à 20 comparaisons.</p>
<h4>Tri par sélection</h4>
<pre><code>for (int i = 0; i &lt; n-1; i++) {
    int min = i;
    for (int j = i+1; j &lt; n; j++)
        if (t[j] &lt; t[min]) min = j;
    int tmp = t[i]; t[i] = t[min]; t[min] = tmp;
}</code></pre>
<p>On cherche le plus petit élément restant et on le place. Nombre de comparaisons : n-1 puis n-2 ... soit n(n-1)/2, donc quadratique, quel que soit le tableau de départ.</p>
<h4>Tri par insertion</h4>
<p>On insère chaque élément à sa place dans la partie déjà triée, comme on range des cartes. Quadratique au pire, mais <strong>linéaire</strong> si le tableau est presque trié — d'où son usage réel sur les petits tableaux.</p>
<h4>Notation grand O</h4>
<div class="def"><b>Grand O.</b> On écrit que f est en O(g) lorsque, à partir d'un certain rang, f(n) est majorée par une constante multipliée par g(n). On ignore les constantes et les termes négligeables.</div>
<table><tr><th>Complexité</th><th>Nom</th><th>Exemple</th></tr>
<tr><td>O(1)</td><td>constante</td><td>accès à tab[i]</td></tr>
<tr><td>O(log n)</td><td>logarithmique</td><td>recherche dichotomique</td></tr>
<tr><td>O(n)</td><td>linéaire</td><td>somme d'un tableau</td></tr>
<tr><td>O(n log n)</td><td>quasi-linéaire</td><td>tri fusion, tri rapide</td></tr>
<tr><td>O(n²)</td><td>quadratique</td><td>tri par sélection</td></tr>
<tr><td>O(2ⁿ)</td><td>exponentielle</td><td>Fibonacci naïf</td></tr></table>
<h4>Comment compter en pratique</h4>
<p>Repère l'opération élémentaire dominante (souvent une comparaison ou une affectation), puis compte les tours de boucle. Deux boucles imbriquées indépendantes sur n donnent n², une boucle qui divise n par deux donne log n. Ce réflexe sera systématisé au semestre 2 en Structures de données.</p>`,
retenir:"La complexité mesure la croissance du coût quand n grandit, pas le temps en secondes. Trier coûte n log n au mieux avec les tris par comparaison ; chercher dans un tableau trié coûte log n.",
exos:[{q:"Quelle est la complexité de deux boucles imbriquées où la seconde va de i à n ?",r:"Le nombre de tours vaut n(n-1)/2, donc O(n²). Diviser par deux ne change pas la classe de complexité."},{q:"Est-il rentable de trier un tableau pour faire une seule recherche ?",r:"Non : trier coûte au moins n log n, alors qu'une recherche séquentielle coûte n. Le tri devient rentable si l'on prévoit de nombreuses recherches."}]}
]};

const LOGIQUE = {code:"EP1.2.1", nom:"Logique pour l'informatique", ects:4, h:"34h",
resume:"Les fondations mathématiques du raisonnement informatique : propositions, prédicats, ensembles, relations, induction. C'est le cours qui rend rigoureux tout ce que tu écris ailleurs — conditions de programme, correction d'algorithme, schémas de bases de données.",
chapitres:[
{t:"Logique propositionnelle : syntaxe", obj:["Distinguer variable, formule et connecteur","Formaliser un énoncé en français","Lire une formule sans ambiguïté"], html:`
<h4>Propositions</h4>
<div class="def"><b>Proposition.</b> Énoncé auquel on peut attribuer une valeur de vérité, vrai ou faux, sans ambiguïté.</div>
<p>« 7 est premier » est une proposition (vraie). « Ferme la porte » n'en est pas une. « x est premier » n'en est pas une non plus tant que x n'est pas fixé : c'est un prédicat, objet d'un chapitre ultérieur.</p>
<h4>Connecteurs</h4>
<table><tr><th>Nom</th><th>Notation</th><th>Lecture</th></tr>
<tr><td>négation</td><td>¬p</td><td>non p</td></tr>
<tr><td>conjonction</td><td>p ∧ q</td><td>p et q</td></tr>
<tr><td>disjonction</td><td>p ∨ q</td><td>p ou q (inclusif)</td></tr>
<tr><td>implication</td><td>p → q</td><td>si p alors q</td></tr>
<tr><td>équivalence</td><td>p ↔ q</td><td>p si et seulement si q</td></tr></table>
<h4>Priorités</h4>
<p>Du plus fort au plus faible : ¬, puis ∧, puis ∨, puis →, puis ↔. L'implication est associative à droite. En cas de doute, mets des parenthèses : une formule mal parenthésée est fausse même si l'idée est bonne.</p>
<h4>Formaliser</h4>
<p>« Il est admis s'il a la moyenne et n'est pas défaillant » donne, avec m pour « a la moyenne » et d pour « est défaillant » : (m ∧ ¬d) → a. Attention au français : « ou » est inclusif en logique, alors qu'il est souvent exclusif dans la langue courante (« fromage ou dessert »).</p>
<div class="piege"><b>L'implication piège.</b> p → q est vraie dès que p est fausse. « Si la lune est carrée alors j'ai 20 » est une proposition vraie. Ce n'est pas une causalité, c'est une contrainte : elle interdit seulement le cas p vrai et q faux.</div>`,
retenir:"Une formule propositionnelle se construit avec des variables et cinq connecteurs. Le ou est inclusif, l'implication n'est fausse que dans un seul cas : prémisse vraie, conclusion fausse.",
exos:[{q:"Formalise : « Je vais en TP sauf s'il pleut ».",r:"¬p → t, où p signifie il pleut et t je vais en TP. On peut aussi écrire p ∨ t si l'on considère que l'on va en TP dans tous les autres cas."},{q:"Combien y a-t-il de connecteurs binaires possibles sur deux variables ?",r:"16 : chaque connecteur est déterminé par une colonne de 4 valeurs de vérité, soit 2 puissance 4 possibilités."}]},

{t:"Sémantique, tables de vérité, tautologies", obj:["Construire une table de vérité","Reconnaître tautologie, contradiction, satisfiabilité","Vérifier une équivalence"], html:`
<h4>Valuation</h4>
<div class="def"><b>Valuation.</b> Attribution d'une valeur de vérité à chaque variable. Une formule à n variables admet 2 puissance n valuations, d'où 2 puissance n lignes dans sa table.</div>
<h4>Table de l'implication</h4>
<table><tr><th>p</th><th>q</th><th>p → q</th></tr>
<tr><td>V</td><td>V</td><td>V</td></tr>
<tr><td>V</td><td>F</td><td>F</td></tr>
<tr><td>F</td><td>V</td><td>V</td></tr>
<tr><td>F</td><td>F</td><td>V</td></tr></table>
<h4>Trois statuts</h4>
<ul>
<li><strong>Tautologie</strong> : vraie pour toute valuation. Exemple : p ∨ ¬p.</li>
<li><strong>Contradiction</strong> : fausse partout. Exemple : p ∧ ¬p.</li>
<li><strong>Satisfiable</strong> : vraie pour au moins une valuation.</li>
</ul>
<p>Une formule est une tautologie si et seulement si sa négation est une contradiction, donc insatisfiable. Ce va-et-vient est la base des démonstrateurs automatiques : pour prouver F, on montre que ¬F n'a aucun modèle.</p>
<h4>Équivalences à connaître par cœur</h4>
<ul>
<li>Double négation : ¬¬p ≡ p</li>
<li>De Morgan : ¬(p ∧ q) ≡ ¬p ∨ ¬q &nbsp;et&nbsp; ¬(p ∨ q) ≡ ¬p ∧ ¬q</li>
<li>Implication : p → q ≡ ¬p ∨ q</li>
<li>Contraposée : p → q ≡ ¬q → ¬p</li>
<li>Distributivité : p ∧ (q ∨ r) ≡ (p ∧ q) ∨ (p ∧ r)</li>
<li>Absorption : p ∨ (p ∧ q) ≡ p</li>
</ul>
<h4>Conséquence logique</h4>
<p>Un ensemble d'hypothèses a pour conséquence F lorsque toute valuation qui rend les hypothèses vraies rend aussi F vraie. Vérifier cela revient à montrer que l'implication correspondante est une tautologie.</p>`,
retenir:"Table de vérité = méthode systématique mais exponentielle. Les équivalences de De Morgan et la réécriture de l'implication en ¬p ∨ q servent tous les jours, y compris pour simplifier une condition en C.",
exos:[{q:"(p → q) ∧ (q → r) → (p → r) est-elle une tautologie ?",r:"Oui, c'est la transitivité de l'implication (syllogisme hypothétique). Le seul cas à examiner est p vrai et r faux, et il rend une des hypothèses fausse."},{q:"Donne la contraposée de « si n² est pair alors n est pair ».",r:"Si n est impair alors n² est impair. C'est la forme qu'on démontre effectivement, car elle est plus directe."}]},

{t:"Formes normales et SAT", obj:["Mettre une formule sous forme normale","Comprendre l'intérêt algorithmique des FNC","Situer le problème SAT"], html:`
<h4>Littéraux et clauses</h4>
<div class="def"><b>Littéral.</b> Une variable ou sa négation. <b>Clause.</b> Une disjonction de littéraux. <b>FNC.</b> Une conjonction de clauses.</div>
<p>La forme normale disjonctive (FND) est la structure duale : une disjonction de conjonctions de littéraux.</p>
<h4>Mise sous forme normale conjonctive</h4>
<ol>
<li>Éliminer ↔ puis → en utilisant p → q ≡ ¬p ∨ q.</li>
<li>Pousser les négations vers les variables avec De Morgan et la double négation.</li>
<li>Distribuer ∨ sur ∧.</li>
</ol>
<p>Exemple : ¬(p → q) devient ¬(¬p ∨ q), puis p ∧ ¬q.</p>
<h4>Pourquoi c'est utile</h4>
<p>Une FNC est vraie si et seulement si <em>chaque</em> clause contient au moins un littéral vrai. Cette structure très régulière est celle qu'attendent les solveurs SAT, et elle sert à encoder des problèmes concrets : coloration de graphe, emplois du temps, vérification de circuits.</p>
<h4>Le problème SAT</h4>
<div class="def"><b>SAT.</b> Étant donnée une formule en FNC, existe-t-il une valuation qui la rend vraie ?</div>
<p>SAT est le premier problème dont on a démontré la NP-complétude (théorème de Cook, 1971). Concrètement : on ne connaît pas d'algorithme efficace en toute généralité, mais les solveurs modernes traitent en pratique des instances à des millions de variables. Tu recroiseras ce thème en L3.</p>
<div class="piege"><b>Explosion.</b> Passer d'une FND à une FNC peut multiplier la taille de la formule de façon exponentielle. La transformation de Tseitin contourne le problème en introduisant des variables auxiliaires.</div>`,
retenir:"FNC = et de ou. On y arrive en éliminant les implications, en descendant les négations, puis en distribuant. C'est le format d'entrée universel des outils de raisonnement automatique.",
exos:[{q:"Mets (p ∧ q) → r sous forme normale conjonctive.",r:"¬(p ∧ q) ∨ r, soit ¬p ∨ ¬q ∨ r. C'est déjà une clause unique."},{q:"La formule (p ∨ ¬p) ∧ (q ∨ ¬q) est-elle satisfiable ?",r:"Oui, et même valide : chaque clause contient une variable et sa négation, donc elle est vraie pour toute valuation."}]},

{t:"Méthodes de démonstration", obj:["Choisir une méthode de preuve adaptée","Rédiger une preuve par l'absurde ou par contraposée","Structurer une disjonction de cas"], html:`
<h4>Preuve directe</h4>
<p>Pour montrer p → q, on suppose p et on déduit q par une suite d'implications justifiées. C'est la méthode par défaut, à privilégier quand l'hypothèse est exploitable.</p>
<h4>Contraposée</h4>
<p>Pour montrer p → q, on montre ¬q → ¬p. Utile quand la négation de la conclusion est plus concrète que l'hypothèse. Exemple : « si n² est pair alors n est pair » se prouve en supposant n impair, donc n = 2k+1, donc n² = 4k²+4k+1 est impair.</p>
<h4>Par l'absurde</h4>
<p>On suppose la négation de ce qu'on veut prouver et on dérive une contradiction. La preuve de l'irrationalité de la racine de 2 en est l'exemple canonique : on suppose une écriture fractionnaire irréductible et on aboutit à ce que numérateur et dénominateur sont tous deux pairs.</p>
<div class="piege"><b>Ne confonds pas.</b> Contraposée et absurde ne sont pas la même chose. La contraposée prouve une implication équivalente ; l'absurde ajoute une hypothèse de négation et cherche une contradiction. Beaucoup de copies annoncent l'absurde et font en réalité une contraposée.</div>
<h4>Disjonction de cas</h4>
<p>Si l'on sait que A ∨ B est vraie, il suffit de prouver la conclusion sous A puis sous B. Exemple typique : traiter séparément n pair et n impair.</p>
<h4>Contre-exemple</h4>
<p>Pour réfuter un énoncé universel, un seul contre-exemple suffit. Pour réfuter un énoncé existentiel, il faut au contraire une preuve générale d'impossibilité. Cette asymétrie est une source d'erreurs constante en partiel.</p>
<h4>Rédaction</h4>
<p>Annonce la méthode en une phrase, énonce clairement les hypothèses, justifie chaque étape, et conclus explicitement. Une preuve juste mais illisible perd des points ; une preuve bien structurée aux idées partielles en gagne.</p>`,
retenir:"Directe, contraposée, absurde, cas, contre-exemple : cinq outils, à annoncer explicitement. Réfuter un « pour tout » demande un exemple ; réfuter un « il existe » demande une preuve.",
exos:[{q:"Comment réfuter « tout entier impair est premier » ?",r:"Un contre-exemple suffit : 9 est impair et non premier."},{q:"Prouve que la somme de deux nombres rationnels est rationnelle.",r:"Preuve directe : a/b + c/d = (ad+bc)/(bd) avec b et d non nuls, donc bd non nul, et le résultat s'écrit comme quotient d'entiers."}]},

{t:"Logique des prédicats", obj:["Utiliser les quantificateurs","Nier une formule quantifiée","Repérer l'importance de l'ordre des quantificateurs"], html:`
<h4>Prédicats</h4>
<div class="def"><b>Prédicat.</b> Énoncé dépendant d'une ou plusieurs variables, qui devient une proposition dès que les variables sont fixées ou quantifiées. On note par exemple P(x) : « x est premier ».</div>
<h4>Quantificateurs</h4>
<ul>
<li>∀x P(x) : pour tout x, P(x) est vraie.</li>
<li>∃x P(x) : il existe au moins un x tel que P(x) soit vraie.</li>
</ul>
<p>Le domaine de quantification doit toujours être précisé : « pour tout entier naturel n » et « pour tout réel x » ne disent pas la même chose.</p>
<h4>Négation</h4>
<div class="def"><b>Règle.</b> La négation de ∀x P(x) est ∃x ¬P(x). La négation de ∃x P(x) est ∀x ¬P(x).</div>
<p>Concrètement : on échange les quantificateurs et on nie le corps. Exemple : la négation de « tous les étudiants ont rendu leur TP » est « il existe un étudiant qui n'a pas rendu son TP » — et surtout pas « aucun étudiant n'a rendu son TP ».</p>
<h4>L'ordre compte</h4>
<p>Compare :</p>
<ul>
<li>∀x ∃y (y &gt; x) : pour chaque x on trouve un y plus grand. Vrai dans les entiers.</li>
<li>∃y ∀x (y &gt; x) : il existe un y plus grand que tous. Faux dans les entiers.</li>
</ul>
<p>Dans le premier cas, y peut dépendre de x ; dans le second, il doit être choisi une fois pour toutes. Cette distinction est exactement celle qui rend délicate la définition de la limite en analyse.</p>
<h4>Variables libres et liées</h4>
<p>Dans ∀x P(x, y), la variable x est liée par le quantificateur, y est libre. Une formule sans variable libre est une phrase close : elle a une valeur de vérité bien déterminée.</p>`,
retenir:"Nier une formule quantifiée : on échange ∀ et ∃ en descendant la négation jusqu'au prédicat. L'ordre des quantificateurs change complètement le sens — c'est le point le plus testé en examen.",
exos:[{q:"Nie la formule ∀x ∃y (x + y = 0).",r:"∃x ∀y (x + y ≠ 0). On échange les deux quantificateurs et on nie l'égalité."},{q:"Formalise « il existe un plus petit élément » dans un ensemble E.",r:"∃m ∈ E, ∀x ∈ E, m ≤ x. Le m doit être choisi avant le x, donc l'existentiel est en tête."}]},

{t:"Ensembles, relations, fonctions", obj:["Manipuler les opérations ensemblistes","Reconnaître les propriétés d'une relation","Distinguer injection, surjection, bijection"], html:`
<h4>Ensembles</h4>
<p>Opérations : union, intersection, différence, complémentaire, produit cartésien. L'ensemble des parties de E, noté P(E), contient tous les sous-ensembles de E ; si E a n éléments, P(E) en a 2 puissance n.</p>
<p>Les lois ensemblistes sont les jumelles des lois logiques : l'union correspond au ou, l'intersection au et, le complémentaire à la négation. De Morgan s'applique donc aussi aux ensembles.</p>
<h4>Cardinalité</h4>
<p>Principe d'inclusion-exclusion pour deux ensembles : le cardinal de l'union vaut la somme des cardinaux moins celui de l'intersection. C'est le pont vers le dénombrement du cours de Mathématiques pour l'ingénieur.</p>
<h4>Relations binaires</h4>
<div class="def"><b>Relation.</b> Sous-ensemble du produit cartésien E × F. Une relation sur E peut être réflexive, symétrique, antisymétrique ou transitive.</div>
<table><tr><th>Propriété</th><th>Énoncé</th></tr>
<tr><td>réflexive</td><td>tout élément est en relation avec lui-même</td></tr>
<tr><td>symétrique</td><td>si x R y alors y R x</td></tr>
<tr><td>antisymétrique</td><td>si x R y et y R x alors x = y</td></tr>
<tr><td>transitive</td><td>si x R y et y R z alors x R z</td></tr></table>
<p>Réflexive + symétrique + transitive donne une <strong>relation d'équivalence</strong>, qui partitionne l'ensemble en classes. Réflexive + antisymétrique + transitive donne une <strong>relation d'ordre</strong>.</p>
<p>Ce vocabulaire n'est pas décoratif : la clé primaire d'une table, l'égalité de deux objets, la comparaison servant à trier reposent toutes sur ces propriétés.</p>
<h4>Applications</h4>
<ul>
<li><strong>Injective</strong> : deux éléments distincts ont des images distinctes.</li>
<li><strong>Surjective</strong> : tout élément d'arrivée est atteint.</li>
<li><strong>Bijective</strong> : les deux à la fois ; il existe alors une application réciproque.</li>
</ul>
<p>Une fonction de hachage n'est pas injective : deux clés différentes peuvent donner la même case. C'est précisément ce qu'on appelle une collision, et le semestre 2 expliquera comment la gérer.</p>`,
retenir:"Équivalence = réflexive, symétrique, transitive, et elle découpe l'ensemble en classes. Ordre = réflexive, antisymétrique, transitive. Injective, surjective, bijective : à savoir énoncer sans hésiter.",
exos:[{q:"La relation « a le même reste que » modulo 5 sur les entiers est-elle une équivalence ?",r:"Oui. Elle est réflexive, symétrique et transitive, et ses classes sont les 5 classes de congruence modulo 5."},{q:"La divisibilité sur les entiers naturels est-elle une relation d'ordre ?",r:"Oui : réflexive, antisymétrique sur les naturels, transitive. C'est un ordre partiel car 2 et 3 ne sont pas comparables."}]},

{t:"Récurrence et induction structurelle", obj:["Rédiger une récurrence complète","Utiliser la récurrence forte","Raisonner par induction sur une structure"], html:`
<h4>Récurrence simple</h4>
<p>Pour prouver qu'une propriété P(n) est vraie pour tout entier n à partir d'un rang initial :</p>
<ol>
<li><strong>Initialisation</strong> : montrer P au rang initial.</li>
<li><strong>Hérédité</strong> : supposer P(n) et montrer P(n+1).</li>
<li><strong>Conclusion</strong> : énoncer que P est vraie pour tout n.</li>
</ol>
<p>Les trois étapes doivent apparaître explicitement dans la copie. Une hérédité sans initialisation ne prouve rien : « n = n+1 » est héréditaire et pourtant fausse.</p>
<h4>Récurrence forte</h4>
<p>On suppose la propriété vraie pour <em>tous</em> les rangs jusqu'à n pour prouver le rang n+1. Indispensable quand l'étape n+1 dépend de plusieurs rangs antérieurs, comme pour la suite de Fibonacci ou pour montrer que tout entier supérieur à 1 admet un diviseur premier.</p>
<h4>Induction structurelle</h4>
<div class="def"><b>Principe.</b> Sur un ensemble défini inductivement (listes, arbres, formules), on prouve la propriété sur les cas de base, puis on la propage aux constructeurs en la supposant sur les sous-structures.</div>
<p>Exemple sur les listes : une liste est soit vide, soit un élément suivi d'une liste. Pour prouver une propriété sur toutes les listes, on la montre sur la liste vide, puis on la montre sur « élément suivi de L » en la supposant vraie sur L.</p>
<p>C'est le principe qui justifie la correction des fonctions récursives sur les arbres au semestre 2. Récursivité et induction sont la même idée vue depuis le programme et depuis la preuve.</p>
<h4>Erreurs fréquentes</h4>
<ul>
<li>Oublier l'initialisation.</li>
<li>Utiliser P(n+1) dans la preuve de l'hérédité (raisonnement circulaire).</li>
<li>Confondre l'hypothèse de récurrence avec la conclusion recherchée.</li>
</ul>`,
retenir:"Trois étapes, toujours rédigées : initialisation, hérédité, conclusion. Récurrence forte quand plusieurs rangs interviennent, induction structurelle sur listes et arbres.",
exos:[{q:"Prouve par récurrence que la somme des n premiers entiers vaut n(n+1)/2.",r:"Initialisation à n=1 : 1 = 1×2/2. Hérédité : si la somme jusqu'à n vaut n(n+1)/2, ajouter n+1 donne (n+1)(n+2)/2. Conclusion pour tout n ≥ 1."},{q:"Pourquoi la récurrence forte est-elle nécessaire pour la suite de Fibonacci ?",r:"Parce que le terme de rang n+1 dépend des rangs n et n-1 : l'hypothèse portant sur le seul rang n ne suffit pas."}]},

{t:"Algèbre de Boole et circuits", obj:["Relier logique et électronique","Simplifier une expression booléenne","Lire une table de Karnaugh"], html:`
<h4>Le pont avec l'architecture</h4>
<p>L'algèbre de Boole utilise les mêmes lois que la logique propositionnelle, avec une notation multiplicative : le produit pour le et, la somme pour le ou, la barre pour le non. Les valeurs sont 0 et 1, ce qui permet de réaliser physiquement les opérations par des transistors.</p>
<h4>Lois utiles</h4>
<ul>
<li>Neutres : a + 0 = a, a × 1 = a</li>
<li>Absorbants : a + 1 = 1, a × 0 = 0</li>
<li>Idempotence : a + a = a, a × a = a</li>
<li>Complément : a + ā = 1, a × ā = 0</li>
<li>Absorption : a + a×b = a</li>
<li>De Morgan sous forme booléenne</li>
</ul>
<h4>Simplification</h4>
<p>Simplifier une expression, c'est réduire le nombre de portes du circuit : moins de composants, moins de délai, moins de consommation. La méthode algébrique fonctionne mais demande de l'astuce ; les tables de Karnaugh la rendent systématique jusqu'à quatre variables.</p>
<h4>Table de Karnaugh</h4>
<p>On dispose les 2 puissance n valuations dans un tableau où deux cases voisines ne diffèrent que d'une variable (code de Gray). On regroupe ensuite les 1 par blocs rectangulaires de taille une puissance de deux, aussi grands que possible. Chaque bloc donne un terme où les variables qui changent disparaissent.</p>
<h4>Fonctions complètes</h4>
<p>Le NON-ET est <strong>universel</strong> : toute fonction booléenne peut s'exprimer uniquement avec des NON-ET. C'est pour cela que les circuits industriels s'appuient massivement sur ces portes. Le NON-OU l'est également.</p>`,
retenir:"Algèbre de Boole = logique propositionnelle en notation arithmétique. Simplifier, c'est économiser des portes. Le NON-ET seul suffit à tout construire.",
exos:[{q:"Simplifie a×b + a×b̄.",r:"a. On factorise par a et b + b̄ vaut 1."},{q:"Exprime le NON avec un seul NON-ET.",r:"En reliant les deux entrées ensemble : NON-ET(a, a) donne non a."}]}
]};

const ARCHI = {code:"EP1.2.2", nom:"Architecture et système", ects:4, h:"10h CM · 10h TD · 6h TP",
resume:"Comment une machine exécute réellement ton programme : représentation des données en binaire, portes logiques, processeur, mémoire, et premières notions de système d'exploitation. Ce cours explique les bizarreries que tu constates en C.",
chapitres:[
{t:"Bases de numération", obj:["Convertir entre binaire, décimal et hexadécimal","Comprendre le rôle de l'hexadécimal","Compter en puissances de deux"], html:`
<h4>Pourquoi le binaire</h4>
<p>Un transistor distingue de façon fiable deux états : passant ou bloqué. Toute l'information est donc codée en base 2. Un <strong>bit</strong> est un chiffre binaire, un <strong>octet</strong> vaut 8 bits et représente 256 valeurs distinctes.</p>
<h4>Binaire vers décimal</h4>
<p>Chaque position vaut une puissance de deux. Ainsi 1011 en binaire vaut 8 + 0 + 2 + 1 = 11.</p>
<h4>Décimal vers binaire</h4>
<p>Divisions successives par 2, en lisant les restes de bas en haut. Pour 25 : 25 donne reste 1, 12 donne 0, 6 donne 0, 3 donne 1, 1 donne 1, soit 11001.</p>
<h4>Hexadécimal</h4>
<p>Base 16, chiffres 0 à 9 puis A à F. Son intérêt : un chiffre hexadécimal correspond exactement à 4 bits, donc un octet s'écrit avec deux chiffres. La conversion se fait par paquets de quatre bits, sans calcul.</p>
<table><tr><th>Hex</th><th>Binaire</th><th>Déc</th></tr>
<tr><td>0</td><td>0000</td><td>0</td></tr>
<tr><td>7</td><td>0111</td><td>7</td></tr>
<tr><td>A</td><td>1010</td><td>10</td></tr>
<tr><td>F</td><td>1111</td><td>15</td></tr></table>
<p>Exemple : 1011 0110 se lit B6, soit 182 en décimal.</p>
<h4>Puissances de deux à connaître</h4>
<p>2^10 = 1024, 2^16 = 65 536, 2^20 environ un million, 2^32 environ 4 milliards. Ces repères expliquent les tailles de mémoire, les plages d'entiers et le nombre d'adresses IPv4.</p>
<div class="piege"><b>Ko ou Kio.</b> 1 kibioctet vaut 1024 octets, 1 kilooctet vaut 1000 octets. Les constructeurs de disques utilisent la seconde définition, les systèmes souvent la première : d'où l'écart de capacité affichée.</div>`,
retenir:"Binaire pour la machine, hexadécimal pour l'humain qui lit de la mémoire. Un chiffre hexa = 4 bits, un octet = 2 chiffres hexa = 256 valeurs.",
exos:[{q:"Convertis 2F en binaire puis en décimal.",r:"2 donne 0010 et F donne 1111, soit 00101111, c'est-à-dire 32 + 8 + 4 + 2 + 1 = 47."},{q:"Combien de valeurs distinctes tiennent sur 12 bits ?",r:"2 puissance 12 = 4096 valeurs, de 0 à 4095 si l'on code des entiers non signés."}]},

{t:"Entiers signés et complément à deux", obj:["Coder un entier négatif","Expliquer le débordement","Comprendre l'asymétrie des bornes"], html:`
<h4>Le problème</h4>
<p>Sur n bits on peut coder 2 puissance n motifs. Il faut décider comment y placer les négatifs. Les représentations naïves (bit de signe, complément à un) ont deux codages du zéro et compliquent l'addition.</p>
<h4>Complément à deux</h4>
<div class="def"><b>Règle.</b> Pour obtenir l'opposé d'un nombre, on inverse tous ses bits puis on ajoute 1.</div>
<p>Sur 8 bits : 5 s'écrit 0000 0101 ; en inversant on obtient 1111 1010 ; en ajoutant 1, 1111 1011, qui code -5.</p>
<p>Le bit de poids fort joue le rôle de signe : 0 pour positif, 1 pour négatif. Mais sa valeur est négative dans la somme pondérée, ce qui rend l'addition ordinaire directement correcte pour les signés comme pour les non signés — c'est tout l'intérêt du procédé, un seul additionneur suffit.</p>
<h4>Bornes</h4>
<p>Sur n bits, les valeurs vont de -2^(n-1) à 2^(n-1) - 1. Sur 8 bits : de -128 à 127. Il y a un négatif de plus que de positifs, car le zéro occupe une place du côté positif.</p>
<h4>Débordement</h4>
<p>Additionner 127 et 1 sur 8 bits donne 1000 0000, soit -128. Le résultat « boucle ». Le processeur positionne un indicateur de débordement, mais le C ne le vérifie pas pour toi : c'est un comportement indéfini pour les entiers signés.</p>
<div class="piege"><b>Décalage.</b> Décaler à gauche multiplie par deux, décaler à droite divise par deux (en tronquant). Sur les entiers signés, le décalage à droite doit propager le bit de signe, sinon un nombre négatif devient positif.</div>
<h4>Lien avec le C</h4>
<p>Comparer un <code>int</code> et un <code>unsigned int</code> convertit le signé en non signé : -1 devient la plus grande valeur possible. Un test <code>if (i &lt; taille)</code> où taille est non signé peut donc se comporter à l'inverse de l'intuition.</p>`,
retenir:"Complément à deux : inverser puis ajouter 1. Un seul zéro, un négatif de plus que de positifs, addition unifiée. Le débordement ne lève pas d'erreur, il donne un résultat faux.",
exos:[{q:"Code -20 sur 8 bits.",r:"20 s'écrit 0001 0100 ; inversé, 1110 1011 ; plus 1, 1110 1100."},{q:"Que vaut (char)(200) sur une machine où char est signé sur 8 bits ?",r:"200 dépasse 127 : le motif 1100 1000 est interprété comme -56."}]},

{t:"Nombres flottants (IEEE 754)", obj:["Décomposer un flottant en signe, exposant, mantisse","Expliquer les erreurs d'arrondi","Comparer des flottants correctement"], html:`
<h4>Le format</h4>
<p>Un flottant simple précision occupe 32 bits : 1 bit de signe, 8 bits d'exposant biaisé, 23 bits de mantisse. En double précision, 64 bits : 1, 11 et 52. La valeur s'obtient comme un signe multiplié par une mantisse comprise entre 1 et 2, multipliée par deux à la puissance de l'exposant.</p>
<h4>Pourquoi 0,1 + 0,2 ne fait pas 0,3</h4>
<p>Un dixième n'a pas d'écriture binaire finie, exactement comme un tiers n'a pas d'écriture décimale finie. Le nombre stocké est donc une approximation, et les erreurs se cumulent. En C, l'addition affiche 0.30000000000000004.</p>
<div class="piege"><b>Ne teste jamais l'égalité de deux flottants.</b> Écris à la place que la valeur absolue de la différence est inférieure à une petite tolérance adaptée à l'ordre de grandeur des données.</div>
<h4>Valeurs spéciales</h4>
<p>Le format réserve des motifs pour l'infini positif, l'infini négatif et NaN (résultat indéfini, par exemple zéro divisé par zéro). Particularité : NaN n'est égal à rien, pas même à lui-même — c'est d'ailleurs un test possible pour le détecter.</p>
<h4>Précision</h4>
<p>Un flottant simple précision offre environ 7 chiffres décimaux significatifs, un double environ 16. Au-delà, les chiffres affichés n'ont plus de sens. Pour de l'argent, on n'utilise donc pas de flottants mais des entiers en centimes.</p>
<h4>Absorption</h4>
<p>Ajouter un très petit nombre à un très grand peut ne rien changer : le petit est absorbé. L'ordre des additions influence donc le résultat, ce qui rend l'addition flottante non associative.</p>`,
retenir:"Signe, exposant, mantisse. Les flottants sont des approximations : on ne teste pas leur égalité, on ne s'en sert pas pour de l'argent, et l'ordre des opérations compte.",
exos:[{q:"Pourquoi une boucle for avec un compteur flottant incrémenté de 0.1 est-elle risquée ?",r:"Parce que 0.1 n'est pas représentable exactement : l'accumulation d'erreurs peut faire manquer la valeur d'arrêt. Il faut compter en entiers."},{q:"Comment tester si un double x vaut environ 1 ?",r:"En testant que la valeur absolue de x - 1 est inférieure à une tolérance, par exemple 1e-9."}]},

{t:"Codage des caractères", obj:["Distinguer ASCII, ISO-8859 et UTF-8","Comprendre pourquoi les accents se cassent","Relier caractère et entier"], html:`
<h4>ASCII</h4>
<p>Codage historique sur 7 bits, 128 caractères : chiffres, lettres non accentuées, ponctuation, caractères de contrôle. Points de repère : le chiffre 0 vaut 48, la lettre A majuscule 65, la lettre a minuscule 97. L'écart de 32 entre majuscule et minuscule correspond à un seul bit.</p>
<h4>Le problème des accents</h4>
<p>128 caractères ne suffisent pas au français, encore moins au grec ou au japonais. Les normes ISO-8859 ont ajouté un huitième bit, mais chaque région avait sa table : un même octet ne désignait pas le même caractère selon le pays.</p>
<h4>Unicode et UTF-8</h4>
<div class="def"><b>Unicode</b> attribue un numéro unique à chaque caractère de toutes les écritures. <b>UTF-8</b> est une manière de coder ces numéros en octets, avec 1 à 4 octets selon le caractère.</div>
<p>UTF-8 est rétrocompatible avec ASCII : les 128 premiers caractères s'y codent sur un seul octet identique. Les caractères accentués prennent deux octets. C'est pourquoi <code>strlen</code> sur une chaîne UTF-8 renvoie un nombre d'octets, pas un nombre de caractères.</p>
<h4>Les caractères bizarres</h4>
<p>Quand un texte UTF-8 est lu comme du ISO-8859, chaque caractère accentué apparaît sous forme de deux symboles étranges. C'est la signature d'un décalage d'encodage entre le producteur et le lecteur du fichier.</p>
<h4>En pratique</h4>
<p>Fixe l'encodage partout : ton éditeur, ton terminal, la base de données, la page web. UTF-8 partout est le choix par défaut aujourd'hui.</p>`,
retenir:"Un caractère est un entier. ASCII sur 7 bits, UTF-8 pour tout le reste avec un nombre variable d'octets. Les caractères illisibles trahissent presque toujours un conflit d'encodage.",
exos:[{q:"Quelle opération transforme 'a' en 'A' en ASCII ?",r:"Soustraire 32, ou de façon plus robuste utiliser toupper de ctype.h."},{q:"Combien d'octets occupe la chaîne « été » en UTF-8, sans le caractère nul ?",r:"5 octets : deux caractères accentués sur 2 octets chacun, plus le t sur 1 octet."}]},

{t:"Portes logiques et circuits combinatoires", obj:["Décrire les portes de base","Construire un additionneur","Comprendre le rôle d'un multiplexeur"], html:`
<h4>Les portes</h4>
<p>ET, OU, NON, OU exclusif, NON-ET, NON-OU. Chacune réalise une fonction booléenne du chapitre de Logique, mais physiquement, avec des transistors et un temps de propagation non nul.</p>
<h4>Circuit combinatoire</h4>
<div class="def"><b>Combinatoire.</b> La sortie ne dépend que des entrées présentes, sans mémoire du passé.</div>
<h4>Demi-additionneur et additionneur complet</h4>
<p>Le demi-additionneur additionne deux bits : la somme est un OU exclusif, la retenue un ET. L'additionneur complet ajoute la retenue entrante et se construit avec deux demi-additionneurs et un OU. En chaînant n additionneurs complets, on obtient un additionneur n bits, qui est le cœur de l'unité arithmétique et logique.</p>
<h4>Multiplexeur et décodeur</h4>
<p>Un multiplexeur choisit une entrée parmi plusieurs selon des bits de commande : c'est l'équivalent matériel d'un <code>switch</code>. Un décodeur active une sortie parmi 2 puissance n en fonction de n bits d'entrée : il sert notamment à sélectionner une case mémoire à partir d'une adresse.</p>
<h4>Temps de propagation</h4>
<p>Chaque porte introduit un délai. Le chemin le plus long du circuit, appelé chemin critique, fixe la fréquence maximale d'horloge. C'est la raison pour laquelle les additionneurs réels utilisent des techniques d'anticipation de retenue plutôt que la propagation simple.</p>`,
retenir:"Combinatoire = pas de mémoire. Somme par OU exclusif, retenue par ET : de là se déduit toute l'arithmétique matérielle. Le chemin critique borne la fréquence.",
exos:[{q:"Quelle porte réalise la somme dans un demi-additionneur ?",r:"Le OU exclusif : 1 seulement si exactement une des deux entrées vaut 1."},{q:"Combien de sorties a un décodeur à 3 entrées ?",r:"8 sorties, une seule active à la fois selon la combinaison des 3 bits."}]},

{t:"Circuits séquentiels et horloge", obj:["Distinguer combinatoire et séquentiel","Décrire une bascule","Comprendre le rôle du signal d'horloge"], html:`
<h4>Ajouter de la mémoire</h4>
<div class="def"><b>Séquentiel.</b> La sortie dépend des entrées et de l'état interne, donc de l'histoire passée du circuit.</div>
<p>On obtient un état en rebouclant une sortie sur une entrée. Le verrou le plus simple se construit avec deux portes NON-OU croisées et mémorise un bit.</p>
<h4>Bascules</h4>
<p>Une bascule D synchrone recopie son entrée sur son front d'horloge et la conserve jusqu'au front suivant. C'est la brique élémentaire des registres : n bascules côte à côte forment un registre n bits.</p>
<h4>Horloge</h4>
<p>Le signal d'horloge cadence l'ensemble. À chaque front, les registres se mettent à jour simultanément avec les résultats calculés par la logique combinatoire pendant le cycle précédent. La période doit être supérieure au délai du chemin critique, sinon les valeurs capturées sont fausses.</p>
<p>Une fréquence de 3 GHz signifie 3 milliards de fronts par seconde, soit environ 0,33 nanoseconde par cycle. Pendant ce temps, la lumière parcourt une dizaine de centimètres : les distances physiques sur la puce commencent à compter.</p>
<h4>Compteurs et registres à décalage</h4>
<p>Un compteur incrémente son état à chaque cycle ; il sert notamment de compteur ordinal dans le processeur. Un registre à décalage déplace ses bits d'une position par cycle, ce qui permet multiplications et divisions par deux, et la conversion série-parallèle des communications.</p>`,
retenir:"Séquentiel = combinatoire + état mémorisé. La bascule D capture sur front d'horloge ; la fréquence maximale est fixée par le chemin critique combinatoire.",
exos:[{q:"Pourquoi ne peut-on pas augmenter indéfiniment la fréquence d'un processeur ?",r:"Parce que le délai du chemin critique et la dissipation thermique imposent une limite. D'où le passage au parallélisme par plusieurs cœurs."},{q:"Combien de bascules pour un registre de 32 bits ?",r:"32, une par bit."}]},

{t:"Architecture du processeur", obj:["Décrire le modèle de von Neumann","Suivre le cycle d'instruction","Lire un extrait d'assembleur"], html:`
<h4>Modèle de von Neumann</h4>
<p>Une mémoire unique contient à la fois les instructions et les données. Le processeur, composé d'une unité de commande et d'une unité arithmétique et logique, y accède par un bus. Cette unicité est ce qui rend un ordinateur programmable, mais elle crée aussi un goulet d'étranglement entre processeur et mémoire.</p>
<h4>Registres</h4>
<p>Petites mémoires internes au processeur, extrêmement rapides et peu nombreuses. Le <strong>compteur ordinal</strong> contient l'adresse de la prochaine instruction, le <strong>registre d'instruction</strong> l'instruction en cours, et un registre d'état conserve les indicateurs (résultat nul, négatif, retenue, débordement).</p>
<h4>Cycle d'exécution</h4>
<ol>
<li><strong>Recherche</strong> : lire l'instruction à l'adresse du compteur ordinal.</li>
<li><strong>Décodage</strong> : déterminer l'opération et les opérandes.</li>
<li><strong>Exécution</strong> : réaliser l'opération dans l'unité arithmétique.</li>
<li><strong>Écriture</strong> : ranger le résultat, puis avancer le compteur ordinal.</li>
</ol>
<p>Les processeurs réels enchaînent ces phases en <em>pipeline</em> : pendant qu'une instruction s'exécute, la suivante est décodée et une troisième est chargée. Un branchement casse ce flux, d'où l'existence de la prédiction de branchement.</p>
<h4>Jeu d'instructions</h4>
<p>Quelques familles suffisent : transfert mémoire-registre, arithmétique et logique, branchements conditionnels ou inconditionnels, appels de sous-programme. Tout ton code C se réduit à ces opérations.</p>
<pre><code>; pseudo-assembleur : calcul de a + b
LOAD  R1, a      ; charger a dans le registre R1
LOAD  R2, b
ADD   R3, R1, R2 ; R3 = R1 + R2
STORE R3, c      ; ranger dans c</code></pre>
<h4>CISC et RISC</h4>
<p>Les architectures CISC (x86) offrent des instructions nombreuses et complexes ; les RISC (ARM, RISC-V) un jeu réduit et régulier, plus facile à pipeliner. La plupart des processeurs actuels traduisent en interne vers des micro-opérations de style RISC.</p>`,
retenir:"Un processeur répète indéfiniment : chercher, décoder, exécuter, écrire. Le compteur ordinal dit où on en est. Toute abstraction de haut niveau finit en transferts, calculs et branchements.",
exos:[{q:"Que se passe-t-il dans le compteur ordinal lors d'un branchement ?",r:"Il reçoit l'adresse de destination au lieu d'être simplement incrémenté, ce qui rompt la séquence."},{q:"Pourquoi un appel de fonction est-il plus coûteux qu'une addition ?",r:"Il faut sauvegarder l'adresse de retour et le contexte, empiler les paramètres, effectuer un branchement, puis restaurer au retour."}]},

{t:"Hiérarchie mémoire", obj:["Ordonner les niveaux de mémoire","Expliquer le principe de localité","Relier cache et performance du code"], html:`
<h4>Le compromis</h4>
<p>Une mémoire rapide est chère et petite ; une mémoire vaste est lente. On empile donc les niveaux :</p>
<table><tr><th>Niveau</th><th>Taille</th><th>Temps d'accès</th></tr>
<tr><td>Registres</td><td>quelques centaines d'octets</td><td>1 cycle</td></tr>
<tr><td>Cache L1</td><td>dizaines de Ko</td><td>quelques cycles</td></tr>
<tr><td>Cache L2 / L3</td><td>Mo</td><td>dizaines de cycles</td></tr>
<tr><td>Mémoire vive</td><td>Go</td><td>centaines de cycles</td></tr>
<tr><td>Disque SSD</td><td>To</td><td>des millions de cycles</td></tr></table>
<h4>Principe de localité</h4>
<div class="def"><b>Localité temporelle</b> : une donnée utilisée récemment le sera probablement à nouveau. <b>Localité spatiale</b> : une donnée voisine d'une donnée utilisée le sera probablement aussi.</div>
<p>Le cache exploite ces deux régularités : il charge des blocs entiers (lignes de cache) et conserve les données récentes. C'est ce qui fait que le cache fonctionne, alors qu'il ne contient qu'une fraction infime de la mémoire.</p>
<h4>Conséquence pour ton code</h4>
<p>Parcourir un tableau à deux dimensions ligne par ligne respecte la localité spatiale ; le parcourir colonne par colonne saute d'une ligne de cache à l'autre à chaque accès. La différence de temps peut atteindre un facteur dix pour un code strictement équivalent au sens algorithmique.</p>
<h4>Mémoire virtuelle</h4>
<p>Chaque processus voit un espace d'adressage continu qui lui est propre. Le système et le matériel traduisent ces adresses virtuelles en adresses physiques, page par page. Cela isole les processus les uns des autres et permet d'utiliser plus de mémoire que la mémoire vive disponible. Le cours de Systèmes d'exploitation du semestre 2 y revient en détail.</p>`,
retenir:"Plus c'est rapide, plus c'est petit. Le cache marche grâce à la localité. Deux algorithmes de même complexité peuvent avoir des performances très différentes selon leur motif d'accès mémoire.",
exos:[{q:"Pourquoi le parcours colonne par colonne d'une matrice est-il plus lent en C ?",r:"Parce que le stockage est par lignes : passer à la ligne suivante fait sortir de la ligne de cache chargée, provoquant un défaut de cache à chaque accès."},{q:"Que signifie un défaut de cache ?",r:"La donnée demandée n'est pas dans le cache : il faut aller la chercher au niveau inférieur, ce qui coûte beaucoup plus de cycles."}]},

{t:"Premières notions de système", obj:["Situer le rôle du système d'exploitation","Distinguer mode noyau et mode utilisateur","Comprendre l'appel système"], html:`
<h4>Rôle du système</h4>
<p>Le système d'exploitation est l'intermédiaire entre les programmes et le matériel. Il gère les processus, la mémoire, les fichiers, les périphériques, et arbitre l'accès aux ressources partagées.</p>
<h4>Deux modes d'exécution</h4>
<p>Le processeur distingue le <strong>mode noyau</strong>, où toutes les instructions sont permises, et le <strong>mode utilisateur</strong>, où les accès matériels directs sont interdits. Un programme ordinaire s'exécute en mode utilisateur ; c'est cette séparation qui empêche une application de lire la mémoire d'une autre ou d'écraser le système.</p>
<h4>Appel système</h4>
<div class="def"><b>Appel système.</b> Mécanisme par lequel un programme demande un service au noyau : ouvrir un fichier, allouer de la mémoire, créer un processus. Il provoque un basculement contrôlé en mode noyau.</div>
<p>Quand tu écris <code>printf</code>, la bibliothèque standard finit par effectuer un appel système d'écriture. Le coût d'un appel système est très supérieur à celui d'un appel de fonction ordinaire, d'où l'usage de tampons.</p>
<h4>Interruptions</h4>
<p>Un périphérique qui a terminé son travail interrompt le processeur, qui suspend le programme en cours et exécute une routine de traitement. C'est aussi une interruption d'horloge périodique qui permet au système de reprendre la main et de changer de processus, donnant l'illusion du parallélisme.</p>
<h4>Ce qui suit</h4>
<p>Le semestre 2 approfondit tout cela : ordonnancement, pagination, systèmes de fichiers, concurrence. Le module Environnement Linux, lui, te fait manipuler ces notions en ligne de commande dès ce semestre.</p>`,
retenir:"Le système protège et arbitre. Mode utilisateur pour tes programmes, mode noyau pour le système, appel système pour passer de l'un à l'autre. Les interruptions rendent le multitâche possible.",
exos:[{q:"Pourquoi un programme utilisateur ne peut-il pas écrire directement sur le disque ?",r:"Parce qu'il s'exécute en mode utilisateur : l'accès matériel est réservé au noyau, qui vérifie les droits avant d'agir."},{q:"Pourquoi printf n'écrit-il pas toujours immédiatement à l'écran ?",r:"La sortie est tamponnée pour limiter le nombre d'appels système. Le tampon est vidé à la fin de la ligne, quand il est plein, ou par fflush."}]}
]};
const CALCULUS_BASE = {code:"EP1.3.1", nom:"Calculus et raisonnement", ects:4, h:"10h CM · 30h TD",
resume:"Le socle mathématique : logique du raisonnement, suites, limites, dérivation, intégration. Beaucoup de choses vues en Terminale, mais reprises avec un niveau d'exigence sur la rédaction et les démonstrations qui est le vrai saut du lycée à la fac.",
chapitres:[
{t:"Raisonnement et rédaction mathématique", obj:["Rédiger une démonstration acceptable","Utiliser correctement quantificateurs et implications","Distinguer condition nécessaire et suffisante"], html:`
<h4>Le saut lycée-fac</h4>
<p>Au lycée, on demande souvent le résultat. En licence, on demande le <em>raisonnement</em> : chaque affirmation doit être justifiée par une définition, un théorème ou une hypothèse. Une réponse juste sans justification vaut peu de points ; une démarche correcte incomplète en vaut beaucoup.</p>
<h4>Vocabulaire</h4>
<ul>
<li><strong>Nécessaire</strong> : « q est nécessaire à p » signifie p → q. Sans q, pas de p.</li>
<li><strong>Suffisante</strong> : « p est suffisante pour q » signifie aussi p → q, vu de l'autre côté.</li>
<li><strong>Nécessaire et suffisante</strong> : équivalence, notée « si et seulement si ». Se prouve par double implication.</li>
</ul>
<h4>Symboles et connecteurs</h4>
<p>Les symboles logiques sont des abréviations, pas un style d'écriture. Une copie remplie de flèches sans phrases est illisible. Écris des phrases, en réservant les symboles aux énoncés formels.</p>
<h4>Structure d'une preuve</h4>
<ol>
<li>Annoncer ce qu'on veut montrer et la méthode.</li>
<li>Poser les hypothèses et les notations.</li>
<li>Enchaîner les étapes justifiées.</li>
<li>Conclure explicitement.</li>
</ol>
<h4>Analyse-synthèse</h4>
<p>Pour résoudre « trouver tous les x tels que... », on procède souvent en deux temps : l'analyse suppose qu'une solution existe et en déduit sa forme nécessaire ; la synthèse vérifie que les candidats trouvés conviennent effectivement. Sauter la synthèse est une faute fréquente, car l'analyse ne donne que des conditions nécessaires.</p>
<div class="piege"><b>Réciproque.</b> Une implication et sa réciproque n'ont aucune raison d'être toutes deux vraies. Pour une équivalence, il faut prouver les deux sens, ou justifier que chaque étape est réversible.</div>`,
retenir:"On note l'implication dans le bon sens, on distingue nécessaire et suffisant, on prouve une équivalence par double implication, et on n'oublie jamais la synthèse après l'analyse.",
exos:[{q:"« x² = 4 » est-elle une condition nécessaire ou suffisante à « x = 2 » ?",r:"Nécessaire : x = 2 implique x² = 4, mais pas l'inverse puisque x = -2 convient aussi."},{q:"Pourquoi l'élévation au carré n'est-elle pas une équivalence ?",r:"Parce qu'elle n'est pas injective sur les réels : elle peut introduire des solutions parasites. D'où l'obligation de vérifier les solutions à la fin."}]},

{t:"Suites numériques", obj:["Étudier monotonie et bornes","Calculer une limite","Utiliser les suites arithmético-géométriques"], html:`
<h4>Définitions</h4>
<p>Une suite associe à chaque entier n un réel. Elle peut être définie explicitement par une formule, ou par récurrence à partir d'un premier terme et d'une relation entre termes consécutifs.</p>
<h4>Monotonie</h4>
<p>Trois méthodes : étudier le signe de la différence entre deux termes consécutifs ; comparer leur quotient à 1 si tous les termes sont strictement positifs ; ou, pour une suite explicite, étudier la fonction associée.</p>
<h4>Convergence</h4>
<div class="def"><b>Théorème de la limite monotone.</b> Toute suite croissante et majorée converge. Toute suite décroissante et minorée converge.</div>
<p>Ce théorème donne l'existence de la limite sans en donner la valeur : il faut ensuite passer à la limite dans la relation de récurrence pour l'identifier.</p>
<h4>Suites usuelles</h4>
<ul>
<li><strong>Arithmétique</strong> : chaque terme s'obtient en ajoutant une raison. Terme général affine en n, somme des n premiers termes égale au nombre de termes fois la demi-somme des extrêmes.</li>
<li><strong>Géométrique</strong> : chaque terme s'obtient en multipliant par une raison q. Elle converge vers 0 si la valeur absolue de q est strictement inférieure à 1, diverge si elle est strictement supérieure à 1.</li>
<li><strong>Arithmético-géométrique</strong> : on cherche le point fixe de la relation, on soustrait, et la suite des écarts devient géométrique.</li>
</ul>
<h4>Théorèmes de comparaison</h4>
<p>Encadrement : si une suite est coincée entre deux suites de même limite, elle converge vers cette limite. Comparaison : si une suite minore une suite qui tend vers l'infini, elle tend aussi vers l'infini.</p>
<h4>Lien informatique</h4>
<p>Le nombre d'itérations d'une boucle est une suite ; sa convergence est la terminaison de l'algorithme. Le temps de calcul d'un algorithme récursif s'exprime par une relation de récurrence, exactement du même type.</p>`,
retenir:"Croissante et majorée implique convergente. Pour une suite définie par récurrence : conjecturer la limite en résolvant l'équation de point fixe, puis prouver la convergence.",
exos:[{q:"La suite définie par u(n+1) = (u(n) + 2) / 2 avec u(0) = 0 converge-t-elle ?",r:"Oui, vers 2 : elle est croissante et majorée par 2, et le point fixe de l'équation x = (x+2)/2 est x = 2."},{q:"Que vaut la somme des n premiers termes d'une géométrique de raison 2 partant de 1 ?",r:"2 puissance n moins 1. C'est la formule qui donne aussi le nombre de nœuds d'un arbre binaire complet."}]},

{t:"Limites et continuité", obj:["Calculer des limites avec les formes indéterminées","Utiliser le théorème des valeurs intermédiaires","Comprendre la continuité"], html:`
<h4>Limite d'une fonction</h4>
<p>Dire que f tend vers L en un point signifie qu'on peut rendre l'écart entre f(x) et L aussi petit qu'on veut à condition de prendre x assez proche du point. La formalisation avec deux quantificateurs imbriqués est exactement la structure vue en Logique : le second choix dépend du premier.</p>
<h4>Formes indéterminées</h4>
<p>Les quatre classiques : infini moins infini, zéro fois infini, quotient de deux infinis, quotient de deux zéros. Techniques de levée : factoriser par le terme dominant, utiliser la quantité conjuguée pour les racines, reconnaître un taux d'accroissement, ou passer par les croissances comparées.</p>
<h4>Croissances comparées</h4>
<p>En l'infini, le logarithme est négligeable devant toute puissance, toute puissance est négligeable devant l'exponentielle. Cette hiérarchie est celle-là même qui classe les complexités algorithmiques : logarithmique, polynomiale, exponentielle.</p>
<h4>Continuité</h4>
<div class="def"><b>Continuité en un point.</b> f est continue en a lorsque la limite de f en a existe et vaut f(a).</div>
<p>Les fonctions usuelles sont continues sur leur domaine, et les sommes, produits, quotients et composées de fonctions continues le restent. On ne redémontre donc presque jamais la continuité à la main.</p>
<h4>Théorème des valeurs intermédiaires</h4>
<p>Si f est continue sur un intervalle fermé et change de signe entre les bornes, elle s'annule au moins une fois. Avec la stricte monotonie, la solution est unique.</p>
<p>La démonstration classique procède par <strong>dichotomie</strong> : on coupe l'intervalle en deux et on garde la moitié où le changement de signe persiste. C'est littéralement l'algorithme de recherche dichotomique, et cela donne une méthode numérique pour approcher la solution.</p>`,
retenir:"Factoriser par le terme dominant règle la plupart des indéterminations. Croissances comparées : logarithme, puis puissances, puis exponentielle. Le TVI et la dichotomie sont le même objet, vus en maths et en algorithmique.",
exos:[{q:"Limite en plus l'infini de (3x² + x) / (x² - 5) ?",r:"3. On factorise haut et bas par x², les termes restants tendent vers 0."},{q:"Combien d'itérations de dichotomie pour atteindre une précision de 0,001 sur un intervalle de longueur 1 ?",r:"Environ 10, car il faut que 2 puissance n dépasse 1000."}]},

{t:"Dérivation", obj:["Calculer une dérivée","Utiliser la dérivée pour étudier une fonction","Appliquer le théorème des accroissements finis"], html:`
<h4>Définition</h4>
<p>La dérivée en a est la limite du taux d'accroissement quand l'écart tend vers 0. Géométriquement, c'est la pente de la tangente ; physiquement, une vitesse de variation.</p>
<h4>Règles de calcul</h4>
<ul>
<li>Somme : la dérivée d'une somme est la somme des dérivées.</li>
<li>Produit : dérivée du premier fois le second, plus le premier fois la dérivée du second.</li>
<li>Quotient : numérateur croisé, le tout divisé par le carré du dénominateur.</li>
<li>Composée : dérivée de l'extérieure évaluée en l'intérieure, multipliée par la dérivée de l'intérieure.</li>
</ul>
<h4>Dérivées usuelles</h4>
