<p>Ici, <code>open</code>, <code>read</code> et <code>close</code> sont des appels système, alors que <code>fopen</code> et <code>fread</code> sont des fonctions de bibliothèque qui les enveloppent en ajoutant un tampon. La différence explique pourquoi les entrées-sorties tamponnées sont bien plus rapides sur de petites lectures.</p>
<h4>Descripteurs de fichiers</h4>
<p>Un entier qui désigne une ressource ouverte. Trois sont ouverts d'office : 0 pour l'entrée standard, 1 pour la sortie standard, 2 pour la sortie d'erreur. Les redirections du shell consistent précisément à réaffecter ces descripteurs.</p>`,
retenir:"Le système virtualise le matériel et arbitre les ressources. Un appel système est bien plus coûteux qu'un appel de fonction, d'où l'intérêt des tampons.",
exos:[{q:"Pourquoi lire un fichier octet par octet avec read est-il très lent ?",r:"Chaque appel provoque un basculement en mode noyau. Il faut lire par blocs dans un tampon, ce que fait automatiquement la bibliothèque standard."},{q:"Que fait la redirection 2>&1 en termes de descripteurs ?",r:"Elle fait pointer le descripteur 2 vers la même ressource que le descripteur 1, donc les erreurs partent au même endroit que la sortie."}]},

{t:"Processus", obj:["Décrire les états d'un processus","Créer un processus","Comprendre la relation père-fils"], html:`
<h4>Définition</h4>
<div class="def"><b>Processus.</b> Programme en cours d'exécution, avec son espace mémoire, ses descripteurs, son contexte processeur et son état. Un même programme peut donner naissance à plusieurs processus indépendants.</div>
<h4>États</h4>
<p>Un processus est <em>prêt</em> (il attend le processeur), <em>élu</em> (il s'exécute), ou <em>bloqué</em> (il attend un événement, typiquement une entrée-sortie). Les transitions sont pilotées par l'ordonnanceur et par les événements matériels.</p>
<h4>Création sous Unix</h4>
<pre><code>pid_t pid = fork();
if (pid &lt; 0) {
    perror("fork");
} else if (pid == 0) {
    /* processus fils */
    execlp("ls", "ls", "-l", NULL);
} else {
    /* processus pere */
    int statut;
    waitpid(pid, &amp;statut, 0);
}</code></pre>
<p><code>fork</code> duplique le processus appelant : les deux poursuivent l'exécution au même endroit, et seule la valeur de retour les distingue — zéro chez le fils, l'identifiant du fils chez le père. <code>exec</code> remplace ensuite l'image mémoire par un autre programme. C'est ainsi qu'un shell lance une commande.</p>
<h4>Terminaison</h4>
<p>Un processus qui se termine laisse un code de retour que son père récupère par <code>wait</code>. Un fils terminé dont le père n'a pas lu le statut reste dans un état intermédiaire appelé zombie ; un fils dont le père est mort est adopté par le processus d'initialisation.</p>
<h4>Signaux</h4>
<p>Mécanisme de notification asynchrone : interruption au clavier, terminaison demandée, arrêt forcé, fin d'un fils. Un programme peut installer un gestionnaire pour la plupart d'entre eux, mais l'arrêt forcé ne peut pas être intercepté.</p>`,
retenir:"fork duplique, exec remplace, wait récupère. Un processus est prêt, élu ou bloqué. Le retour de fork est le seul moyen de savoir si l'on est le père ou le fils.",
exos:[{q:"Combien de processus existent après deux appels successifs à fork ?",r:"Quatre : chaque appel double le nombre de processus, donc un puis deux puis quatre."},{q:"Pourquoi un processus zombie n'occupe-t-il presque pas de ressources ?",r:"Sa mémoire a été libérée ; seule son entrée dans la table des processus subsiste pour conserver son code de retour jusqu'à ce que le père le lise."}]},

{t:"Ordonnancement", obj:["Comparer les politiques d'ordonnancement","Calculer temps d'attente et de réponse","Comprendre la préemption"], html:`
<h4>Le problème</h4>
<p>Plusieurs processus prêts, un seul processeur (ou quelques cœurs). L'ordonnanceur choisit lequel s'exécute et pour combien de temps, en arbitrant entre des objectifs contradictoires : débit, temps de réponse, équité, absence de famine.</p>
<h4>Préemption</h4>
<div class="def"><b>Ordonnancement préemptif.</b> Le système peut retirer le processeur à un processus avant qu'il n'ait terminé, grâce à l'interruption d'horloge. Sans préemption, un processus qui boucle bloquerait toute la machine.</div>
<h4>Politiques classiques</h4>
<table><tr><th>Politique</th><th>Principe</th><th>Défaut</th></tr>
<tr><td>Premier arrivé premier servi</td><td>ordre d'arrivée</td><td>un long processus bloque tous les autres</td></tr>
<tr><td>Plus court d'abord</td><td>durée croissante</td><td>durée inconnue, famine des longs</td></tr>
<tr><td>Tourniquet</td><td>quantum de temps à tour de rôle</td><td>choix du quantum délicat</td></tr>
<tr><td>Priorités</td><td>les plus prioritaires d'abord</td><td>famine, corrigée par vieillissement</td></tr>
<tr><td>Files multiniveaux</td><td>plusieurs files avec retour d'expérience</td><td>complexe à régler</td></tr>
</table>
<h4>Choix du quantum</h4>
<p>Trop court, le coût des changements de contexte devient dominant. Trop long, l'interactivité se dégrade. Les systèmes actuels utilisent des quanta de quelques millisecondes, ajustés dynamiquement.</p>
<h4>Changement de contexte</h4>
<p>Sauvegarder les registres du processus sortant, charger ceux du processus entrant, et invalider une partie des caches. C'est du temps pur perdu, d'où l'intérêt de ne pas commuter trop souvent.</p>
<h4>Calculs typiques d'examen</h4>
<p>On te donne des dates d'arrivée et des durées, et l'on demande le diagramme d'exécution, le temps d'attente moyen et le temps de rotation moyen. Méthode : dessiner la chronologie, puis pour chaque processus calculer la différence entre sa fin et son arrivée, dont on retire sa durée d'exécution.</p>`,
retenir:"La préemption est ce qui rend le multitâche fiable. Chaque politique optimise un critère au détriment d'un autre : il n'existe pas d'ordonnanceur idéal.",
exos:[{q:"Pourquoi le plus court d'abord peut-il affamer un processus ?",r:"Parce que si de courts processus arrivent continuellement, un long processus n'est jamais élu. On corrige en augmentant sa priorité avec le temps d'attente."},{q:"Que se passe-t-il si le quantum du tourniquet devient très grand ?",r:"La politique dégénère en premier arrivé premier servi, puisque chaque processus a le temps de terminer pendant son quantum."}]},

{t:"Gestion de la mémoire", obj:["Expliquer la mémoire virtuelle","Décrire la pagination","Comprendre les défauts de page"], html:`
<h4>Le besoin</h4>
<p>Plusieurs processus doivent coexister sans se marcher dessus, chacun croyant disposer d'un espace continu qui commence à zéro, éventuellement plus grand que la mémoire physique disponible.</p>
<h4>Mémoire virtuelle</h4>
<div class="def"><b>Principe.</b> Chaque processus manipule des adresses virtuelles, traduites en adresses physiques par le matériel à l'aide de tables gérées par le système.</div>
<p>Conséquences : isolation entre processus, protection contre les accès illicites, possibilité de partager des pages en lecture seule (le code d'une bibliothèque n'existe qu'une fois en mémoire physique).</p>
<h4>Pagination</h4>
<p>L'espace virtuel est découpé en pages de taille fixe, la mémoire physique en cadres de même taille. Une adresse virtuelle se décompose en numéro de page et déplacement dans la page ; la table des pages traduit le numéro, le déplacement reste inchangé.</p>
<p>La traduction étant faite à chaque accès, un cache spécialisé mémorise les traductions récentes pour éviter de consulter la table à chaque fois.</p>
<h4>Défaut de page</h4>
<p>Si la page n'est pas en mémoire physique, le matériel déclenche une interruption. Le système va chercher la page sur disque, éventuellement en évince une autre, met à jour la table, puis relance l'instruction. Le coût est de plusieurs millions de cycles : c'est colossal comparé à un accès mémoire.</p>
<h4>Algorithmes de remplacement</h4>
<p>Quelle page évincer ? Le premier entré premier sorti est simple mais médiocre. Le moins récemment utilisé approche l'optimum, en s'appuyant sur la localité temporelle vue en Architecture. L'optimum théorique, qui évince la page qui servira le plus tard, n'est pas réalisable puisqu'il suppose de connaître l'avenir ; il sert de référence de comparaison.</p>
<h4>Écroulement</h4>
<p>Quand la mémoire manque, le système passe plus de temps à échanger des pages qu'à calculer. Les performances s'effondrent brutalement, la machine semble figée alors que le processeur est presque inactif.</p>`,
retenir:"Adresses virtuelles traduites page par page : isolation, protection, partage. Un défaut de page coûte des millions de cycles ; l'écroulement est le symptôme d'un manque de mémoire.",
exos:[{q:"Pourquoi la taille des pages est-elle une puissance de deux ?",r:"Pour que la décomposition d'une adresse en numéro de page et déplacement se fasse par simple découpage de bits, sans division."},{q:"Pourquoi le moins récemment utilisé fonctionne-t-il bien en pratique ?",r:"Grâce à la localité temporelle : une page utilisée récemment a de fortes chances de resservir bientôt, donc l'évincer serait coûteux."}]},

{t:"Systèmes de fichiers", obj:["Décrire l'organisation d'un disque","Comprendre les inodes et les liens","Expliquer le rôle du journal"], html:`
<h4>Abstraction</h4>
<p>Le système présente les données sous forme de fichiers nommés, organisés en répertoires, alors que le support physique ne connaît que des blocs numérotés. Toute la difficulté est dans la traduction.</p>
<h4>Métadonnées</h4>
<p>Sous Unix, chaque fichier est décrit par un <strong>inode</strong> : type, droits, propriétaire, taille, dates, et adresses des blocs de données. Le nom du fichier n'y figure pas : il est stocké dans le répertoire, qui associe des noms à des numéros d'inode.</p>
<h4>Liens</h4>
<p>Un lien physique est une seconde entrée de répertoire pointant vers le même inode : les deux noms sont équivalents, et le fichier n'est supprimé que lorsque plus aucun nom ne le référence. Un lien symbolique contient un chemin vers un autre fichier : il peut pointer vers une cible inexistante et traverser les systèmes de fichiers.</p>
<h4>Allocation des blocs</h4>
<p>Allocation contiguë : rapide en lecture séquentielle mais fragmentation forte. Allocation chaînée : souple mais accès direct impossible. Allocation indexée, la solution retenue : l'inode contient des pointeurs directs, puis indirects, ce qui permet de gérer efficacement à la fois les petits et les très gros fichiers.</p>
<h4>Journalisation</h4>
<p>Une coupure de courant au milieu d'une écriture peut laisser le système de fichiers incohérent. Un système journalisé écrit d'abord dans un journal ce qu'il va faire, puis le fait. Au redémarrage, il rejoue ou annule les opérations incomplètes, ce qui évite une vérification longue de tout le disque.</p>
<h4>Cache disque</h4>
<p>Le système garde en mémoire les blocs récemment lus et diffère les écritures. C'est pourquoi il faut démonter proprement une clé USB : des écritures peuvent être encore en attente.</p>`,
retenir:"L'inode porte les métadonnées, le répertoire porte le nom. Lien physique vers l'inode, lien symbolique vers un chemin. Le journal protège la cohérence après une panne.",
exos:[{q:"Que se passe-t-il si on supprime le fichier cible d'un lien symbolique ?",r:"Le lien devient cassé : il pointe vers un chemin qui n'existe plus. Avec un lien physique, le contenu resterait accessible."},{q:"Pourquoi peut-on supprimer un fichier ouvert par un programme sous Unix ?",r:"La suppression retire seulement le nom du répertoire. L'inode reste tant qu'un processus le tient ouvert, et n'est libéré qu'à la fermeture."}]},

{t:"Concurrence et synchronisation", obj:["Identifier une situation de compétition","Utiliser un verrou ou un sémaphore","Reconnaître un interblocage"], html:`
<h4>Processus et threads</h4>
<p>Un thread est un fil d'exécution à l'intérieur d'un processus. Les threads d'un même processus partagent la mémoire, ce qui rend la communication immédiate — et les erreurs bien plus faciles.</p>
<h4>Situation de compétition</h4>
<div class="def"><b>Course critique.</b> Deux fils accèdent à une donnée partagée et au moins l'un la modifie ; le résultat dépend alors de l'ordre d'exécution.</div>
<p>L'incrémentation d'un compteur n'est pas atomique : elle se décompose en lecture, calcul, écriture. Deux threads peuvent lire la même valeur et écrire le même résultat, perdant une incrémentation. Le bug est intermittent, donc difficile à reproduire.</p>
<h4>Section critique</h4>
<p>Portion de code qui doit être exécutée par un seul fil à la fois. Trois exigences : exclusion mutuelle, absence de blocage inutile, absence de famine.</p>
<h4>Outils</h4>
<ul>
<li><strong>Verrou</strong> : un seul fil le détient à la fois ; les autres attendent.</li>
<li><strong>Sémaphore</strong> : compteur autorisant n accès simultanés ; un sémaphore à 1 est un verrou.</li>
<li><strong>Variable de condition</strong> : permet d'attendre qu'une propriété devienne vraie sans consommer de processeur.</li>
</ul>
<p>Le problème du producteur-consommateur, classique en TD, combine un verrou pour protéger le tampon et deux sémaphores pour compter les places libres et les éléments disponibles.</p>
<h4>Interblocage</h4>
<p>Quatre conditions doivent être réunies simultanément : exclusion mutuelle, détention et attente, absence de préemption des ressources, et attente circulaire. Briser une seule suffit à l'éviter. La parade la plus simple en pratique : imposer un ordre global d'acquisition des verrous.</p>
<div class="piege"><b>Trop de verrous.</b> Verrouiller trop largement sérialise le programme et annule le bénéfice du parallélisme. Verrouiller trop peu laisse des courses. L'équilibre est le vrai travail.</div>`,
retenir:"Mémoire partagée sans synchronisation = courses critiques. Verrou pour l'exclusion mutuelle, sémaphore pour compter, ordre global d'acquisition pour éviter l'interblocage.",
exos:[{q:"Pourquoi l'incrémentation d'un entier partagé est-elle dangereuse ?",r:"Parce qu'elle se décompose en trois opérations : deux threads peuvent lire la même valeur avant que l'un ait écrit, et une incrémentation est perdue."},{q:"Comment éviter un interblocage entre deux verrous ?",r:"En imposant que tous les fils les acquièrent toujours dans le même ordre, ce qui casse l'attente circulaire."}]}
]};

{t:"Systèmes linéaires et pivot de Gauss", obj:["Résoudre un système par échelonnement","Discuter le nombre de solutions","Relier au coût algorithmique"], html:`
<h4>Écriture matricielle</h4>
<p>Un système de m équations à n inconnues s'écrit comme un produit d'une matrice par un vecteur inconnu égal à un second membre. Résoudre le système, c'est inverser ce problème.</p>
<h4>Méthode du pivot</h4>
<p>On applique des opérations élémentaires qui ne changent pas l'ensemble des solutions : échanger deux lignes, multiplier une ligne par un scalaire non nul, ajouter à une ligne un multiple d'une autre. L'objectif est d'obtenir une forme échelonnée, puis de remonter.</p>
<h4>Trois cas</h4>
<ul>
<li>Une ligne du type « 0 = valeur non nulle » : aucune solution.</li>
<li>Autant de pivots que d'inconnues : solution unique.</li>
<li>Moins de pivots que d'inconnues : infinité de solutions, paramétrée par les inconnues libres.</li>
</ul>
<h4>Rang</h4>
<div class="def"><b>Rang.</b> Nombre de pivots de la forme échelonnée. C'est le nombre d'équations réellement indépendantes.</div>
<p>La dimension de l'ensemble des solutions du système homogène associé vaut le nombre d'inconnues moins le rang : c'est le théorème du rang, sous sa forme la plus concrète.</p>
<h4>Point de vue informatique</h4>
<p>L'élimination de Gauss coûte de l'ordre de n au cube opérations. Sur de gros systèmes, on utilise des méthodes itératives. Numériquement, il faut choisir comme pivot le plus grand coefficient disponible en valeur absolue : diviser par un pivot minuscule amplifie les erreurs d'arrondi vues au chapitre des flottants.</p>`,
retenir:"Échelonner puis remonter. Le rang compte les équations utiles. Le pivot partiel n'est pas un raffinement théorique mais une nécessité numérique.",
exos:[{q:"Un système de 3 équations à 4 inconnues peut-il avoir une solution unique ?",r:"Non : le rang est au plus 3, donc il reste au moins une inconnue libre. Soit aucune solution, soit une infinité."},{q:"Que signifie une ligne entièrement nulle après échelonnement ?",r:"Que l'équation correspondante était combinaison linéaire des autres : elle n'apporte aucune information nouvelle."}]},

{t:"Calcul matriciel", obj:["Multiplier des matrices","Calculer une inverse","Interpréter le produit"], html:`
<h4>Opérations</h4>
<p>Somme terme à terme entre matrices de même format. Produit défini quand le nombre de colonnes de la première égale le nombre de lignes de la seconde : le coefficient d'indice donné est le produit scalaire d'une ligne par une colonne.</p>
<div class="piege"><b>Non-commutativité.</b> Le produit matriciel n'est pas commutatif. De plus, un produit peut être nul sans qu'aucun facteur le soit : la règle du produit nul ne s'applique pas.</div>
<h4>Matrices particulières</h4>
<p>Identité (neutre du produit), diagonale, triangulaire, symétrique, inversible. Une matrice est inversible s'il existe une matrice qui, multipliée dans les deux sens, donne l'identité.</p>
<h4>Inverse</h4>
<p>On calcule l'inverse en appliquant l'algorithme du pivot simultanément à la matrice et à l'identité : lorsque la première devient l'identité, la seconde est devenue l'inverse. Une matrice est inversible si et seulement si son rang est maximal, si et seulement si son déterminant est non nul.</p>
<h4>Coût</h4>
<p>Le produit naïf de deux matrices de taille n coûte n au cube multiplications, avec trois boucles imbriquées. L'algorithme de Strassen fait mieux en découpant en blocs — un exemple de diviser pour régner en dehors du tri.</p>
<h4>Applications informatiques</h4>
<p>Transformations géométriques en synthèse d'images (rotation, changement d'échelle, projection, le tout composé par produits matriciels), matrice d'adjacence d'un graphe dont les puissances comptent les chemins, transformation des données en apprentissage automatique.</p>`,
retenir:"Le produit matriciel n'est pas commutatif et ne vérifie pas la règle du produit nul. Inversible équivaut à rang maximal et à déterminant non nul.",
exos:[{q:"Si A est de format 2×3 et B de format 3×4, quel est le format de AB ?",r:"2×4. Le produit BA n'est pas défini, ce qui illustre la non-commutativité."},{q:"Que représente le coefficient d'indice i,j de la matrice d'adjacence élevée au carré ?",r:"Le nombre de chemins de longueur 2 allant du sommet i au sommet j."}]},

{t:"Espaces vectoriels", obj:["Vérifier qu'un ensemble est un sous-espace","Manipuler famille libre, génératrice, base","Calculer une dimension"], html:`
<h4>Définition</h4>
<p>Un espace vectoriel est un ensemble muni d'une addition et d'une multiplication par un scalaire vérifiant les axiomes usuels. Les exemples de L1 : les n-uplets de réels, les matrices d'un format donné, les polynômes de degré borné, les fonctions d'un ensemble dans les réels.</p>
<h4>Sous-espaces</h4>
<p>Pour prouver qu'une partie est un sous-espace, on vérifie qu'elle contient le vecteur nul et qu'elle est stable par combinaison linéaire. C'est bien plus court que de revérifier tous les axiomes, et c'est la méthode attendue.</p>
<h4>Famille libre, génératrice, base</h4>
<ul>
<li><strong>Libre</strong> : la seule combinaison linéaire nulle est celle à coefficients tous nuls.</li>
<li><strong>Génératrice</strong> : tout vecteur s'écrit comme combinaison linéaire de la famille.</li>
<li><strong>Base</strong> : les deux à la fois. L'écriture d'un vecteur y est alors unique.</li>
</ul>
<h4>Dimension</h4>
<div class="def"><b>Dimension.</b> Nombre de vecteurs d'une base. Toutes les bases d'un même espace ont le même cardinal.</div>
<p>Conséquence pratique : dans un espace de dimension n, une famille libre de n vecteurs est automatiquement une base, et une famille de plus de n vecteurs est nécessairement liée. Cela évite beaucoup de calculs.</p>
<h4>Coordonnées</h4>
<p>Une fois la base fixée, chaque vecteur est identifié à la liste de ses coordonnées : c'est ce qui permet de représenter un objet géométrique par un tableau de nombres, donc de le manipuler par programme.</p>`,
retenir:"Sous-espace : contient le vecteur nul et stable par combinaison linéaire. Base = libre et génératrice, et l'écriture y est unique. En dimension n, n vecteurs libres suffisent.",
exos:[{q:"L'ensemble des vecteurs du plan dont la somme des coordonnées vaut 1 est-il un sous-espace ?",r:"Non : il ne contient pas le vecteur nul, dont la somme des coordonnées vaut 0."},{q:"Quelle est la dimension de l'espace des polynômes de degré au plus 3 ?",r:"4, avec la base formée de 1, X, X² et X³."}]},

{t:"Applications linéaires", obj:["Reconnaître une application linéaire","Calculer noyau et image","Appliquer le théorème du rang"], html:`
<h4>Définition</h4>
<p>Une application est linéaire si elle préserve l'addition et la multiplication par un scalaire. Conséquence immédiate : elle envoie le vecteur nul sur le vecteur nul, ce qui donne un test de rejet rapide.</p>
<h4>Matrice d'une application</h4>
<p>Une fois choisies une base au départ et une à l'arrivée, l'application est entièrement déterminée par les images des vecteurs de la base, rangées en colonnes. Composer deux applications revient alors à multiplier leurs matrices : c'est l'origine même de la définition du produit matriciel.</p>
<h4>Noyau et image</h4>
<ul>
<li><strong>Noyau</strong> : ensemble des vecteurs envoyés sur le vecteur nul. C'est un sous-espace de l'espace de départ.</li>
<li><strong>Image</strong> : ensemble des vecteurs atteints. C'est un sous-espace de l'espace d'arrivée, engendré par les colonnes de la matrice.</li>
</ul>
<p>L'application est injective exactement lorsque son noyau est réduit au vecteur nul — critère bien plus simple que la définition générale de l'injectivité vue en Logique.</p>
<h4>Théorème du rang</h4>
<div class="def"><b>Énoncé.</b> La dimension de l'espace de départ est la somme de la dimension du noyau et du rang, c'est-à-dire de la dimension de l'image.</div>
<p>C'est l'outil qui permet de déduire une dimension de l'autre sans calcul supplémentaire, et de conclure très vite sur l'injectivité ou la surjectivité en dimension finie.</p>
<h4>Valeurs propres</h4>
<p>Un vecteur propre est transformé en un multiple de lui-même. Diagonaliser une matrice, c'est trouver une base de vecteurs propres, ce qui rend les puissances et les systèmes différentiels immédiats. C'est aussi le fondement mathématique de la compression d'images et de l'analyse en composantes principales, approfondi en L2.</p>`,
retenir:"Une application linéaire est déterminée par les images d'une base. Injective équivaut à noyau nul. Théorème du rang : dimension de départ = noyau + image.",
exos:[{q:"Une application linéaire du plan vers l'espace peut-elle être surjective ?",r:"Non : son image a une dimension au plus 2, donc elle ne peut pas remplir un espace de dimension 3."},{q:"Que vaut le rang d'une projection sur une droite du plan ?",r:"1 : l'image est la droite, de dimension 1, et le noyau est la direction projetée, également de dimension 1."}]}
]};

const ANALYSE = {code:"EP2.3.2", nom:"Analyse", ects:4, h:"10h CM · 20h TD",
resume:"Prolongement de Calculus : intégration approfondie, séries, équations différentielles, fonctions de plusieurs variables. Les outils de la modélisation, du calcul numérique et de l'analyse d'algorithmes.",
chapitres:[
{t:"Techniques d'intégration", obj:["Décomposer une fraction rationnelle","Enchaîner les changements de variable","Calculer une intégrale impropre"], html:`
<h4>Fractions rationnelles</h4>
<p>Pour intégrer un quotient de polynômes, on effectue d'abord la division euclidienne si le degré du numérateur atteint celui du dénominateur, puis on décompose en éléments simples à partir des racines du dénominateur. Chaque élément simple s'intègre en logarithme ou en arctangente.</p>
<h4>Changements de variable classiques</h4>
<p>Pour les expressions trigonométriques, les règles de Bioche indiquent le changement adapté. Pour une racine carrée d'expression quadratique, un changement trigonométrique ramène à un cas connu. L'essentiel est de transformer aussi les bornes.</p>
<h4>Intégrales impropres</h4>
<div class="def"><b>Convergence.</b> Une intégrale sur un intervalle non borné, ou d'une fonction non bornée, se définit comme la limite d'intégrales sur des intervalles bornés. Elle converge si cette limite existe et est finie.</div>
<p>Référence à retenir : l'intégrale de l'inverse d'une puissance converge en l'infini si l'exposant dépasse strictement 1, et en zéro s'il est strictement inférieur à 1. Les critères de comparaison et d'équivalence permettent de conclure sans calculer.</p>
<h4>Calcul numérique</h4>
<p>Quand aucune primitive n'existe sous forme élémentaire, on approche. La méthode des rectangles a une erreur proportionnelle au pas, les trapèzes au carré du pas, Simpson à la puissance quatre. Doubler le nombre de points divise l'erreur par 16 avec Simpson contre 2 avec les rectangles : le choix de la méthode compte bien plus que la puissance de la machine.</p>`,
retenir:"Décomposition en éléments simples pour les fractions rationnelles. Une intégrale impropre se justifie avant de se calculer. En numérique, la méthode prime sur la finesse du pas.",
exos:[{q:"L'intégrale de 1/x entre 1 et l'infini converge-t-elle ?",r:"Non : l'exposant vaut exactement 1, cas limite divergent. Il faudrait un exposant strictement supérieur à 1."},{q:"Pourquoi la méthode des trapèzes est-elle plus précise que celle des rectangles ?",r:"Parce qu'elle approche la fonction par des segments plutôt que par des constantes, ce qui annule l'erreur du premier ordre."}]},

{t:"Séries numériques", obj:["Étudier la convergence d'une série","Utiliser les critères usuels","Relier séries et algorithmique"], html:`
<h4>Définition</h4>
<p>Une série est la suite des sommes partielles d'une suite. Elle converge si cette suite de sommes partielles converge. Condition nécessaire : le terme général tend vers zéro — mais elle ne suffit pas, comme le montre la série harmonique.</p>
<h4>Séries de référence</h4>
<ul>
<li><strong>Géométrique</strong> : converge si la valeur absolue de la raison est strictement inférieure à 1, et la somme vaut alors l'inverse de un moins la raison.</li>
<li><strong>Série de Riemann</strong> : converge si l'exposant est strictement supérieur à 1.</li>
<li><strong>Série harmonique</strong> : diverge, mais très lentement, ses sommes partielles croissant comme un logarithme.</li>
</ul>
<h4>Critères</h4>
<p>Pour les séries à termes positifs : comparaison, équivalence, critère de d'Alembert par le rapport de deux termes consécutifs, critère de Cauchy par la racine n-ième, comparaison avec une intégrale. Pour les séries alternées, le critère spécial garantit la convergence dès que la valeur absolue du terme décroît vers zéro, et majore le reste par le premier terme négligé.</p>
<h4>Absolue convergence</h4>
<p>Une série absolument convergente est convergente. La réciproque est fausse : la série harmonique alternée converge sans converger absolument, et l'on peut alors changer sa somme en réordonnant ses termes — ce qui montre que la commutativité de l'addition n'est pas gratuite sur les sommes infinies.</p>
<h4>Lien avec l'informatique</h4>
<p>Le coût moyen de nombreux algorithmes s'exprime par une somme partielle de série harmonique, d'où l'apparition du logarithme dans les complexités. Le nombre moyen de comparaisons du tri rapide s'obtient exactement ainsi.</p>`,
retenir:"Le terme général qui tend vers zéro est nécessaire, jamais suffisant. Riemann converge au-delà de l'exposant 1, la série harmonique diverge comme un logarithme.",
exos:[{q:"La série de terme général 1/n² converge-t-elle ?",r:"Oui : c'est une série de Riemann d'exposant 2, strictement supérieur à 1."},{q:"Pourquoi la somme des n premiers inverses vaut-elle environ ln n ?",r:"Par comparaison avec l'intégrale de 1/x, dont la primitive est le logarithme. La différence tend vers une constante."}]},

{t:"Équations différentielles", obj:["Résoudre une équation du premier ordre","Résoudre une équation linéaire du second ordre à coefficients constants","Interpréter une solution"], html:`
<h4>Premier ordre linéaire</h4>
<p>Méthode : résoudre l'équation homogène, dont les solutions sont proportionnelles à une exponentielle, puis chercher une solution particulière, par variation de la constante ou par forme devinée. La solution générale est la somme des deux, et la condition initiale fixe la constante.</p>
<h4>Variables séparables</h4>
<p>Quand l'équation peut s'écrire en séparant les variables de part et d'autre, on intègre chaque membre séparément. C'est la méthode des modèles de croissance et de décroissance.</p>
<h4>Second ordre à coefficients constants</h4>
<p>On écrit l'équation caractéristique, polynôme du second degré associé. Selon le signe du discriminant, les solutions de l'équation homogène font intervenir deux exponentielles distinctes, une exponentielle multipliée par un polynôme de degré un, ou une exponentielle modulée par des fonctions trigonométriques. Ce dernier cas décrit les oscillations amorties.</p>
<h4>Interprétation</h4>
<p>Croissance exponentielle pour une population sans contrainte, décroissance pour une désintégration ou un refroidissement, oscillations amorties pour un système mécanique ou électrique. Une équation différentielle décrit une loi d'évolution ; sa solution décrit la trajectoire.</p>
<h4>Résolution numérique</h4>
<p>La méthode d'Euler avance pas à pas en suivant la tangente : simple, mais son erreur s'accumule proportionnellement au pas. Les méthodes de Runge-Kutta font bien mieux pour un coût par pas à peine supérieur. C'est un TP classique et un excellent exercice de programmation.</p>`,
retenir:"Solution générale = solution homogène + solution particulière ; la condition initiale fixe la constante. Second ordre : tout se lit sur le discriminant de l'équation caractéristique.",
exos:[{q:"Résoudre y' = 2y avec y(0) = 3.",r:"y(x) = 3 exp(2x). L'équation homogène donne une exponentielle, la condition initiale fixe le coefficient."},{q:"Que traduit un discriminant négatif dans l'équation caractéristique ?",r:"Des solutions oscillantes : une exponentielle multipliée par un sinus et un cosinus, typique d'un système amorti."}]},

{t:"Fonctions de plusieurs variables", obj:["Calculer des dérivées partielles","Écrire un gradient","Chercher un extremum"], html:`
<h4>Motivation</h4>
<p>Presque toute quantité réelle dépend de plusieurs paramètres. En informatique, l'apprentissage automatique consiste précisément à minimiser une fonction d'erreur dépendant de milliers de variables.</p>
<h4>Dérivées partielles</h4>
<p>On dérive par rapport à une variable en traitant les autres comme des constantes. Le vecteur des dérivées partielles est le <strong>gradient</strong>. Il indique la direction de plus forte croissance, et sa norme mesure la pente dans cette direction.</p>
<h4>Descente de gradient</h4>
<p>Pour minimiser une fonction, on se déplace dans la direction opposée au gradient, d'un pas contrôlé. Trop grand, l'algorithme oscille ou diverge ; trop petit, il n'avance pas. C'est l'algorithme au cœur de l'apprentissage des réseaux de neurones, et il tient en trois lignes.</p>
<h4>Extrema</h4>
<p>Les points critiques annulent toutes les dérivées partielles. Pour les classer, on étudie les dérivées secondes : le signe du déterminant de la matrice des dérivées secondes distingue minimum, maximum et point selle. Un point critique n'est pas nécessairement un extremum.</p>
<h4>Différentielle et approximation</h4>
<p>Au premier ordre, l'accroissement de la fonction s'approche par le produit scalaire du gradient et du déplacement. C'est la généralisation naturelle du développement limité à l'ordre un, et l'outil de base pour propager les incertitudes de mesure.</p>`,
retenir:"Gradient = vecteur des dérivées partielles, il pointe vers la plus forte croissance. Descendre le gradient minimise. Point critique n'implique pas extremum.",
exos:[{q:"Calcule le gradient de f(x,y) = x² + 3xy.",r:"Les dérivées partielles valent 2x + 3y et 3x, donc le gradient est le vecteur de ces deux composantes."},{q:"Pourquoi un pas trop grand fait-il diverger la descente de gradient ?",r:"Parce que l'approximation linéaire n'est valable que localement : un grand déplacement sort du domaine où elle est fiable et peut augmenter la fonction."}]}
]};

const MATHING2 = {code:"EP2.4.2", nom:"Mathématiques pour l'ingénieur", ects:4, h:"38h",
resume:"Second volet du module appliqué, dans l'UE de compétences transversales du semestre 2 : arithmétique, prolongements probabilistes et statistiques inférentielles, avec des applications directes en cryptographie et en évaluation de performances.",
chapitres:[
{t:"Arithmétique et cryptographie", obj:["Utiliser la division euclidienne et le PGCD","Calculer modulo n","Comprendre le principe de RSA"], html:`
<h4>Division euclidienne</h4>
<p>Tout entier s'écrit de manière unique comme le produit du diviseur par un quotient, plus un reste strictement inférieur au diviseur. C'est la base de l'arithmétique modulaire, et l'opérateur de reste des langages de programmation en est la traduction directe.</p>
<h4>PGCD et algorithme d'Euclide</h4>
<p>Le plus grand commun diviseur s'obtient en remplaçant répétitivement le couple par le diviseur et le reste, jusqu'à un reste nul. L'algorithme est extrêmement rapide : le nombre d'étapes est logarithmique.</p>
<pre><code>int pgcd(int a, int b) {
    while (b != 0) { int r = a % b; a = b; b = r; }
    return a;
}</code></pre>
<p>La version étendue fournit en plus deux coefficients tels que leur combinaison des deux nombres donne le PGCD : c'est le théorème de Bézout, et c'est ce qui permet de calculer un inverse modulaire.</p>
<h4>Congruences</h4>
<div class="def"><b>Congruence.</b> Deux entiers sont congrus modulo n lorsqu'ils ont le même reste dans la division par n, autrement dit lorsque leur différence est multiple de n.</div>
<p>La congruence est compatible avec l'addition et la multiplication, ce qui permet de calculer sur les restes. C'est la relation d'équivalence du cours de Logique, appliquée aux entiers.</p>
<h4>Exponentiation rapide</h4>
<p>Calculer une puissance modulo n en élevant successivement au carré demande un nombre d'opérations logarithmique au lieu de linéaire. Sans cette astuce, aucune cryptographie à clé publique ne serait praticable.</p>
<h4>Principe de RSA</h4>
<p>On choisit deux grands nombres premiers, leur produit devient public tandis que les facteurs restent secrets. Le chiffrement et le déchiffrement sont deux exponentiations modulaires. La sécurité repose sur le fait qu'on sait multiplier deux grands nombres premiers très vite, mais qu'on ne sait pas factoriser leur produit en temps raisonnable.</p>`,
retenir:"Euclide donne le PGCD en temps logarithmique, Bézout donne l'inverse modulaire, l'exponentiation rapide rend RSA praticable. La sécurité vient d'une asymétrie de difficulté.",
exos:[{q:"Calcule le PGCD de 252 et 105 par l'algorithme d'Euclide.",r:"252 = 2×105 + 42 ; 105 = 2×42 + 21 ; 42 = 2×21 + 0. Le PGCD vaut 21."},{q:"Pourquoi ne calcule-t-on pas une grande puissance par multiplications successives ?",r:"Parce que le nombre d'opérations serait proportionnel à l'exposant, donc astronomique. L'élévation au carré répétée le rend logarithmique."}]},

{t:"Statistique inférentielle", obj:["Distinguer échantillon et population","Construire un intervalle de confiance","Interpréter un test statistique"], html:`
<h4>Le problème</h4>
<p>On observe un échantillon et l'on veut conclure sur une population entière. Toute conclusion est donc entachée d'incertitude, qu'il faut quantifier plutôt que masquer.</p>
<h4>Estimation</h4>
<p>La moyenne de l'échantillon estime la moyenne de la population. Un bon estimateur est sans biais, c'est-à-dire juste en moyenne, et de faible dispersion. La précision s'améliore comme la racine carrée de la taille de l'échantillon : quadrupler l'effectif ne divise l'incertitude que par deux.</p>
<h4>Intervalle de confiance</h4>
<div class="def"><b>Interprétation correcte.</b> Un intervalle à 95 % signifie que la procédure produit, dans 95 % des échantillons possibles, un intervalle contenant la vraie valeur. Ce n'est pas la probabilité que la vraie valeur soit dans l'intervalle obtenu.</div>
<h4>Tests d'hypothèse</h4>
<p>On formule une hypothèse nulle, on calcule la probabilité d'observer des données au moins aussi extrêmes si elle était vraie, et l'on rejette si cette probabilité est très faible. Deux erreurs possibles : rejeter à tort, ou ne pas rejeter alors qu'il aurait fallu. Réduire l'une augmente l'autre à effectif constant.</p>
<div class="piege"><b>Non-rejet n'est pas preuve.</b> Ne pas rejeter l'hypothèse nulle ne prouve pas qu'elle est vraie : cela peut simplement signifier que l'échantillon est trop petit pour détecter l'effet.</div>
<h4>Application informatique</h4>
<p>Comparer deux versions d'un algorithme ou d'une interface demande exactement cette machinerie : mesurer plusieurs fois, estimer, et vérifier que l'écart observé dépasse la variabilité naturelle. Une différence de quelques pour cent sur cinq mesures ne prouve rien.</p>`,
retenir:"La précision progresse comme la racine de l'effectif. Un intervalle de confiance décrit la fiabilité de la procédure. Ne pas rejeter n'est pas prouver.",
exos:[{q:"Pour diviser par 3 la largeur d'un intervalle de confiance, de combien faut-il multiplier l'effectif ?",r:"Par 9, puisque la précision évolue comme la racine carrée de l'effectif."},{q:"Deux algorithmes mesurés une fois chacun diffèrent de 5 %. Peut-on conclure ?",r:"Non. Sans répétitions ni estimation de la variabilité, l'écart peut être entièrement dû au bruit de mesure."}]}
]};

const ANGLAIS2 = {code:"EP2.4.1", nom:"Anglais", ects:2, h:"18h TD",

{t:"Compréhension orale technique", obj:["Suivre une conférence technique","Prendre des notes efficacement","S'habituer aux accents variés"], html:`
<h4>Ce qui bloque</h4>
<p>Ce n'est presque jamais le vocabulaire : c'est le débit, les enchaînements entre mots et la variété des accents. La seule solution est l'exposition régulière, pas la révision de listes.</p>
<h4>Méthode</h4>
<ol>
<li>Écouter une première fois sans sous-titres, en visant l'idée générale.</li>
<li>Réécouter avec sous-titres anglais, jamais français.</li>
<li>Repérer les trois ou quatre expressions qui ont bloqué et les noter en contexte.</li>
</ol>
<p>Vingt minutes par semaine régulières valent mieux que trois heures avant l'examen.</p>
<h4>Prise de notes</h4>
<p>Note en anglais, pas en traduction : traduire mentalement fait perdre la phrase suivante. Utilise des abréviations et des symboles, et structure par idée plutôt que par phrase.</p>
<h4>Formats utiles</h4>
<p>Conférences techniques, documentaires courts, épisodes de balados sur l'informatique. Choisis des sujets que tu connais déjà : le contexte compense les mots manquants et rend l'écoute possible dès le début.</p>`,
retenir:"L'écoute se travaille par la régularité et par des sujets déjà connus. Sous-titres anglais, jamais français, et prise de notes directement en anglais.",
exos:[{q:"Pourquoi les sous-titres français sont-ils contre-productifs ?",r:"Parce que le cerveau lit au lieu d'écouter et s'appuie sur la traduction. Les sous-titres anglais associent au contraire son et graphie."},{q:"Comment noter rapidement « the algorithm reduces complexity » ?",r:"Par exemple : algo → less complexity. On garde le sens et la relation, pas la syntaxe complète."}]},
{t:"Écrit technique et certification", obj:["Rédiger un courriel professionnel","Décrire un graphique","Se préparer au format de certification"], html:`
<h4>Courriel professionnel</h4>
<p>Objet explicite, formule d'ouverture adaptée, une idée par paragraphe, demande claire, formule de clôture. Un courriel de demande de stage tient en dix lignes : qui tu es, ce que tu cherches, pourquoi cette structure, ce que tu joins.</p>
<h4>Décrire des données</h4>
<p>Vocabulaire de l'évolution : to rise, to increase, to peak, to level off, to decline, to drop sharply. Vocabulaire de la comparaison : twice as many, slightly higher, significantly lower. C'est exactement ce qui sera demandé dans un rapport de projet.</p>
<h4>Format de certification</h4>
<p>La licence prépare à une certification en langues de l'enseignement supérieur, évaluée par compétences : compréhension orale, compréhension écrite, expression écrite, et interaction orale. On peut valider des niveaux différents selon les compétences.</p>
<h4>Stratégie</h4>
<p>Le format est chronométré : entraîne-toi dans les conditions réelles. En compréhension, lis les questions avant l'écoute. En expression, garde du temps pour relire : la moitié des fautes de francophones sont des étourderies d'accord et de temps.</p>`,
retenir:"Objet clair et demande explicite dans un courriel. Vocabulaire de l'évolution pour commenter un graphique. Pour la certification, l'entraînement chronométré compte autant que le niveau.",
exos:[{q:"Traduis « les performances ont fortement chuté après la mise à jour ».",r:"Performance dropped sharply after the update. Attention : performance reste au singulier dans ce sens."},{q:"Comment commencer un courriel à quelqu'un dont on ignore le nom ?",r:"Dear Sir or Madam, ou plus couramment aujourd'hui Hello, suivi du service concerné."}]}
]};

{t:"Construire son projet", obj:["Se repérer dans les parcours de la licence","Anticiper les choix de L2 et L3","Valoriser ce que tu fais déjà"], html:`
<h4>La suite du cursus</h4>
<p>La L1 informatique se suit à Tours ou à Blois ; la L2 et la L3 se déroulent sur le site de Blois. Le département propose plusieurs dispositifs : un parcours renforcé européen avec double diplôme, une licence accélérée en deux ans pour les profils les plus solides, et des dispositifs d'accompagnement pour ceux qui doivent consolider les mathématiques.</p>

<li>L'anglais, prérequis de fait pour les parcours internationaux.</li>
</ul>
<h4>Valoriser ses projets</h4>
<p>Un projet personnel se raconte en trois phrases : le problème, ce que tu as construit, ce que tu en as appris. Les difficultés surmontées intéressent davantage un recruteur que la liste des technologies employées.</p>
<h4>Organisation</h4>
<p>Le rythme universitaire suppose autant de travail personnel que d'heures de cours : la maquette prévoit explicitement une charge de travail personnel comparable au volume en présentiel. Le décrochage vient presque toujours d'un retard accumulé en début de semestre, pas d'un manque de capacité.</p>
<h4>Dispositifs d'aide</h4>
<p>Tutorat, enseignants référents, directeur des études de L1 : ces relais existent et sont sous-utilisés. Demander de l'aide en octobre coûte infiniment moins cher qu'en janvier.</p>`,

    <p class="eyebrow">Université de Tours — UFR Sciences et Techniques</p>
    <h1>Licence 1<br>Informatique</h1>
    <p class="lede">Les huit unités d'enseignement de l'année, décomposées en cours par thème.
    ${INDEX.length} chapitres, ${faits} marqués comme acquis.</p>
  </section>`;

  PROGRAMME.forEach(sem => {
    const ects = sem.ues.reduce((a, u) => a + u.ects, 0);
    h += `<div class="semhead"><b>${sem.nom}</b><span>${ects} ECTS · 4 UE</span></div><div class="mapgrid">`;
    sem.ues.forEach(ue => {
      h += `<div class="ue"><h3>${ue.nom}</h3>
        <div class="uemeta">${ue.code} · ${ue.ects} ECTS · ${ue.h}</div><ul class="eclist">`;
      ue.ecs.forEach(ec => {
        const f = faitsEC(ec), t = totalEC(ec);
        h += `<li><button class="ecbtn" data-ec="${ec.code}">
          <span class="eccode">${ec.code}</span>
          <span class="ecname">${ec.nom}<span class="ecsub">${t} chapitres · ${ec.h}</span></span>
          <span class="pill">${f}/${t}</span></button></li>`;
      });
      h += `</ul></div>`;
    });
    h += `</div>`;
  });

  h += `<footer>
    <p>Programme établi à partir de la maquette officielle de la licence mention Informatique
    de l'Université de Tours (UFR Sciences et Techniques, Parc de Grandmont), version publiée en novembre 2025.
    La L1 est dispensée à Tours ou à Blois avec le même programme ; la L2 et la L3 se poursuivent à Blois.</p>
    <p>Les contenus de chapitre sont une synthèse pédagogique destinée à réviser, pas les supports
    de tes enseignants. Les cours officiels restent sur CELENE via l'ENT, et c'est eux qui font foi
    pour les partiels.</p>
    <p>Source : univ-tours.fr — fiche « Licence Sciences, Technologies, Santé mention Informatique ».</p>
  </footer>`;

  app.innerHTML = h;
  app.querySelectorAll(".ecbtn").forEach(b =>
    b.addEventListener("click", () => vueMatiere(b.dataset.ec)));
}

/* ---------- page matière ---------- */
function vueMatiere(code, ouvrir) {
  const ec = ECS[code];
  const f = faitsEC(ec), t = totalEC(ec);

  let h = `<button class="back" id="retour">&larr; Toutes les matières</button>
  <div class="mattete">
    <span class="eccode">${ec.code}</span>
    <h2 class="matname">${ec.nom}</h2>
    <div class="matmeta">
      <span class="tag b">${ec._sem}</span>
      <span class="tag">UE ${ec._ue}</span>
      <span class="tag">${ec.ects} ECTS</span>
      <span class="tag">${ec.h}</span>
    </div>
  </div>
  <p class="matresume">${ec.resume}</p>
  <p class="progline">${f} chapitre${f > 1 ? "s" : ""} sur ${t} marqué${f > 1 ? "s" : ""} comme acquis
    <span class="progbar"><i style="width:${t ? Math.round(f / t * 100) : 0}%"></i></span></p>`;

  ec.chapitres.forEach((ch, i) => {
    h += `<article class="chap" data-i="${i}">
      <button class="chaphead" aria-expanded="false">
        <span class="chapno">${String(i + 1).padStart(2, "0")}</span>
        <span class="chaptitle">${ch.t}</span>
        <span class="chev"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      </button>
      <div class="chapbody" hidden>
        ${ch.obj ? `<div class="obj"><p>Objectifs</p><ul>${ch.obj.map(o => "<li>" + o + "</li>").join("")}</ul></div>` : ""}
        ${ch.html}
        ${ch.retenir ? `<div class="retenir"><p>À retenir</p><div>${ch.retenir}</div></div>` : ""}
        ${ch.exos && ch.exos.length ? `<div class="exos"><p>Pour t'entraîner</p>` +
          ch.exos.map((e, j) => `<div class="exo"><p class="q"><b>${j + 1}</b>${e.q}</p>
            <button class="revbtn" data-rep="${i}-${j}">Voir la réponse</button>
            <div class="rep" id="rep-${i}-${j}">${e.r}</div></div>`).join("") + `</div>` : ""}
        <div class="donebar">
          <button class="donebtn" data-done="${i}" aria-pressed="${PROG[cle(ec, i)] ? "true" : "false"}">
            ${PROG[cle(ec, i)] ? "✓ Chapitre acquis" : "Marquer comme acquis"}
          </button>
        </div>
      </div>
    </article>`;
  });

  app.innerHTML = h;
  document.getElementById("retour").addEventListener("click", () => { vueAccueil(); monter(); });

  app.querySelectorAll(".chaphead").forEach(btn => {
    btn.addEventListener("click", () => {
      const art = btn.closest(".chap"), body = art.querySelector(".chapbody");
      const ouvert = art.classList.toggle("open");
      body.hidden = !ouvert;
      btn.setAttribute("aria-expanded", ouvert ? "true" : "false");
    });
  });

  app.querySelectorAll(".revbtn").forEach(b => {
    b.addEventListener("click", () => {
      const d = document.getElementById("rep-" + b.dataset.rep);
      const vu = d.classList.toggle("show");
      b.textContent = vu ? "Masquer la réponse" : "Voir la réponse";
    });
  });

  app.querySelectorAll(".donebtn").forEach(b => {
    b.addEventListener("click", () => {
      const i = +b.dataset.done, k = cle(ec, i);
      PROG[k] = !PROG[k];
      if (!PROG[k]) delete PROG[k];
      b.setAttribute("aria-pressed", PROG[k] ? "true" : "false");
      b.textContent = PROG[k] ? "✓ Chapitre acquis" : "Marquer comme acquis";
      const nf = faitsEC(ec), nt = totalEC(ec);
      const l = app.querySelector(".progline");
      l.childNodes[0].nodeValue = `${nf} chapitre${nf > 1 ? "s" : ""} sur ${nt} marqué${nf > 1 ? "s" : ""} comme acquis `;
      app.querySelector(".progbar i").style.width = Math.round(nf / nt * 100) + "%";
      sauverProgression();
    });
  });

  monter();
  if (ouvrir !== undefined) {
    const art = app.querySelector('.chap[data-i="' + ouvrir + '"]');
    if (art) {
      art.querySelector(".chaphead").click();
      setTimeout(() => art.scrollIntoView({behavior: "smooth", block: "start"}), 60);
    }
  }
}

/* ---------- recherche ---------- */
function vueRecherche(q) {
  const mots = q.toLowerCase().split(/\s+/).filter(Boolean);
  const trouves = INDEX.filter(e => mots.every(m => e.txt.includes(m))).slice(0, 40);

  let h = `<button class="back" id="retour">&larr; Toutes les matières</button>
    <div class="semhead"><b>${trouves.length} résultat${trouves.length > 1 ? "s" : ""}</b><span>« ${esc(q)} »</span></div>`;

  if (!trouves.length) {
    h += `<p class="empty">Aucun chapitre ne contient tous ces mots. Essaie un seul mot-clé,
      ou un terme du cours plutôt qu'une question complète.</p>`;
  }

  trouves.forEach((e, n) => {
    const p = e.txt.indexOf(mots[0]);
    let ex = e.plain.substr(Math.max(0, p - 70), 190);
    mots.forEach(m => {
      ex = ex.replace(new RegExp("(" + m.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>");
    });
    h += `<button class="res" data-n="${n}">
      <span class="rw">${e.ec.code} · ${e.ec.nom}</span>
      <p class="rt">${e.ch.t}</p>
      <p class="rx">…${ex}…</p></button>`;
  });

  app.innerHTML = h;
  document.getElementById("retour").addEventListener("click", () => {
    document.getElementById("q").value = ""; vueAccueil(); monter();
  });
  app.querySelectorAll(".res").forEach(b => {
    b.addEventListener("click", () => {
      const e = trouves[+b.dataset.n];
      document.getElementById("q").value = "";
      vueMatiere(e.ec.code, e.i);
    });
  });
  monter();
}

/* ---------- démarrage ---------- */
let minuteur;
document.getElementById("q").addEventListener("input", ev => {
  clearTimeout(minuteur);
  const v = ev.target.value.trim();
  minuteur = setTimeout(() => { v.length >= 2 ? vueRecherche(v) : vueAccueil(); }, 200);
});
document.getElementById("home").addEventListener("click", () => {
  document.getElementById("q").value = ""; vueAccueil(); monter();
});

chargerProgression().then(vueAccueil);

</script>
</body>
</html>
