<p>On fixe un repère orthonormé. Au point M de coordonnées (a, b) on associe le complexe z = a + ib, appelé <strong>affixe</strong> de M. Réciproquement, tout complexe correspond à un point.</p>
<p>Dans cette représentation, |z| est la longueur OM, et le conjugué correspond au symétrique par rapport à l'axe des abscisses.</p>
<h4>Exponentielle complexe</h4>
<div class="def"><b>Définition.</b> Pour θ réel, e<sup>iθ</sup> = cos θ + i sin θ.</div>
<p>C'est exactement le point du cercle trigonométrique d'angle θ. Conséquence immédiate : |e<sup>iθ</sup>| = 1, puisque cos² + sin² = 1.</p>
<h4>Propriétés</h4>
<ul>
<li>e<sup>i(θ+θ')</sup> = e<sup>iθ</sup> × e<sup>iθ'</sup> — l'exponentielle transforme les sommes d'angles en produits.</li>
<li>e<sup>-iθ</sup> est à la fois le conjugué et l'inverse de e<sup>iθ</sup>.</li>
<li>e<sup>iθ</sup> = 1 équivaut à θ = 2kπ avec k entier.</li>
</ul>
<h4>Argument</h4>
<div class="def"><b>Définition 3.1 du poly.</b> Pour z non nul, il existe θ réel tel que z = |z| e<sup>iθ</sup>. Ce θ est l'argument de z, noté arg(z) = θ modulo 2π. L'écriture |z| e<sup>iθ</sup> est la forme exponentielle, ou trigonométrique, de z.</div>
<p>L'argument n'est défini qu'à un multiple de 2π près, ce que signifie la mention « modulo 2π ». Le complexe 0 n'a pas d'argument.</p>
<h4>Propriétés de l'argument</h4>
<ul>
<li>arg(zz') = arg(z) + arg(z') modulo 2π</li>
<li>arg(z<sup>n</sup>) = n arg(z) modulo 2π</li>
<li>arg(z barre) = -arg(z) et arg(1/z) = -arg(z)</li>
</ul>
<p>Retiens la logique : multiplier des complexes revient à <strong>multiplier les modules et additionner les arguments</strong>. C'est ce qui fait de la multiplication complexe une rotation-homothétie.</p>
<h4>Méthode : passer en forme exponentielle</h4>
<p>Pour z = 1 + i : le module vaut √2. On factorise : z = √2 (1/√2 + i/√2) = √2 (√2/2 + i√2/2). On reconnaît cos(π/4) et sin(π/4), donc z = √2 e<sup>iπ/4</sup>.</p>
<p>Méthode générale : calculer |z|, factoriser par |z|, puis identifier l'angle dont le cosinus et le sinus apparaissent. Le tableau de valeurs du premier chapitre suffit dans presque tous les exercices.</p>`,
retenir:"e^(iθ) = cos θ + i sin θ est le point du cercle d'angle θ. Forme exponentielle : z = |z| e^(iθ). Multiplier des complexes = multiplier les modules, additionner les arguments.",
exos:[
{q:"Mets z = 1 + i sous forme exponentielle.",r:"|z| = √2 et l'angle est π/4, donc z = √2 e^(iπ/4)."},
{q:"Mets z = -1 sous forme exponentielle.",r:"|z| = 1 et l'angle est π, donc z = e^(iπ)."},
{q:"Mets z = 2i sous forme exponentielle.",r:"|z| = 2 et l'angle est π/2, donc z = 2 e^(iπ/2)."},
{q:"Mets z = 1 - i√3 sous forme exponentielle.",r:"|z| = √(1+3) = 2. On factorise : 2(1/2 - i√3/2), ce qui correspond à l'angle -π/3. Donc z = 2 e^(-iπ/3)."},
{q:"Mets z = 3 e^(iπ/6) sous forme algébrique.",r:"3(cos(π/6) + i sin(π/6)) = 3(√3/2 + i/2) = 3√3/2 + (3/2)i."},
{q:"Calcule le produit 2e^(iπ/3) × 5e^(iπ/6) sous forme exponentielle.",r:"On multiplie les modules et on additionne les arguments : 10 e^(iπ/2), soit 10i."},
{q:"Que vaut arg((1+i)⁸) ?",r:"8 × π/4 = 2π, soit 0 modulo 2π. Le nombre est donc réel positif."},
{q:"Calcule (1+i)⁸ en passant par la forme exponentielle.",r:"(√2)⁸ e^(i2π) = 16. Bien plus rapide que huit multiplications."},
{q:"Donne l'argument de z barre si arg(z) = 2π/3.",r:"-2π/3 modulo 2π, soit 4π/3."},
{q:"Que représente géométriquement la multiplication par i ?",r:"Une rotation d'angle π/2 autour de l'origine, puisque i a pour module 1 et pour argument π/2."}
]},

{t:"Moivre, Euler et applications", obj:["Utiliser la formule de Moivre","Utiliser les formules d'Euler","Linéariser une expression trigonométrique"], html:`
<h4>Formule de Moivre</h4>
<div class="def"><b>Énoncé.</b> Pour θ réel et n entier, (cos θ + i sin θ)<sup>n</sup> = cos(nθ) + i sin(nθ).</div>
<p>C'est simplement l'écriture (e<sup>iθ</sup>)<sup>n</sup> = e<sup>inθ</sup>. Elle permet d'exprimer cos(nθ) et sin(nθ) en fonction de cos θ et sin θ : on développe le membre de gauche avec le binôme de Newton, puis on identifie parties réelles et imaginaires.</p>
<p><em>Exemple guidé.</em> Pour n = 2 : (cos θ + i sin θ)² = cos²θ - sin²θ + 2i sin θ cos θ. En identifiant avec cos(2θ) + i sin(2θ), on retrouve d'un coup les deux formules de duplication.</p>
<h4>Formules d'Euler</h4>
<p>En additionnant et en soustrayant e<sup>iθ</sup> = cos θ + i sin θ et e<sup>-iθ</sup> = cos θ - i sin θ :</p>
<p style="text-align:center">cos θ = (e<sup>iθ</sup> + e<sup>-iθ</sup>)/2 &nbsp;&nbsp;&nbsp; sin θ = (e<sup>iθ</sup> - e<sup>-iθ</sup>)/(2i)</p>
<div class="piege"><b>Le 2i.</b> C'est bien 2i au dénominateur du sinus, pas 2. L'oubli du i est l'erreur classique.</div>
<h4>Linéarisation</h4>
<p>Transformer une puissance de cosinus ou de sinus en une somme de cosinus et de sinus d'angles multiples. On remplace par Euler, on développe avec le binôme, puis on regroupe pour reformer des Euler.</p>
<p><em>Exemple guidé.</em> cos²θ = ((e<sup>iθ</sup> + e<sup>-iθ</sup>)/2)² = (e<sup>2iθ</sup> + 2 + e<sup>-2iθ</sup>)/4 = (2cos(2θ) + 2)/4 = (1 + cos(2θ))/2.</p>
<p>C'est le geste qui rend intégrable une puissance de cosinus, et il resservira toute l'année en Analyse.</p>
<h4>Racines n-ièmes de l'unité</h4>
<p>Les solutions de z<sup>n</sup> = 1 sont les n complexes e<sup>2ikπ/n</sup> pour k allant de 0 à n-1. Ils forment un polygone régulier à n sommets inscrit dans le cercle unité, et leur somme est nulle dès que n dépasse 1.</p>
<p>Ces racines sont au cœur de la transformée de Fourier rapide, l'un des algorithmes les plus utilisés en informatique.</p>`,
retenir:"Moivre : (cos θ + i sin θ)^n = cos nθ + i sin nθ. Euler : cos et sin s'écrivent avec des exponentielles, attention au 2i pour le sinus. Linéariser = remplacer par Euler, développer, regrouper.",
exos:[
{q:"Utilise Moivre pour exprimer cos(3θ) en fonction de cos θ.",r:"On développe (cos θ + i sin θ)³ et on prend la partie réelle : cos³θ - 3cos θ sin²θ. En remplaçant sin² par 1 - cos² : 4cos³θ - 3cos θ."},
{q:"Exprime sin(3θ) en fonction de sin θ.",r:"Partie imaginaire du même développement : 3cos²θ sin θ - sin³θ = 3sin θ - 4sin³θ."},
{q:"Linéarise sin²θ.",r:"((e^(iθ) - e^(-iθ))/(2i))² = (e^(2iθ) - 2 + e^(-2iθ))/(-4) = (2 - 2cos 2θ)/4 = (1 - cos 2θ)/2."},
{q:"Linéarise cos³θ.",r:"En développant ((e^(iθ)+e^(-iθ))/2)³ on obtient (cos 3θ + 3cos θ)/4."},
{q:"Calcule (1 + i)^10 avec Moivre.",r:"1+i = √2 e^(iπ/4), donc la puissance vaut (√2)^10 e^(i10π/4) = 32 e^(i5π/2) = 32 e^(iπ/2) = 32i."},
{q:"Résous z³ = 1 dans ℂ.",r:"Les trois racines cubiques de l'unité : 1, e^(2iπ/3) et e^(4iπ/3), soit 1, -1/2 + i√3/2 et -1/2 - i√3/2."},
{q:"Résous z⁴ = 1 dans ℂ.",r:"1, i, -1, -i, c'est-à-dire e^(2ikπ/4) pour k = 0, 1, 2, 3."},
{q:"Que vaut la somme des trois racines cubiques de l'unité ?",r:"0. C'est une somme géométrique de raison e^(2iπ/3), dont le numérateur s'annule."},
{q:"Que vaut e^(iπ) + 1 ?",r:"0, puisque e^(iπ) = cos π + i sin π = -1. C'est l'identité d'Euler."},
{q:"Résous z⁶ = 64 dans ℂ.",r:"Le module des solutions vaut 2 et les arguments sont 2kπ/6. Les solutions sont 2e^(ikπ/3) pour k allant de 0 à 5."}
]},

{t:"Racine carrée d'un nombre complexe", obj:["Comprendre pourquoi la notation racine est interdite dans ℂ","Trouver une racine carrée par la forme exponentielle","Trouver une racine carrée par le système algébrique"], html:`
<h4>Le résultat</h4>
<div class="def"><b>Proposition 4.1 du poly.</b> Tout nombre complexe z admet une racine carrée : il existe w dans ℂ tel que z = w².</div>
<p>Si w convient, alors -w aussi, puisque (-w)² = w². Ce sont les deux seules.</p>
<div class="piege"><b>Interdiction de notation.</b> Comme il y a deux racines sans moyen naturel de choisir laquelle, on ne peut pas parler de « la » racine carrée d'un complexe. Le symbole √z est donc <strong>interdit</strong> dans ℂ, sauf si z est un réel positif. Écrire √(-4) = 2i est une faute.</div>
<h4>Méthode 1 : par la forme exponentielle</h4>
<p>Si z = |z| e<sup>iθ</sup>, alors w = √|z| e<sup>iθ/2</sup> convient, puisque son carré redonne z. C'est immédiat lorsque l'argument est un angle usuel.</p>
<p><em>Exemple.</em> Pour z = 4i = 4 e<sup>iπ/2</sup>, une racine est 2 e<sup>iπ/4</sup> = √2 + i√2. L'autre est son opposée.</p>
<h4>Méthode 2 : par le système algébrique</h4>
<p>C'est la méthode du poly, utile quand l'argument n'est pas un angle remarquable. On pose z = a + ib et w = x + iy, et on écrit w² = z :</p>
<p>(x + iy)² = a + ib donne x² - y² = a et 2xy = b.</p>
<p>On ajoute une troisième équation en prenant les modules : |w|² = |z|, c'est-à-dire x² + y² = √(a² + b²).</p>
<p>Le système à trois équations se résout facilement : en additionnant les deux équations en x² et y² on obtient x², en les soustrayant on obtient y². Enfin, le <strong>signe de b</strong> indique si x et y sont de même signe (b positif) ou de signes contraires (b négatif).</p>
<h4>Exemple guidé</h4>
<p>Cherchons une racine carrée de z = 3 + 4i. On a |z| = 5, donc :</p>
<ul>
<li>x² + y² = 5</li>
<li>x² - y² = 3</li>
<li>2xy = 4, donc xy = 2 &gt; 0 : x et y de même signe.</li>
</ul>
<p>En additionnant : 2x² = 8, donc x = ±2. En soustrayant : 2y² = 2, donc y = ±1. Comme le produit est positif, les solutions sont w = 2 + i et w = -2 - i. Vérification : (2+i)² = 4 + 4i - 1 = 3 + 4i.</p>`,
retenir:"Tout complexe a exactement deux racines carrées, opposées. Le symbole √ est interdit dans ℂ. Deux méthodes : forme exponentielle si l'angle est usuel, sinon le système à trois équations avec le signe de b pour conclure.",
exos:[
{q:"Trouve les racines carrées de -9.",r:"3i et -3i, puisque (3i)² = -9. Attention : on n'écrit pas √(-9)."},
{q:"Trouve les racines carrées de i.",r:"i = e^(iπ/2), donc une racine est e^(iπ/4) = √2/2 + i√2/2, et l'autre son opposée."},
{q:"Trouve les racines carrées de 2i.",r:"2i = 2e^(iπ/2), donc √2 e^(iπ/4) = 1 + i, et -1 - i."},
{q:"Trouve les racines carrées de 8 - 6i.",r:"|z| = 10. Système : x² + y² = 10, x² - y² = 8, xy = -3 < 0. Donc x² = 9 et y² = 1, avec x et y de signes contraires : w = 3 - i ou w = -3 + i."},
{q:"Trouve les racines carrées de -5 + 12i.",r:"|z| = 13. x² = 4 et y² = 9, avec xy = 6 > 0 : w = 2 + 3i ou w = -2 - 3i."},
{q:"Pourquoi ne peut-on pas écrire √(-1) = i ?",r:"Parce que -i convient tout autant, et qu'aucun critère naturel ne permet de choisir. La notation supposerait une racine privilégiée, ce qui n'existe pas dans ℂ."},
{q:"Trouve les racines carrées de -4.",r:"2i et -2i."},
{q:"Trouve les racines carrées de 4e^(2iπ/3).",r:"2e^(iπ/3) = 1 + i√3, et son opposée -1 - i√3."}
]},

{t:"Équations du second degré dans ℂ", obj:["Résoudre une équation à coefficients complexes","Appliquer le cas réel selon le signe du discriminant","Factoriser un trinôme"], html:`
<h4>Le cas général</h4>
<div class="def"><b>Proposition 4.2 du poly.</b> L'équation az² + bz + c = 0, avec a, b, c complexes et a non nul, possède deux solutions dans ℂ (éventuellement confondues). En notant Δ = b² - 4ac et δ une racine carrée de Δ, les solutions sont z₁ = (-b + δ)/(2a) et z₂ = (-b - δ)/(2a).</div>
<p>La différence avec le lycée : dans ℂ, il n'y a plus de cas sans solution, puisque tout Δ admet une racine carrée. Il faut simplement la calculer avec le chapitre précédent.</p>
<h4>D'où vient la formule</h4>
<p>C'est la mise sous forme canonique. On factorise par a, on complète le carré, et il reste une différence de deux carrés que l'on factorise :</p>
<p>az² + bz + c = a[(z + b/2a)² - Δ/4a²] = a[(z + b/2a)² - (δ/2a)²] = a(z - z₁)(z - z₂)</p>
<p>Cette factorisation est aussi importante que la formule elle-même : elle permet de simplifier des fractions rationnelles et de résoudre des inéquations.</p>
<h4>Le cas des coefficients réels</h4>
<p><b>Proposition 4.3 du poly.</b> Si a, b, c sont réels et a non nul, Δ est réel et :</p>
<ul>
<li>si Δ &gt; 0 : deux solutions réelles, (-b ± √Δ)/(2a) ;</li>
<li>si Δ = 0 : une solution réelle double, -b/(2a) ;</li>
<li>si Δ &lt; 0 : deux solutions complexes conjuguées, (-b ± i√(-Δ))/(2a).</li>
</ul>
<div class="piege"><b>Le signe sous la racine.</b> Quand Δ est négatif, on écrit i√(-Δ), avec -Δ positif. Écrire √Δ n'aurait aucun sens.</div>
<h4>Exemple guidé, coefficients réels</h4>
<p>z² + 2z + 5 = 0. Δ = 4 - 20 = -16, négatif. Alors √(-Δ) = 4, et les solutions sont (-2 ± 4i)/2 = -1 + 2i et -1 - 2i. Elles sont bien conjuguées.</p>
<h4>Exemple guidé, coefficients complexes</h4>
<p>z² - (3 + i)z + (2 + 2i) = 0. On calcule Δ = (3+i)² - 4(2+2i) = 9 + 6i - 1 - 8 - 8i = -2i. Une racine carrée de -2i est δ = 1 - i (vérification : (1-i)² = 1 - 2i - 1 = -2i). Les solutions sont donc ((3+i) ± (1-i))/2, soit z₁ = 2 et z₂ = 1 + i.</p>
<h4>Somme et produit</h4>
<p>Les deux solutions vérifient toujours z₁ + z₂ = -b/a et z₁z₂ = c/a. C'est un moyen rapide de vérifier un résultat, ou de trouver la seconde racine quand on en devine une.</p>`,
retenir:"Dans ℂ il y a toujours deux solutions. On calcule Δ, on en cherche une racine carrée δ, et on applique (-b ± δ)/(2a). Avec des coefficients réels et Δ négatif, les solutions sont conjuguées.",
exos:[
{q:"Résous z² + 1 = 0.",r:"z² = -1, donc z = i ou z = -i."},
{q:"Résous z² - 2z + 5 = 0.",r:"Δ = 4 - 20 = -16. Solutions : (2 ± 4i)/2 = 1 + 2i et 1 - 2i."},
{q:"Résous z² + z + 1 = 0.",r:"Δ = 1 - 4 = -3. Solutions : (-1 ± i√3)/2, les deux racines cubiques non réelles de l'unité."},
{q:"Résous z² - 4z + 4 = 0.",r:"Δ = 0, racine double z = 2."},
{q:"Résous z² - 6z + 13 = 0.",r:"Δ = 36 - 52 = -16. Solutions : 3 + 2i et 3 - 2i."},
{q:"Factorise z² + 4 dans ℂ.",r:"Les racines sont 2i et -2i, donc z² + 4 = (z - 2i)(z + 2i)."},
{q:"Résous z² - (1 + 3i)z + (-2 + 2i) = 0.",r:"Δ = (1+3i)² - 4(-2+2i) = 1 + 6i - 9 + 8 - 8i = -2i. Une racine carrée est 1 - i. Solutions : ((1+3i) ± (1-i))/2, soit 1 + i et i."},
{q:"Une équation à coefficients réels admet 2 - 3i comme solution. Quelle est l'autre ?",r:"2 + 3i. Avec des coefficients réels, les solutions non réelles vont toujours par paires conjuguées."},
{q:"Trouve l'équation du second degré unitaire dont les solutions sont 1+i et 1-i.",r:"Somme = 2, produit = (1+i)(1-i) = 2. L'équation est z² - 2z + 2 = 0."},
{q:"Résous z⁴ + 3z² - 4 = 0 dans ℂ.",r:"On pose Z = z². Alors Z² + 3Z - 4 = 0 donne Z = 1 ou Z = -4. D'où z = ±1 ou z = ±2i : quatre solutions."}
]}
];
const CH_EXAMS = [
{t:"DS blanc n°1 — Chapitre Nombres", obj:["Se mettre en conditions d'examen","Gérer son temps sur quatre exercices","Rédiger une récurrence notée"], html:`
<div class="obj"><p>Conditions</p><ul>
<li>Durée : 1h30. Barème sur 20. Calculatrice et documents interdits.</li>
<li>Fais le sujet en entier avant de regarder le moindre corrigé, en bas de page.</li>
<li>La rédaction compte : une récurrence sans initialisation perd la moitié des points.</li>
</ul></div>

<h4>Exercice 1 — Questions rapides (4 points)</h4>
<ol>
<li>Mettre 84/126 sous forme irréductible.</li>
<li>Montrer que si n est impair, alors n² + n est pair.</li>
<li>Résoudre -5x + 3 ≥ 18 et donner l'ensemble des solutions sous forme d'intervalle.</li>
<li>Simplifier (a<sup>3</sup>b<sup>-2</sup>)<sup>2</sup> / (a<sup>-1</sup>b<sup>3</sup>) pour a et b non nuls.</li>
</ol>

<h4>Exercice 2 — Symbole somme (5 points)</h4>
<ol>
<li>Calculer Σ (i = 1 à n) (2i - 1) et simplifier le résultat au maximum.</li>
<li>Calculer Σ (i = 0 à n) 3<sup>i</sup>.</li>
<li>Calculer Σ (i = 1 à n) (1/2)<sup>i</sup>.</li>
<li>Par un changement d'indice, montrer que Σ (i = 2 à n+1) (i - 1) = n(n+1)/2.</li>
</ol>

<h4>Exercice 3 — Raisonnement par récurrence (6 points)</h4>
<ol>
<li>Démontrer par récurrence que pour tout entier n ≥ 0, Σ (i = 0 à n) i² = n(n+1)(2n+1)/6.</li>
<li>Démontrer par récurrence que 7 divise 8<sup>n</sup> - 1 pour tout entier n ≥ 0.</li>
</ol>

<h4>Exercice 4 — Binôme et dénombrement (5 points)</h4>
<ol>
<li>Déterminer le coefficient de x<sup>5</sup> dans le développement de (2x - 1)<sup>7</sup>.</li>
<li>En utilisant le binôme de Newton, calculer Σ (i = 0 à n) « i parmi n » puis Σ (i = 0 à n) (-1)<sup>i</sup> « i parmi n » pour n ≥ 1.</li>
<li>Un ensemble E possède 7 éléments. Combien E a-t-il de parties à 3 éléments ? Combien de parties en tout ?</li>
</ol>`,
retenir:"Sur un DS de ce type, l'exercice de récurrence pèse presque un tiers de la note et ne demande aucune idée : uniquement de la rédaction propre. C'est là que se gagnent les points les plus faciles.",
exos:[
{q:"Corrigé de l'exercice 1 (4 points)",r:"1) 84 = 42×2 et 126 = 42×3, donc 84/126 = 2/3. — 2) n impair s'écrit n = 2k+1. Alors n² + n = n(n+1) = (2k+1)(2k+2) = 2(2k+1)(k+1), qui est pair. On peut aussi dire que le produit de deux entiers consécutifs est toujours pair. — 3) -5x ≥ 15, division par -5 avec renversement : x ≤ -3. Solutions : ]-∞, -3]. — 4) Numérateur : a⁶b⁻⁴. On divise par a⁻¹b³ : a^(6+1) b^(-4-3) = a⁷b⁻⁷, soit (a/b)⁷."},
{q:"Corrigé de l'exercice 2 (5 points)",r:"1) Σ(2i-1) = 2Σi - Σ1 = 2 × n(n+1)/2 - n = n² + n - n = n². Joli résultat : la somme des n premiers impairs vaut n². — 2) Somme géométrique de raison 3 : (3^(n+1) - 1)/(3 - 1) = (3^(n+1) - 1)/2. — 3) On calcule la somme de 0 à n puis on retire le terme i = 0 qui vaut 1 : (1 - (1/2)^(n+1))/(1/2) - 1 = 2 - (1/2)^n - 1 = 1 - (1/2)^n. — 4) On pose j = i - 1. Quand i va de 2 à n+1, j va de 1 à n, et i - 1 = j. La somme devient Σ(j = 1 à n) j = n(n+1)/2."},
{q:"Corrigé de l'exercice 3 (6 points)",r:"1) Initialisation, n = 0 : la somme vaut 0 et la formule donne 0×1×1/6 = 0. Vraie. Hérédité : on suppose la formule au rang n. Alors la somme jusqu'à n+1 vaut n(n+1)(2n+1)/6 + (n+1)². On factorise par (n+1)/6 : (n+1)[n(2n+1) + 6(n+1)]/6 = (n+1)(2n² + 7n + 6)/6. Or 2n² + 7n + 6 = (n+2)(2n+3), donc on obtient (n+1)(n+2)(2n+3)/6, qui est bien la formule au rang n+1. Conclusion : vraie pour tout n ≥ 0. — 2) Initialisation, n = 0 : 8⁰ - 1 = 0, divisible par 7. Hérédité : on suppose 8^n - 1 = 7k. Alors 8^(n+1) - 1 = 8 × 8^n - 1 = 8(8^n - 1) + 7 = 56k + 7 = 7(8k + 1), divisible par 7. Conclusion pour tout n ≥ 0."},
{q:"Corrigé de l'exercice 4 (5 points)",r:"1) On applique le binôme avec a = 2x et b = -1 : le terme en x⁵ est « 5 parmi 7 » × (2x)⁵ × (-1)² = 21 × 32 x⁵. Le coefficient vaut 672. — 2) Avec a = b = 1 : Σ « i parmi n » = (1+1)^n = 2^n. Avec a = -1 et b = 1 : Σ (-1)^i « i parmi n » = (-1+1)^n = 0 pour n ≥ 1. — 3) Parties à 3 éléments : « 3 parmi 7 » = 35. Parties en tout : 2⁷ = 128, ce qui est cohérent avec la question précédente."}
]},

{t:"DS blanc n°2 — Nombres complexes", obj:["S'entraîner sur un sujet complet de complexes","Passer d'une forme à l'autre sous contrainte de temps","Traiter une équation à coefficients complexes"], html:`
<div class="obj"><p>Conditions</p><ul>
<li>Durée : 1h30. Barème sur 20. Calculatrice interdite.</li>
<li>Toute racine carrée d'un complexe doit être justifiée, jamais écrite avec le symbole √.</li>
</ul></div>

<h4>Exercice 1 — Calculs sous forme algébrique (4 points)</h4>
<ol>
<li>Calculer (3 - 2i)(1 + 4i).</li>
<li>Mettre (2 + i)/(3 - 2i) sous forme algébrique.</li>
<li>Calculer i<sup>2027</sup>.</li>
<li>Déterminer les réels x et y tels que (x + y) + i(x - y) = 6 - 2i.</li>
</ol>

<h4>Exercice 2 — Module, argument, puissances (5 points)</h4>
<p>On pose z = -√3 + i.</p>
<ol>
<li>Calculer |z|.</li>
<li>Mettre z sous forme exponentielle.</li>
<li>En déduire z<sup>6</sup> sous forme algébrique.</li>
<li>Déterminer le plus petit entier n ≥ 1 tel que z<sup>n</sup> soit un réel.</li>
</ol>

<h4>Exercice 3 — Racine carrée et second degré (5 points)</h4>
<ol>
<li>Déterminer les racines carrées de -7 + 24i.</li>
<li>Résoudre dans ℂ l'équation z² - (5 + i)z + (8 + i) = 0.</li>
<li>Vérifier le résultat à l'aide de la somme et du produit des racines.</li>
</ol>

<h4>Exercice 4 — Trigonométrie et lieux géométriques (6 points)</h4>
<ol>
<li>Linéariser sin³θ, c'est-à-dire l'exprimer comme somme de sinus d'angles multiples.</li>
<li>À l'aide de la formule de Moivre, exprimer cos(4θ) en fonction de cos θ uniquement.</li>
<li>Déterminer l'ensemble des points M d'affixe z vérifiant |z - 2| = |z + i|.</li>
<li>Déterminer l'ensemble des points M d'affixe z vérifiant |z - 1 + 2i| = 3.</li>
</ol>`,
retenir:"Deux réflexes qui rapportent gros : passer en forme exponentielle dès qu'une puissance apparaît, et traduire tout module en distance pour les lieux géométriques.",
exos:[
{q:"Corrigé de l'exercice 1 (4 points)",r:"1) 3 + 12i - 2i - 8i² = 3 + 10i + 8 = 11 + 10i. — 2) On multiplie haut et bas par 3 + 2i : numérateur (2+i)(3+2i) = 6 + 4i + 3i - 2 = 4 + 7i, dénominateur 9 + 4 = 13. Résultat : 4/13 + (7/13)i. — 3) 2027 = 4 × 506 + 3, donc i^2027 = i³ = -i. — 4) Par unicité de l'écriture algébrique : x + y = 6 et x - y = -2. En additionnant, 2x = 4 donc x = 2 et y = 4."},
{q:"Corrigé de l'exercice 2 (5 points)",r:"1) |z| = √(3 + 1) = 2. — 2) z = 2(-√3/2 + i/2). On cherche l'angle dont le cosinus vaut -√3/2 et le sinus 1/2 : c'est 5π/6. Donc z = 2 e^(i5π/6). — 3) z⁶ = 2⁶ e^(i5π) = 64 e^(iπ) = -64. (5π est congru à π modulo 2π.) — 4) z^n est réel quand son argument 5nπ/6 est un multiple de π, c'est-à-dire quand 5n/6 est entier, donc quand n est multiple de 6. Le plus petit est n = 6."},
{q:"Corrigé de l'exercice 3 (5 points)",r:"1) On pose w = x + iy avec w² = -7 + 24i. Le module vaut √(49 + 576) = 25. Système : x² + y² = 25, x² - y² = -7, et 2xy = 24 donc xy = 12 > 0. En additionnant les deux premières : 2x² = 18, d'où x = ±3 ; en les soustrayant : 2y² = 32, d'où y = ±4. Le produit étant positif, x et y sont de même signe : les racines sont 3 + 4i et -3 - 4i. — 2) Δ = (5+i)² - 4(8+i) = 25 + 10i - 1 - 32 - 4i = -8 + 6i. Racine carrée de Δ : module 10, système x² + y² = 10, x² - y² = -8, xy = 3 > 0, d'où x = ±1 et y = ±3 de même signe : δ = 1 + 3i. Solutions : ((5+i) + (1+3i))/2 = 3 + 2i et ((5+i) - (1+3i))/2 = 2 - i. — 3) Somme : (3+2i) + (2-i) = 5 + i, c'est bien -b/a. Produit : (3+2i)(2-i) = 6 - 3i + 4i + 2 = 8 + i, c'est bien c/a."},
{q:"Corrigé de l'exercice 4 (6 points)",r:"1) Par Euler, sin³θ = ((e^(iθ) - e^(-iθ))/(2i))³. Le dénominateur vaut (2i)³ = -8i. Le numérateur se développe en e^(3iθ) - 3e^(iθ) + 3e^(-iθ) - e^(-3iθ) = 2i sin(3θ) - 6i sin(θ). En divisant par -8i : sin³θ = (3 sin θ - sin 3θ)/4. — 2) cos(4θ) = 2cos²(2θ) - 1 = 2(2cos²θ - 1)² - 1 = 8cos⁴θ - 8cos²θ + 1. — 3) |z - 2| est la distance de M au point A d'affixe 2, et |z + i| la distance au point B d'affixe -i. L'ensemble est donc la médiatrice du segment [AB]. — 4) |z - (1 - 2i)| = 3 est la distance de M au point d'affixe 1 - 2i. L'ensemble est le cercle de centre ce point et de rayon 3."}
]},

{t:"Partiel blanc — sujet complet 2h", obj:["Traiter un sujet couvrant les deux chapitres","Aborder un problème guidé en plusieurs questions","Repérer ses points faibles avant le vrai partiel"], html:`
<div class="obj"><p>Conditions</p><ul>
<li>Durée : 2h. Barème sur 20. Documents et calculatrice interdits.</li>
<li>Les exercices sont indépendants. Le problème final est guidé : chaque question sert à la suivante.</li>
</ul></div>

<h4>Exercice 1 — Vrai ou faux, avec justification (4 points)</h4>
<p>Pour chaque affirmation, dire si elle est vraie ou fausse et le justifier en une ou deux lignes.</p>
<ol>
<li>Pour tous réels x et y, si x ≤ y alors x² ≤ y².</li>
<li>Le nombre 0 est imaginaire pur.</li>
<li>Pour tout complexe z, |z + z'| = |z| + |z'|.</li>
<li>Si n est un entier tel que n² est divisible par 3, alors n est divisible par 3.</li>
</ol>

<h4>Exercice 2 — Sommes et récurrence (4 points)</h4>
<ol>
<li>Calculer Σ (i = 1 à n) i(i + 1) en fonction de n. <em>(indication : développer, puis utiliser les deux sommes classiques)</em></li>
<li>Démontrer par récurrence que pour tout n ≥ 1, Σ (i = 1 à n) 1/(i(i+1)) = n/(n+1).</li>
</ol>

<h4>Exercice 3 — Binôme (3 points)</h4>
<ol>
<li>Développer (1 + i)<sup>6</sup> à l'aide du binôme de Newton.</li>
<li>Retrouver ce résultat par la forme exponentielle.</li>
<li>Que peut-on en déduire sur la somme des « i parmi 6 » affectés des puissances de i ?</li>
</ol>

<h4>Exercice 4 — Complexes (4 points)</h4>
<p>On pose z₁ = 1 + i√3 et z₂ = 1 + i.</p>
<ol>
<li>Mettre z₁ et z₂ sous forme exponentielle.</li>
<li>Calculer z₁/z₂ sous forme exponentielle, puis sous forme algébrique.</li>
<li>En déduire les valeurs exactes de cos(π/12) et sin(π/12).</li>
</ol>

<h4>Problème — Les racines cubiques de l'unité (5 points)</h4>
<p>On pose j = e<sup>2iπ/3</sup>.</p>
<ol>
<li>Donner la forme algébrique de j.</li>
<li>Montrer que j³ = 1, puis que 1 + j + j² = 0.</li>
<li>Montrer que j² est le conjugué de j.</li>
<li>Résoudre dans ℂ l'équation z² + z + 1 = 0 et faire le lien avec la question 2.</li>
<li>Soit n un entier naturel. Montrer que 1 + j<sup>n</sup> + j<sup>2n</sup> vaut 3 si n est multiple de 3, et 0 sinon.</li>
</ol>`,
retenir:"Un problème guidé se traite dans l'ordre : la question k sert presque toujours à la question k+1. Si tu bloques sur une question, admets son résultat et continue — les points suivants restent accessibles.",
exos:[
{q:"Corrigé de l'exercice 1 (4 points)",r:"1) Faux. Contre-exemple : x = -3 et y = 1 vérifient x ≤ y mais 9 > 1. C'est vrai seulement si x et y sont positifs. — 2) Vrai. Sa partie réelle est nulle, ce qui est la définition. Il est d'ailleurs à la fois réel et imaginaire pur. — 3) Faux. L'inégalité triangulaire donne ≤, avec égalité seulement si les deux nombres ont le même argument. Contre-exemple : z = 1 et z' = -1 donnent 0 d'un côté et 2 de l'autre. — 4) Vrai. Par contraposée : si n n'est pas divisible par 3, il s'écrit 3k+1 ou 3k+2, et dans les deux cas n² laisse un reste de 1 dans la division par 3."},
{q:"Corrigé de l'exercice 2 (4 points)",r:"1) i(i+1) = i² + i, donc la somme vaut n(n+1)(2n+1)/6 + n(n+1)/2. On factorise par n(n+1)/6 : n(n+1)[(2n+1) + 3]/6 = n(n+1)(2n+4)/6 = n(n+1)(n+2)/3. — 2) Initialisation n = 1 : le membre de gauche vaut 1/2 et le membre de droite 1/2. Vraie. Hérédité : on suppose la formule au rang n. Alors la somme au rang n+1 vaut n/(n+1) + 1/((n+1)(n+2)) = [n(n+2) + 1]/((n+1)(n+2)) = (n² + 2n + 1)/((n+1)(n+2)) = (n+1)²/((n+1)(n+2)) = (n+1)/(n+2). C'est bien la formule au rang n+1. Conclusion pour tout n ≥ 1."},
{q:"Corrigé de l'exercice 3 (3 points)",r:"1) Les coefficients de la ligne 6 sont 1, 6, 15, 20, 15, 6, 1 et les puissances de i valent 1, i, -1, -i, 1, i, -1. On obtient 1 + 6i - 15 - 20i + 15 + 6i - 1 = 0 - 8i = -8i. — 2) 1 + i = √2 e^(iπ/4), donc (1+i)⁶ = (√2)⁶ e^(i6π/4) = 8 e^(i3π/2) = -8i. Les deux méthodes concordent. — 3) On en déduit que Σ (k = 0 à 6) « k parmi 6 » i^k = -8i : la partie réelle du développement est nulle et la partie imaginaire vaut -8. En séparant, 1 - 15 + 15 - 1 = 0 et 6 - 20 + 6 = -8."},
{q:"Corrigé de l'exercice 4 (4 points)",r:"1) |z₁| = √(1+3) = 2, et z₁ = 2(1/2 + i√3/2) donne l'angle π/3 : z₁ = 2e^(iπ/3). |z₂| = √2 et l'angle est π/4 : z₂ = √2 e^(iπ/4). — 2) Le quotient vaut (2/√2) e^(i(π/3 - π/4)) = √2 e^(iπ/12). Sous forme algébrique, on multiplie haut et bas par le conjugué de z₂ : (1 + i√3)(1 - i)/2 = (1 - i + i√3 + √3)/2 = (1+√3)/2 + i(√3-1)/2. — 3) En identifiant √2(cos(π/12) + i sin(π/12)) avec le résultat précédent : cos(π/12) = (1+√3)/(2√2) = (√6 + √2)/4 et sin(π/12) = (√3-1)/(2√2) = (√6 - √2)/4."},
{q:"Corrigé du problème (5 points)",r:"1) j = cos(2π/3) + i sin(2π/3) = -1/2 + i√3/2. — 2) j³ = e^(2iπ) = 1. Ensuite, 1 + j + j² est une somme géométrique de raison j ≠ 1 : elle vaut (j³ - 1)/(j - 1) = 0 puisque j³ = 1. — 3) j² = e^(4iπ/3) = e^(-2iπ/3), qui est bien le conjugué de e^(2iπ/3). On peut aussi le vérifier algébriquement : j² = -1/2 - i√3/2. — 4) Δ = 1 - 4 = -3, donc les solutions sont (-1 ± i√3)/2, c'est-à-dire exactement j et j². C'est cohérent avec la question 2 : 1 + j + j² = 0 signifie précisément que j est solution de z² + z + 1 = 0. — 5) Si n = 3k, alors j^n = (j³)^k = 1 et de même j^(2n) = 1, donc la somme vaut 3. Sinon, j^n vaut j ou j² selon le reste de n dans la division par 3, et la somme 1 + j^n + j^(2n) redonne dans les deux cas 1 + j + j², c'est-à-dire 0."}
]},

{t:"QCM express — 20 questions de cours", obj:["Vérifier ses réflexes en dix minutes","Repérer les définitions mal fixées","Réviser juste avant l'épreuve"], html:`
<div class="obj"><p>Mode d'emploi</p><ul>
<li>Réponds mentalement aux vingt questions ci-dessous, puis vérifie une par une.</li>
<li>Toute question ratée signale un chapitre à relire, pas une erreur d'inattention.</li>
</ul></div>
<h4>Chapitre Nombres</h4>
<ol>
<li>Combien de termes contient une somme dont l'indice va de n à p ?</li>
<li>Que vaut 0! ?</li>
<li>Que se passe-t-il quand on multiplie une inégalité par un nombre négatif ?</li>
<li>Que vaut « i parmi n » plus « i+1 parmi n » ?</li>
<li>Quelles sont les trois étapes d'une récurrence ?</li>
<li>Que vaut la somme de tous les coefficients binomiaux d'une même ligne ?</li>
<li>Quelle est la différence entre ∈ et ⊂ ?</li>
<li>Peut-on écrire [3, +∞] ?</li>
<li>Que vaut Σ (i = 0 à n) i ?</li>
<li>ℤ est-il un corps ?</li>
</ol>
<h4>Chapitre Nombres complexes</h4>
<ol start="11">
<li>Quelle est la partie imaginaire de 3 - 7i ?</li>
<li>Que vaut i⁴ ?</li>
<li>Comment met-on un quotient de complexes sous forme algébrique ?</li>
<li>Que vaut z multiplié par son conjugué ?</li>
<li>Combien un complexe non nul a-t-il de racines carrées ?</li>
<li>A-t-on le droit d'écrire √(-4) ?</li>
<li>Que vaut e<sup>iθ</sup> en fonction de cos et sin ?</li>
<li>Quelle est la formule d'Euler pour le sinus ?</li>
<li>Que devient l'argument d'un produit ?</li>
<li>Que représente géométriquement |z - a| ?</li>
</ol>`,
retenir:"Ces vingt réponses sont le minimum absolu à connaître sans réfléchir. Si l'une d'elles demande un calcul, c'est qu'elle n'est pas encore acquise.",
exos:[
{q:"Réponses 1 à 5",r:"1) p - n + 1 termes. Entre 0 et n il y en a donc n+1. — 2) 0! = 1, par convention, et c'est ce qui rend les formules cohérentes. — 3) Le sens de l'inégalité s'inverse. — 4) « i+1 parmi n+1 », c'est la formule de Pascal. — 5) Initialisation, hérédité, conclusion. Les trois doivent être rédigées."},
{q:"Réponses 6 à 10",r:"6) 2^n, en appliquant le binôme avec a = b = 1. — 7) ∈ relie un élément à un ensemble, ⊂ relie deux ensembles. — 8) Non : +∞ n'est pas un réel, le crochet doit être ouvert. — 9) n(n+1)/2. — 10) Non : 2 n'y a pas d'inverse. ℚ et ℝ sont des corps, pas ℤ."},
{q:"Réponses 11 à 15",r:"11) -7, et non -7i : la partie imaginaire est un réel. — 12) i⁴ = 1. Les puissances de i sont cycliques de période 4. — 13) On multiplie numérateur et dénominateur par le conjugué du dénominateur. — 14) |z|², un réel positif. — 15) Exactement deux, opposées l'une de l'autre."},
{q:"Réponses 16 à 20",r:"16) Non. Le symbole racine est interdit dans ℂ, sauf pour un réel positif, car aucune des deux racines n'est privilégiée. — 17) cos θ + i sin θ. — 18) sin θ = (e^(iθ) - e^(-iθ))/(2i), avec 2i au dénominateur. — 19) La somme des arguments, modulo 2π. — 20) La distance entre le point d'affixe z et le point d'affixe a."}
]}
];
const CALCULUS = {
  code:"EP1.3.1", nom:"Calculus et raisonnement", ects:4, h:"10h CM \u00b7 30h TD",
  resume:"Le socle math\u00e9matique du semestre. Les huit premiers chapitres suivent le polycopi\u00e9 du cours (chapitre Nombres, puis chapitre Nombres complexes), avec un cours simplifi\u00e9 et beaucoup d'exercices corrig\u00e9s ; les suivants couvrent la partie analyse annonc\u00e9e plus tard dans le semestre.",
  chapitres: [CALCULUS_BASE.chapitres[0]].concat(CH_NOMBRES, CH_COMPLEXES, CH_EXAMS, CALCULUS_BASE.chapitres.slice(1))
};
const AP2 = {code:"EP2.1.1", nom:"Algorithmique et programmation 2 : structures", ects:4, h:"6h CM · 10h TD · 14h TP",
resume:"La suite directe d'AP1 : au lieu de manipuler des tableaux, on construit ses propres structures de données et on choisit celle qui convient au problème. C'est le cours qui sépare ceux qui savent coder de ceux qui savent concevoir.",
chapitres:[
{t:"Types abstraits de données", obj:["Distinguer interface et implémentation","Spécifier un type abstrait","Comprendre pourquoi ce découpage compte"], html:`
<h4>L'idée centrale</h4>
<div class="def"><b>Type abstrait de données.</b> Description d'un ensemble de valeurs et des opérations qu'on peut leur appliquer, indépendamment de la façon dont elles sont représentées en mémoire.</div>
<p>On décrit d'abord <em>ce que</em> la structure sait faire, ensuite <em>comment</em> elle le fait. Une pile est définie par « empiler, dépiler, sommet, est-vide » ; qu'elle soit réalisée par un tableau ou par une liste chaînée ne regarde pas celui qui l'utilise.</p>
<h4>Pourquoi c'est utile</h4>
<ul>
<li>On peut changer l'implémentation sans toucher au code appelant.</li>
<li>On raisonne sur le problème plutôt que sur les détails.</li>
<li>On peut tester la structure isolément.</li>
</ul>
<h4>En C : le fichier d'en-tête</h4>
<pre><code>/* pile.h : l'interface, ce que l'utilisateur voit */
typedef struct Pile Pile;   /* type opaque */

Pile *pile_creer(void);
void  pile_detruire(Pile *p);
int   pile_est_vide(const Pile *p);
void  pile_empiler(Pile *p, int v);
int   pile_depiler(Pile *p);</code></pre>
<p>Le type est déclaré sans révéler ses champs : c'est un <strong>type opaque</strong>. L'utilisateur ne peut pas bricoler l'intérieur, donc il ne peut pas casser les invariants de la structure.</p>
<h4>Complexité comme critère</h4>
<p>Choisir une structure, c'est arbitrer entre des coûts. Un tableau donne un accès immédiat par indice mais une insertion coûteuse ; une liste chaînée fait l'inverse. Il n'y a pas de meilleure structure dans l'absolu, seulement une meilleure structure pour un profil d'usage donné.</p>`,
retenir:"Interface d'un côté, implémentation de l'autre. On choisit une structure en fonction des opérations qu'on fera le plus souvent, pas par habitude.",
exos:[{q:"Quel est l'intérêt d'un type opaque en C ?",r:"Il empêche l'utilisateur d'accéder directement aux champs, donc de rompre les invariants. On peut alors changer la représentation interne sans casser le code existant."},{q:"Cite deux implémentations possibles d'une pile.",r:"Un tableau avec un indice de sommet, ou une liste chaînée où l'on insère et retire en tête. Les deux offrent des opérations en temps constant."}]},

{t:"Listes chaînées", obj:["Construire une liste simplement chaînée","Insérer et supprimer un maillon","Comparer avec le tableau"], html:`
<h4>Structure</h4>
<pre><code>typedef struct Maillon {
    int valeur;
    struct Maillon *suivant;
} Maillon;

typedef struct { Maillon *tete; } Liste;</code></pre>
<p>Chaque maillon contient une valeur et l'adresse du suivant. Le dernier pointe vers NULL. Les maillons sont dispersés en mémoire, contrairement aux cases d'un tableau.</p>
<h4>Insertion en tête</h4>
<pre><code>void inserer_tete(Liste *l, int v) {
    Maillon *m = malloc(sizeof(Maillon));
    if (m == NULL) return;
    m-&gt;valeur = v;
    m-&gt;suivant = l-&gt;tete;
    l-&gt;tete = m;
}</code></pre>
<p>Opération en temps constant, quelle que soit la longueur de la liste. C'est l'avantage décisif sur le tableau, où insérer en tête impose de décaler tout le contenu.</p>
<h4>Parcours</h4>
<pre><code>for (Maillon *m = l-&gt;tete; m != NULL; m = m-&gt;suivant)
    printf("%d ", m-&gt;valeur);</code></pre>
<h4>Suppression</h4>
<p>Pour supprimer un maillon, il faut disposer de son <strong>prédécesseur</strong> afin de le relier au suivant, puis libérer la mémoire. L'ordre compte : on garde d'abord l'adresse du maillon à supprimer, on rebranche, on libère ensuite. Libérer avant de rebrancher fait perdre le reste de la liste.</p>
<h4>Comparaison</h4>
<table><tr><th>Opération</th><th>Tableau</th><th>Liste chaînée</th></tr>
<tr><td>Accès au i-ème</td><td>O(1)</td><td>O(n)</td></tr>
<tr><td>Insertion en tête</td><td>O(n)</td><td>O(1)</td></tr>
<tr><td>Insertion en fin</td><td>O(1) si place</td><td>O(n) ou O(1) avec pointeur de queue</td></tr>
<tr><td>Mémoire</td><td>contiguë, compacte</td><td>dispersée, surcoût par maillon</td></tr></table>
<h4>Variantes</h4>
<p>Liste doublement chaînée pour parcourir dans les deux sens, liste circulaire pour un tour sans fin, liste avec sentinelle pour supprimer les cas particuliers de la tête.</p>`,
retenir:"La liste chaînée gagne sur l'insertion et la suppression, le tableau gagne sur l'accès direct et la localité mémoire. Toujours vérifier le cas de la liste vide et du dernier maillon.",
exos:[{q:"Écris une fonction qui compte les maillons d'une liste.",r:"int longueur(const Liste *l) { int n = 0; for (Maillon *m = l->tete; m != NULL; m = m->suivant) n++; return n; } — complexité linéaire, contrairement au tableau où la taille est connue."},{q:"Pourquoi une liste chaînée est-elle souvent plus lente qu'un tableau en pratique, à complexité égale ?",r:"À cause du cache : les maillons sont dispersés, chaque saut provoque un défaut de cache, alors qu'un tableau profite de la localité spatiale."}]},

{t:"Piles et files", obj:["Distinguer LIFO et FIFO","Implémenter les deux structures","Reconnaître leurs usages"], html:`
<h4>Pile</h4>
<div class="def"><b>Pile (LIFO).</b> Dernier entré, premier sorti. Opérations : empiler, dépiler, consulter le sommet, tester la vacuité.</div>
<p>Usages : pile d'appels de fonctions, annulation d'une action, évaluation d'expressions, parcours en profondeur d'un graphe, vérification de parenthésage.</p>
<pre><code>/* verification de parenthesage */
int equilibre(const char *s) {
    Pile *p = pile_creer();
    for (int i = 0; s[i]; i++) {
        if (s[i] == '(') pile_empiler(p, s[i]);
        else if (s[i] == ')') {
            if (pile_est_vide(p)) { pile_detruire(p); return 0; }
            pile_depiler(p);
        }
    }
    int ok = pile_est_vide(p);
    pile_detruire(p);
    return ok;
}</code></pre>
<h4>File</h4>
<div class="def"><b>File (FIFO).</b> Premier entré, premier sorti. Opérations : enfiler en queue, défiler en tête.</div>
<p>Usages : file d'attente de tâches, tampon entre producteur et consommateur, parcours en largeur d'un graphe, ordonnancement des processus par le système.</p>
<h4>Implémentation par tableau circulaire</h4>
<p>Avec deux indices, tête et queue, qui reviennent à 0 quand ils atteignent la fin du tableau. On utilise le reste de la division par la taille. Il faut distinguer file vide et file pleine, soit en gardant une case libre, soit en stockant le nombre d'éléments.</p>
<h4>File de priorité</h4>
<p>Variante où l'on retire toujours l'élément le plus prioritaire, quelle que soit sa date d'arrivée. Implémentée efficacement par un tas, elle sert à l'ordonnancement et aux algorithmes de plus court chemin.</p>`,
retenir:"Pile = LIFO, parcours en profondeur, appels de fonctions. File = FIFO, parcours en largeur, ordonnancement. Les deux ont des opérations en temps constant.",
exos:[{q:"Quelle structure pour inverser l'ordre d'une séquence ?",r:"Une pile : on empile tous les éléments puis on les dépile, ce qui restitue l'ordre inverse."},{q:"Pourquoi un tableau circulaire pour une file plutôt qu'un décalage ?",r:"Parce que le décalage coûte O(n) à chaque retrait, alors que le tableau circulaire garde toutes les opérations en O(1)."}]},

{t:"Arbres binaires", obj:["Manipuler la structure d'arbre","Écrire les parcours","Comprendre l'arbre binaire de recherche"], html:`
<h4>Vocabulaire</h4>
<p>Racine, nœud, feuille, fils gauche et droit, hauteur, profondeur, sous-arbre. Un arbre binaire est soit vide, soit constitué d'une racine et de deux sous-arbres binaires — définition inductive, donc traitement récursif naturel.</p>
<pre><code>typedef struct Noeud {
    int valeur;
    struct Noeud *g, *d;
} Noeud;</code></pre>
<h4>Parcours</h4>
<ul>
<li><strong>Préfixe</strong> : racine, gauche, droite. Sert à copier ou sérialiser un arbre.</li>
<li><strong>Infixe</strong> : gauche, racine, droite. Sur un arbre de recherche, il donne les valeurs triées.</li>
<li><strong>Suffixe</strong> : gauche, droite, racine. Sert à libérer la mémoire ou à évaluer une expression.</li>
<li><strong>En largeur</strong> : niveau par niveau, avec une file.</li>
</ul>
<pre><code>void infixe(const Noeud *n) {
    if (n == NULL) return;
    infixe(n-&gt;g);
    printf("%d ", n-&gt;valeur);
    infixe(n-&gt;d);
}</code></pre>
<h4>Arbre binaire de recherche</h4>
<div class="def"><b>Invariant ABR.</b> Pour tout nœud, toutes les valeurs du sous-arbre gauche sont inférieures à la sienne, et toutes celles du sous-arbre droit lui sont supérieures.</div>
<p>Cet invariant rend la recherche dichotomique : on compare, on descend d'un côté, on recommence. Le coût est proportionnel à la <strong>hauteur</strong> de l'arbre.</p>
<h4>Le problème du déséquilibre</h4>
<p>Un ABR construit à partir de valeurs déjà triées dégénère en liste chaînée : la hauteur devient n et la recherche redevient linéaire. D'où les arbres équilibrés (AVL, rouge-noir), qui garantissent une hauteur logarithmique par des rotations lors des insertions. Ils sont au programme des années suivantes, mais il faut connaître le problème dès maintenant.</p>
<h4>Suppression</h4>
<p>Trois cas : feuille, un seul fils, deux fils. Dans le dernier cas, on remplace la valeur par le maximum du sous-arbre gauche (ou le minimum du droit), puis on supprime ce nœud-là, qui a au plus un fils.</p>`,
retenir:"Un arbre se définit récursivement, donc se traite récursivement. Parcours infixe d'un ABR = valeurs triées. Le coût dépend de la hauteur, qui peut dégénérer si l'arbre n'est pas équilibré.",
exos:[{q:"Quelle est la hauteur minimale d'un arbre binaire à n nœuds ?",r:"Environ log2(n) : c'est le cas d'un arbre complet, et c'est ce que les arbres équilibrés cherchent à garantir."},{q:"Quel parcours utiliser pour libérer la mémoire d'un arbre ?",r:"Le parcours suffixe : on libère les fils avant le père, sinon on perd les pointeurs vers les sous-arbres."}]},

{t:"Tables de hachage", obj:["Comprendre le principe du hachage","Gérer les collisions","Estimer le coût réel"], html:`
<h4>L'idée</h4>
<p>Transformer une clé en indice de tableau par une fonction de hachage, pour accéder directement à la case sans parcourir. Objectif : accès en temps constant en moyenne, alors qu'un arbre demande un temps logarithmique.</p>
<h4>Fonction de hachage</h4>
<p>Une bonne fonction répartit les clés de façon uniforme, se calcule vite, et donne toujours le même résultat pour la même clé. Pour une chaîne, une méthode classique combine les caractères en multipliant par une constante première à chaque étape, puis prend le reste de la division par la taille de la table.</p>
<h4>Collisions</h4>
<div class="def"><b>Collision.</b> Deux clés différentes qui donnent le même indice. C'est inévitable : l'ensemble des clés possibles est bien plus grand que la table.</div>
<p>Le paradoxe des anniversaires, vu en probabilités, montre que les collisions apparaissent bien plus tôt qu'on ne l'imagine.</p>
<h4>Deux stratégies</h4>
<ul>
<li><strong>Chaînage</strong> : chaque case contient une liste des éléments qui y tombent. Simple, robuste, coût moyen proportionnel au facteur de remplissage.</li>
<li><strong>Adressage ouvert</strong> : on cherche la case libre suivante selon une règle (sondage linéaire, quadratique, double hachage). Plus compact en mémoire, mais la suppression devient délicate.</li>
</ul>
<h4>Facteur de remplissage</h4>
<p>Le rapport entre le nombre d'éléments et la taille de la table. Au-delà d'environ 0,7 pour l'adressage ouvert, les performances s'effondrent. On redimensionne alors la table et on réinsère tout : opération coûteuse mais rare, donc amortie.</p>
<h4>Comparatif</h4>
<table><tr><th>Structure</th><th>Recherche</th><th>Ordre conservé</th></tr>
<tr><td>Tableau trié</td><td>O(log n)</td><td>oui</td></tr>
<tr><td>ABR équilibré</td><td>O(log n)</td><td>oui</td></tr>
<tr><td>Table de hachage</td><td>O(1) en moyenne</td><td>non</td></tr></table>
<p>La table de hachage est plus rapide mais ne permet ni parcours ordonné ni recherche d'intervalle. C'est exactement l'arbitrage que fait un système de bases de données en choisissant son type d'index.</p>`,
retenir:"Hachage = accès direct en moyenne constante, au prix de l'ordre. Les collisions sont inévitables et se gèrent par chaînage ou adressage ouvert. Surveille le facteur de remplissage.",
exos:[{q:"Pourquoi une table de hachage ne permet-elle pas de trouver le plus petit élément rapidement ?",r:"Parce que la fonction de hachage détruit l'ordre : des clés proches peuvent tomber dans des cases éloignées. Il faudrait parcourir toute la table."},{q:"Que se passe-t-il si la fonction de hachage renvoie toujours 0 ?",r:"Tous les éléments entrent en collision : la structure dégénère en une seule liste chaînée, donc recherche linéaire."}]},

{t:"Algorithmes de tri efficaces", obj:["Comprendre diviser pour régner","Analyser tri fusion et tri rapide","Connaître la borne inférieure"], html:`
<h4>Diviser pour régner</h4>
<p>Trois temps : découper le problème en sous-problèmes plus petits, les résoudre récursivement, combiner les solutions. C'est un schéma général, pas seulement une technique de tri.</p>
<h4>Tri fusion</h4>
<p>On coupe le tableau en deux moitiés, on trie chacune récursivement, puis on fusionne les deux moitiés triées en un seul parcours. La fusion coûte n opérations, la profondeur de récursion est log n, d'où une complexité en n log n <strong>garantie</strong>, quel que soit le tableau.</p>
<p>Inconvénient : il faut un tableau auxiliaire, donc de la mémoire supplémentaire. Avantage : il est stable, c'est-à-dire qu'il préserve l'ordre relatif des éléments égaux.</p>
<h4>Tri rapide</h4>
<p>On choisit un pivot, on partitionne le tableau en éléments plus petits et plus grands, puis on trie récursivement chaque partie. La complexité moyenne est n log n, mais le pire cas est quadratique lorsque le pivot est systématiquement mal choisi — typiquement sur un tableau déjà trié avec un pivot pris en première position.</p>
<p>On corrige en prenant le pivot au hasard ou en médiane de trois valeurs. En pratique le tri rapide est plus rapide que le tri fusion car il trie sur place, avec une meilleure localité mémoire.</p>
<h4>Borne inférieure</h4>
<div class="def"><b>Théorème.</b> Tout algorithme de tri fondé uniquement sur des comparaisons effectue au moins de l'ordre de n log n comparaisons dans le pire cas.</div>
<p>L'argument est combinatoire : il y a n factorielle ordres possibles, et chaque comparaison ne divise l'espace des possibilités que par deux au mieux. Le tri fusion atteint donc l'optimum.</p>
<h4>Sortir de la borne</h4>
<p>Les tris qui n'utilisent pas de comparaisons, comme le tri par comptage ou le tri par base, peuvent être linéaires — mais seulement sous des hypothèses fortes sur les données, par exemple des entiers dans un intervalle borné.</p>`,
retenir:"Tri fusion : n log n garanti, stable, mémoire supplémentaire. Tri rapide : n log n en moyenne, sur place, très rapide en pratique, quadratique au pire. On ne peut pas descendre sous n log n par comparaisons.",
exos:[{q:"Pourquoi le tri rapide est-il quadratique sur un tableau déjà trié avec un pivot en première position ?",r:"Parce que la partition produit un sous-tableau vide et un sous-tableau de taille n-1 : la profondeur devient n au lieu de log n."},{q:"Quel tri choisir pour trier un très grand fichier qui ne tient pas en mémoire ?",r:"Un tri fusion externe : on trie des morceaux en mémoire, on les écrit, puis on fusionne les fichiers triés par lectures séquentielles."}]},

{t:"Graphes : premières notions", obj:["Représenter un graphe","Parcourir en largeur et en profondeur","Reconnaître les problèmes classiques"], html:`
<h4>Définitions</h4>
<p>Un graphe est un ensemble de sommets reliés par des arêtes. Il peut être orienté ou non, pondéré ou non. Réseaux, dépendances entre modules, plans de métro, liens hypertexte : la modélisation par graphe est partout.</p>
<h4>Deux représentations</h4>
<table><tr><th></th><th>Matrice d'adjacence</th><th>Listes d'adjacence</th></tr>
<tr><td>Mémoire</td><td>n² cases</td><td>proportionnelle au nombre d'arêtes</td></tr>
<tr><td>Test d'existence d'une arête</td><td>O(1)</td><td>O(degré)</td></tr>
<tr><td>Parcours des voisins</td><td>O(n)</td><td>O(degré)</td></tr></table>
<p>Les listes d'adjacence conviennent aux graphes creux, c'est-à-dire à la grande majorité des graphes réels.</p>
<h4>Parcours en largeur</h4>
<p>Avec une file : on visite tous les voisins du sommet courant avant d'aller plus loin. Il donne le plus court chemin en nombre d'arêtes dans un graphe non pondéré.</p>
<h4>Parcours en profondeur</h4>
<p>Avec une pile, ou par récursivité : on s'enfonce le plus loin possible avant de revenir en arrière. Il sert à détecter les cycles, à trouver les composantes connexes et à faire un tri topologique.</p>
<p>Les deux parcours ont la même structure ; seule la structure de données auxiliaire change. C'est une belle illustration du chapitre sur les piles et les files.</p>
<h4>Problèmes classiques</h4>
<ul>
<li>Plus court chemin pondéré : algorithme de Dijkstra, avec une file de priorité.</li>
<li>Arbre couvrant de poids minimal : Kruskal, Prim.</li>
<li>Tri topologique : ordonner des tâches avec dépendances.</li>
</ul>
<p>Ces algorithmes sont détaillés en L2, mais leur idée repose entièrement sur les structures vues ici.</p>`,
retenir:"Largeur avec une file, profondeur avec une pile : même squelette, structure auxiliaire différente. Listes d'adjacence pour les graphes creux, matrice pour les graphes denses.",
exos:[{q:"Quel parcours donne le plus court chemin en nombre d'arêtes ?",r:"Le parcours en largeur, car il explore les sommets par distance croissante à l'origine."},{q:"Comment détecter un cycle dans un graphe orienté ?",r:"Par un parcours en profondeur : si l'on rencontre un sommet encore en cours de traitement, c'est qu'il existe un arc arrière, donc un cycle."}]}
]};

const WEB = {code:"EP2.1.2", nom:"Programmation web client/serveur", ects:4, h:"16h TD · 14h TP",
resume:"Le fonctionnement du web : HTTP, HTML, CSS, JavaScript côté client, et le principe du traitement côté serveur. Beaucoup de TP, un projet, et des bases qui resservent en L2 et L3 en programmation web client puis serveur.",
chapitres:[
{t:"Architecture client-serveur et HTTP", obj:["Décrire un échange HTTP","Lire un code de statut","Distinguer GET et POST"], html:`
<h4>Le modèle</h4>
<p>Le client (navigateur) envoie une requête, le serveur renvoie une réponse. Le serveur n'initie jamais l'échange dans le modèle de base. Une page moderne déclenche des dizaines de requêtes : document, feuilles de style, scripts, images, appels de données.</p>
<h4>Anatomie d'une requête</h4>
<pre><code>GET /cours/index.html HTTP/1.1
Host: www.info.univ-tours.fr
Accept: text/html
User-Agent: Mozilla/5.0</code></pre>
<p>Une méthode, un chemin, une version, puis des en-têtes, puis éventuellement un corps.</p>
<h4>Méthodes principales</h4>
<table><tr><th>Méthode</th><th>Usage</th><th>Corps</th></tr>
<tr><td>GET</td><td>récupérer une ressource</td><td>non</td></tr>
<tr><td>POST</td><td>envoyer des données</td><td>oui</td></tr>
<tr><td>PUT</td><td>remplacer une ressource</td><td>oui</td></tr>
<tr><td>DELETE</td><td>supprimer</td><td>non</td></tr></table>
<p>GET place les paramètres dans l'adresse, donc visibles et enregistrés dans l'historique : jamais de mot de passe en GET. GET doit rester sans effet de bord ; une action qui modifie l'état passe par POST.</p>
<h4>Codes de statut</h4>
<ul>
<li>2xx : succès (200 OK, 201 créé)</li>
<li>3xx : redirection (301 permanente, 302 temporaire)</li>
<li>4xx : erreur du client (400 requête invalide, 401 non authentifié, 403 interdit, 404 introuvable)</li>
<li>5xx : erreur du serveur (500 erreur interne, 503 indisponible)</li>
</ul>
<h4>Sans état</h4>
<p>HTTP ne mémorise rien d'une requête à l'autre. Pour maintenir une session, on utilise des cookies ou des jetons : le serveur envoie un identifiant, le client le renvoie à chaque requête. C'est aussi la source de nombreuses failles de sécurité.</p>
<h4>HTTPS</h4>
<p>HTTP au-dessus de TLS : chiffrement du contenu et authentification du serveur par certificat. Aujourd'hui obligatoire de fait, y compris pour un site sans données sensibles.</p>`,
retenir:"Requête, réponse, statut. GET pour lire sans effet de bord, POST pour modifier. HTTP est sans état : les sessions sont reconstruites par cookies ou jetons.",
exos:[{q:"Pourquoi ne faut-il pas envoyer un formulaire de connexion en GET ?",r:"Parce que les paramètres apparaissent dans l'adresse, l'historique du navigateur et les journaux du serveur. Il faut POST, et HTTPS."},{q:"Que signifie un code 403 par rapport à un 401 ?",r:"401 : tu n'es pas authentifié, il faut te connecter. 403 : tu es identifié mais tu n'as pas le droit d'accéder à la ressource."}]},

{t:"HTML : structurer le contenu", obj:["Écrire un document valide","Utiliser les balises sémantiques","Construire un formulaire accessible"], html:`
<h4>Squelette</h4>
<pre><code>&lt;!DOCTYPE html&gt;
&lt;html lang="fr"&gt;
&lt;head&gt;
  &lt;meta charset="utf-8"&gt;
  &lt;meta name="viewport" content="width=device-width, initial-scale=1"&gt;
  &lt;title&gt;Mon projet&lt;/title&gt;
  &lt;link rel="stylesheet" href="style.css"&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Titre principal&lt;/h1&gt;
  &lt;script src="script.js"&gt;&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;</code></pre>
<h4>Sémantique avant présentation</h4>
<p>HTML décrit la <em>nature</em> du contenu, pas son apparence. On utilise <code>header</code>, <code>nav</code>, <code>main</code>, <code>section</code>, <code>article</code>, <code>footer</code> plutôt que des divisions génériques. Les titres se hiérarchisent sans sauter de niveau : un seul titre de niveau 1 par page.</p>
<p>Cela profite à l'accessibilité (lecteurs d'écran), au référencement, et à la maintenance du code.</p>
<h4>Formulaires</h4>
<pre><code>&lt;form action="/inscription" method="post"&gt;
  &lt;label for="mail"&gt;Adresse mail&lt;/label&gt;
  &lt;input type="email" id="mail" name="mail" required&gt;

  &lt;label for="mdp"&gt;Mot de passe&lt;/label&gt;
  &lt;input type="password" id="mdp" name="mdp" minlength="8" required&gt;

  &lt;button type="submit"&gt;Créer le compte&lt;/button&gt;
&lt;/form&gt;</code></pre>
<p>Chaque champ a un <code>label</code> associé par l'attribut <code>for</code>, et un <code>name</code> qui sera la clé envoyée au serveur. Les types spécialisés déclenchent le bon clavier sur mobile et une validation de base.</p>
<div class="piege"><b>Validation côté client uniquement.</b> Les contrôles du navigateur améliorent l'expérience mais ne protègent de rien : n'importe qui peut envoyer une requête directement. Toute donnée doit être revalidée côté serveur.</div>
<h4>Images et accessibilité</h4>
<p>L'attribut de texte alternatif décrit l'image pour ceux qui ne la voient pas. Il est vide seulement si l'image est purement décorative.</p>`,
retenir:"HTML dit ce qu'est le contenu, CSS dit à quoi il ressemble. Balises sémantiques, labels sur les champs, texte alternatif sur les images. La validation client ne remplace jamais la validation serveur.",
exos:[{q:"Quelle est la différence entre id et name sur un champ de formulaire ?",r:"id identifie l'élément dans la page, pour le CSS, le JavaScript et l'attribut for du label. name est la clé sous laquelle la valeur est envoyée au serveur."},{q:"Pourquoi ne pas sauter du titre de niveau 1 au niveau 3 ?",r:"Cela casse la structure logique du document, ce qui gêne la navigation par lecteur d'écran et l'analyse automatique de la page."}]},

{t:"CSS : mettre en forme", obj:["Écrire des sélecteurs efficaces","Comprendre le modèle de boîte","Construire une mise en page adaptative"], html:`
<h4>Sélecteurs</h4>
<pre><code>h1            { color: navy; }
.carte        { border: 1px solid #ccc; }
#menu         { position: sticky; top: 0; }
nav a:hover   { text-decoration: underline; }
.carte &gt; p    { margin: 0; }</code></pre>
<p>En cas de conflit, la <strong>spécificité</strong> tranche : un identifiant l'emporte sur une classe, qui l'emporte sur une balise. À spécificité égale, la dernière règle écrite gagne. Multiplier les déclarations importantes est le symptôme d'une feuille de style mal structurée.</p>
<h4>Modèle de boîte</h4>
<p>Chaque élément est une boîte composée du contenu, du remplissage intérieur, de la bordure et de la marge extérieure. Par défaut, la largeur déclarée ne concerne que le contenu ; l'ajout d'un remplissage élargit donc la boîte, ce qui surprend systématiquement. La déclaration qui inclut bordure et remplissage dans la largeur règle le problème une fois pour toutes.</p>
<h4>Mise en page moderne</h4>
<ul>
<li><strong>Flexbox</strong> : disposition sur un axe, idéale pour une barre de navigation ou une rangée de cartes.</li>
<li><strong>Grid</strong> : disposition en deux dimensions, pour la structure générale d'une page.</li>
</ul>
<pre><code>.grille {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
}</code></pre>
<p>Cette seule règle produit une grille qui s'adapte à la largeur disponible, sans requête de média.</p>
<h4>Adaptatif</h4>
<p>Conception d'abord pour le mobile, puis ajout de règles pour les écrans larges. Les unités relatives et les requêtes de média permettent d'adapter la présentation à la taille réelle de l'écran.</p>
<h4>Variables</h4>
<pre><code>:root { --accent: #1B44C8; }
a { color: var(--accent); }</code></pre>
<p>Elles centralisent les couleurs et les espacements, ce qui rend une refonte visuelle triviale.</p>`,
retenir:"Spécificité et ordre décident du conflit. Le modèle de boîte explique les débordements. Flexbox sur un axe, Grid en deux dimensions, et conception mobile d'abord.",
exos:[{q:"Pourquoi un élément de largeur 100% avec du padding déborde-t-il de son parent ?",r:"Parce que la largeur par défaut ne compte que le contenu : le remplissage s'ajoute. La solution est de passer le dimensionnement en border-box."},{q:"Entre une règle sur .menu a et une règle sur a, laquelle gagne ?",r:"La première : sa spécificité est plus élevée car elle combine une classe et une balise."}]},

{t:"JavaScript et manipulation du DOM", obj:["Écrire du JavaScript de base","Modifier la page dynamiquement","Réagir aux événements"], html:`
<h4>Le langage</h4>
<pre><code>let compteur = 0;          // variable modifiable
const TAUX = 0.2;          // constante
const carre = (x) =&gt; x * x;

const notes = [12, 15, 9];
const moyenne = notes.reduce((a, b) =&gt; a + b, 0) / notes.length;

const etudiant = { nom: "Lemaire", annee: 1 };
console.log(etudiant.nom);</code></pre>
<p>Le typage est dynamique. Utilise <code>let</code> et <code>const</code>, jamais <code>var</code>, et compare avec <code>===</code> qui n'effectue pas de conversion implicite.</p>
<h4>Le DOM</h4>
<div class="def"><b>DOM.</b> Représentation de la page sous forme d'arbre d'objets, que le script peut lire et modifier. Les modifications sont immédiatement visibles.</div>
<pre><code>const titre = document.querySelector("h1");
titre.textContent = "Nouveau titre";
titre.classList.add("surligne");

const item = document.createElement("li");
item.textContent = "Element ajoute";
document.querySelector("ul").appendChild(item);</code></pre>
<p>C'est ici que le chapitre sur les arbres du cours de structures prend un sens concret : le DOM est un arbre, et on le parcourt comme tel.</p>
<h4>Événements</h4>
<pre><code>document.querySelector("#valider")
  .addEventListener("click", (e) =&gt; {
    e.preventDefault();
    console.log("clic traite");
  });</code></pre>
<p>Le modèle est asynchrone : le navigateur exécute le code de la page, puis attend des événements et déclenche les fonctions associées.</p>
<h4>Appels au serveur</h4>
<pre><code>async function chargerNotes() {
  const reponse = await fetch("/api/notes");
  if (!reponse.ok) throw new Error("statut " + reponse.status);
  const donnees = await reponse.json();
  afficher(donnees);
}</code></pre>
<p>Cela permet de mettre à jour une partie de la page sans la recharger. Le format d'échange usuel est JSON, dont la syntaxe reprend celle des objets JavaScript.</p>
<div class="piege"><b>Injection.</b> Insérer une chaîne venue de l'utilisateur avec innerHTML permet d'exécuter du code arbitraire dans la page. Utilise textContent, ou échappe systématiquement.</div>`,
retenir:"const et let, comparaison stricte, DOM = arbre modifiable, événements pour réagir, fetch pour dialoguer avec le serveur. Ne jamais injecter du contenu utilisateur en HTML brut.",
exos:[{q:"Quelle différence entre == et === ?",r:"== convertit les types avant de comparer, donc 0 == \"0\" est vrai. === compare valeur et type, ce qui évite des bugs subtils."},{q:"Pourquoi appeler preventDefault sur la soumission d'un formulaire ?",r:"Pour empêcher le rechargement de la page par défaut et traiter la soumission en JavaScript."}]},

{t:"Côté serveur et sécurité", obj:["Comprendre le rôle du serveur","Distinguer rendu serveur et rendu client","Connaître les failles de base"], html:`
<h4>Ce que fait le serveur</h4>
<p>Il reçoit une requête, l'analyse, éventuellement interroge une base de données, construit une réponse et l'envoie. Le langage varie (PHP, Node, Python, Java) mais le schéma est constant.</p>
<h4>Deux façons de produire une page</h4>
<ul>
<li><strong>Rendu serveur</strong> : le HTML est assemblé côté serveur et envoyé complet. Simple, bon pour le référencement.</li>
<li><strong>Rendu client</strong> : le serveur envoie des données, le navigateur construit l'affichage. Plus réactif, plus complexe.</li>
</ul>
<h4>Sessions</h4>
<p>Après authentification, le serveur crée une session et envoie un identifiant dans un cookie. Ce cookie doit être marqué comme sécurisé et inaccessible au JavaScript, sinon un script injecté peut le voler.</p>
<h4>Les failles à connaître dès la L1</h4>
<table><tr><th>Faille</th><th>Principe</th><th>Parade</th></tr>
<tr><td>Injection SQL</td><td>l'entrée utilisateur modifie la requête</td><td>requêtes préparées</td></tr>
<tr><td>XSS</td><td>du script injecté s'exécute chez d'autres visiteurs</td><td>échappement en sortie</td></tr>
<tr><td>CSRF</td><td>une action est déclenchée depuis un autre site</td><td>jeton anti-rejeu</td></tr></table>
<h4>Mots de passe</h4>
<p>On ne stocke jamais un mot de passe en clair, ni même un simple condensat. On utilise une fonction conçue pour être lente, avec un sel unique par utilisateur. Le parcours SLS approfondira ces questions, mais la règle s'applique dès ton premier projet.</p>
<h4>Le principe général</h4>
<p>Ne fais jamais confiance aux données qui viennent du client. Elles peuvent avoir été fabriquées à la main. Valide au serveur, échappe à l'affichage, et donne le minimum de droits nécessaires.</p>`,
retenir:"Le serveur décide, le client propose. Toute donnée reçue est suspecte : valider en entrée, échapper en sortie, requêtes préparées pour la base.",
exos:[{q:"Pourquoi une requête préparée empêche-t-elle l'injection SQL ?",r:"Parce que la structure de la requête est fixée avant que les valeurs ne soient fournies : les données ne peuvent plus être interprétées comme du code SQL."},{q:"Quelle est la différence entre XSS et CSRF ?",r:"XSS exécute du code malveillant dans le navigateur de la victime. CSRF fait exécuter une action légitime à l'insu de la victime déjà authentifiée."}]}
]};

const BD = {code:"EP2.2.1", nom:"Introduction aux bases de données", ects:4, h:"10h CM · 6h TD · 14h TP",
resume:"Modèle relationnel, conception, algèbre relationnelle et SQL. C'est le module qui te suit jusqu'en L3 (interrogation puis conception de bases) et l'une des compétences les plus recherchées en stage.",
chapitres:[
{t:"Pourquoi une base de données", obj:["Identifier les limites des fichiers","Nommer les propriétés attendues d'un SGBD","Situer le modèle relationnel"], html:`
<h4>Les limites du fichier</h4>
<p>Stocker des données dans des fichiers texte, comme en AP1, pose vite problème : redondance, incohérences entre copies, absence de contrôle d'accès concurrent, recherche lente, aucune garantie en cas de panne.</p>
<h4>Ce qu'apporte un SGBD</h4>
<ul>
<li>Un langage de requêtes déclaratif : on décrit le résultat voulu, pas la façon de l'obtenir.</li>
<li>Des contraintes d'intégrité vérifiées automatiquement.</li>
<li>La gestion des accès concurrents.</li>
<li>La résistance aux pannes.</li>
<li>Une indépendance entre la structure logique et le stockage physique.</li>
</ul>
<h4>Propriétés ACID</h4>
<div class="def"><b>Transaction.</b> Suite d'opérations traitée comme un tout indivisible. <b>Atomicité</b> : tout ou rien. <b>Cohérence</b> : les contraintes restent vérifiées. <b>Isolation</b> : les transactions concurrentes ne se perturbent pas. <b>Durabilité</b> : une fois validée, la modification survit à une panne.</div>
<p>Un virement bancaire illustre l'atomicité : débiter sans créditer serait catastrophique. Les deux opérations forment une transaction unique.</p>
<h4>Le modèle relationnel</h4>
<p>Proposé par Codd en 1970, il représente les données par des tables. Sa force est d'avoir un fondement mathématique — les relations du cours de Logique — qui permet d'optimiser automatiquement les requêtes.</p>
<h4>Les alternatives</h4>
<p>Les bases dites NoSQL relâchent certaines garanties pour gagner en volume ou en souplesse. Elles ne remplacent pas le relationnel : elles répondent à d'autres besoins.</p>`,
retenir:"Un SGBD apporte un langage déclaratif, des contraintes, la concurrence et la résistance aux pannes. ACID est le contrat de la transaction.",
exos:[{q:"Quelle propriété ACID garantit qu'un virement ne peut pas s'arrêter au milieu ?",r:"L'atomicité : soit toutes les opérations de la transaction sont appliquées, soit aucune."},{q:"Que signifie « langage déclaratif » pour SQL ?",r:"On décrit le résultat souhaité sans indiquer l'algorithme. C'est l'optimiseur du SGBD qui choisit le plan d'exécution."}]},

{t:"Modèle entité-association", obj:["Lire et produire un schéma conceptuel","Choisir les cardinalités","Traduire vers le relationnel"], html:`
<h4>Les trois briques</h4>
<ul>
<li><strong>Entité</strong> : un objet du domaine, par exemple Étudiant, Cours, Salle.</li>
<li><strong>Attribut</strong> : une propriété de l'entité, par exemple le numéro ou le nom.</li>
<li><strong>Association</strong> : un lien entre entités, par exemple « est inscrit à ».</li>
</ul>
<h4>Cardinalités</h4>
<p>Elles expriment combien d'occurrences d'une entité participent à l'association : un à un, un à plusieurs, plusieurs à plusieurs. Elles se déterminent en posant deux questions, une dans chaque sens : « un étudiant suit combien de cours ? » et « un cours est suivi par combien d'étudiants ? ».</p>
<h4>Traduction vers les tables</h4>
<table><tr><th>Cardinalité</th><th>Traduction</th></tr>
<tr><td>un à plusieurs</td><td>clé étrangère du côté « plusieurs »</td></tr>
<tr><td>plusieurs à plusieurs</td><td>table d'association dédiée</td></tr>
<tr><td>un à un</td><td>fusion des tables, ou clé étrangère avec unicité</td></tr></table>
<p>Une association plusieurs à plusieurs ne peut jamais se traduire par une simple clé étrangère : c'est l'erreur la plus fréquente en examen. Elle donne une table intermédiaire dont la clé primaire est le couple des deux clés étrangères, et qui peut porter ses propres attributs, comme une note ou une date d'inscription.</p>
<h4>Méthode de conception</h4>
<ol>
<li>Repérer les noms importants de l'énoncé : ce sont des entités candidates.</li>
<li>Repérer les verbes qui les relient : ce sont des associations.</li>
<li>Attribuer chaque propriété à l'entité ou à l'association qui la porte réellement.</li>
<li>Déterminer les cardinalités en interrogeant les deux sens.</li>
<li>Traduire, puis vérifier qu'aucune information n'est perdue.</li>
</ol>`,
retenir:"Entités, associations, cardinalités. Un à plusieurs donne une clé étrangère, plusieurs à plusieurs donne une table d'association. Un attribut se place là où il dépend réellement.",
exos:[{q:"Comment modéliser « un étudiant suit plusieurs cours, un cours a plusieurs étudiants, avec une note » ?",r:"Une table Inscription avec clé primaire composée du numéro d'étudiant et du code du cours, plus un attribut note. La note dépend du couple, pas de l'un des deux seulement."},{q:"Où placer l'attribut « nom du département » si un département a plusieurs enseignants ?",r:"Dans la table Département. Le mettre dans Enseignant dupliquerait l'information et ouvrirait la porte aux incohérences."}]},

{t:"Modèle relationnel et contraintes", obj:["Définir clé primaire et clé étrangère","Comprendre l'intégrité référentielle","Créer des tables en SQL"], html:`
<h4>Vocabulaire</h4>
<p>Une relation est une table, un tuple une ligne, un attribut une colonne, un domaine l'ensemble des valeurs possibles d'une colonne. L'ordre des lignes n'a aucune signification.</p>
<h4>Clés</h4>
<div class="def"><b>Clé primaire.</b> Attribut ou groupe d'attributs qui identifie de façon unique chaque ligne. Elle ne peut être ni nulle ni dupliquée. <b>Clé étrangère.</b> Attribut qui référence la clé primaire d'une autre table.</div>
<h4>Intégrité référentielle</h4>
<p>Le SGBD refuse d'insérer une ligne dont la clé étrangère ne correspond à aucune ligne existante. Il refuse aussi de supprimer une ligne référencée, sauf comportement explicitement demandé : suppression en cascade, ou mise à nul.</p>
<h4>Valeur nulle</h4>
<p>NULL signifie « valeur inconnue ou inapplicable ». Ce n'est ni zéro ni la chaîne vide. Toute comparaison avec NULL donne un résultat inconnu, d'où l'obligation d'utiliser une syntaxe dédiée pour le tester. Cette logique à trois valeurs est un piège permanent.</p>
<h4>Création de tables</h4>
<pre><code>CREATE TABLE Etudiant (
    num_etu   INTEGER PRIMARY KEY,
    nom       VARCHAR(50) NOT NULL,
    prenom    VARCHAR(50) NOT NULL,
    annee     INTEGER CHECK (annee BETWEEN 1 AND 3)
);

CREATE TABLE Inscription (
    num_etu   INTEGER REFERENCES Etudiant(num_etu),
    code_ue   VARCHAR(10) REFERENCES UE(code_ue),
    note      DECIMAL(4,2) CHECK (note BETWEEN 0 AND 20),
    PRIMARY KEY (num_etu, code_ue)
);</code></pre>
<p>Les contraintes déclarées ici sont vérifiées par le SGBD à chaque insertion : c'est bien plus fiable que des vérifications dispersées dans le code applicatif.</p>`,
retenir:"Clé primaire = identité, clé étrangère = référence. Les contraintes se déclarent dans le schéma, pas dans l'application. NULL n'est pas une valeur mais une absence.",
exos:[{q:"Pourquoi tester une colonne avec = NULL ne fonctionne-t-il pas ?",r:"Parce que toute comparaison avec NULL renvoie un résultat inconnu, jamais vrai. Il faut la syntaxe IS NULL."},{q:"Quelle est la clé primaire naturelle d'une table d'inscriptions ?",r:"Le couple formé par l'identifiant de l'étudiant et celui du cours, puisque c'est ce couple qui identifie une inscription."}]},

{t:"Algèbre relationnelle", obj:["Utiliser les opérateurs de base","Composer une expression algébrique","Faire le lien avec SQL"], html:`
<h4>Les opérateurs</h4>
<table><tr><th>Opérateur</th><th>Effet</th><th>Équivalent SQL</th></tr>
<tr><td>Sélection</td><td>garde les lignes vérifiant un prédicat</td><td>WHERE</td></tr>
<tr><td>Projection</td><td>garde certaines colonnes</td><td>SELECT</td></tr>
<tr><td>Renommage</td><td>change le nom d'un attribut</td><td>AS</td></tr>
<tr><td>Union, intersection, différence</td><td>opérations ensemblistes</td><td>UNION, INTERSECT, EXCEPT</td></tr>
<tr><td>Produit cartésien</td><td>toutes les combinaisons</td><td>FROM a, b</td></tr>
<tr><td>Jointure</td><td>produit filtré par une condition</td><td>JOIN ... ON</td></tr></table>
<h4>Fermeture</h4>
<p>Chaque opérateur prend des relations et produit une relation. On peut donc composer indéfiniment, comme on compose des fonctions. C'est cette propriété qui permet d'imbriquer les requêtes SQL.</p>
<h4>Pourquoi l'apprendre</h4>
<p>L'algèbre relationnelle est le langage interne du SGBD. Une requête SQL est traduite en expression algébrique, puis réécrite par l'optimiseur en une expression équivalente moins coûteuse — typiquement en poussant les sélections avant les jointures pour réduire le volume traité.</p>
<h4>Exemple</h4>
<p>« Nom des étudiants inscrits en base de données » s'écrit comme la projection sur le nom, d'une sélection sur le code de l'UE, appliquée à la jointure entre Étudiant et Inscription.</p>
<pre><code>SELECT e.nom
FROM Etudiant e
JOIN Inscription i ON e.num_etu = i.num_etu
WHERE i.code_ue = 'EP2.2.1';</code></pre>
<p>Les opérations ensemblistes exigent des schémas compatibles : même nombre de colonnes, mêmes domaines, dans le même ordre.</p>`,
retenir:"Sélection filtre les lignes, projection filtre les colonnes, jointure recolle les tables. Toute requête SQL se ramène à une composition de ces opérateurs.",
exos:[{q:"Quelle est la différence entre sélection et projection ?",r:"La sélection agit horizontalement sur les lignes, la projection verticalement sur les colonnes. En SQL, WHERE et SELECT respectivement."},{q:"Pourquoi l'optimiseur pousse-t-il les sélections avant les jointures ?",r:"Parce que joindre des tables réduites coûte beaucoup moins cher que joindre les tables complètes puis filtrer le résultat."}]},

{t:"SQL : interroger", obj:["Écrire une requête complète","Maîtriser les jointures","Utiliser agrégats et regroupements"], html:`
<h4>Structure d'une requête</h4>
<pre><code>SELECT   colonnes
FROM     tables
WHERE    condition sur les lignes
GROUP BY colonnes de regroupement
HAVING   condition sur les groupes
ORDER BY tri
LIMIT    nombre;</code></pre>
<p>Ordre d'écriture ci-dessus, mais ordre d'<strong>évaluation</strong> différent : FROM, puis WHERE, puis GROUP BY, puis HAVING, puis SELECT, puis ORDER BY. Comprendre cet ordre explique la plupart des erreurs de débutant.</p>
<h4>Jointures</h4>
<pre><code>-- interne : uniquement les correspondances
SELECT e.nom, i.note
FROM Etudiant e
JOIN Inscription i ON e.num_etu = i.num_etu;

-- externe gauche : tous les etudiants, meme sans inscription
SELECT e.nom, i.note
FROM Etudiant e
LEFT JOIN Inscription i ON e.num_etu = i.num_etu;</code></pre>
<p>La jointure externe gauche est la bonne réponse à « lister tous les X, avec leurs Y éventuels ». Les colonnes manquantes valent NULL.</p>
<h4>Agrégats</h4>
<pre><code>SELECT   code_ue,
         COUNT(*)    AS nb_inscrits,
         AVG(note)   AS moyenne,
         MAX(note)   AS meilleure
FROM     Inscription
GROUP BY code_ue
HAVING   COUNT(*) &gt;= 5
ORDER BY moyenne DESC;</code></pre>
<p>WHERE filtre avant le regroupement, HAVING après. Toute colonne du SELECT qui n'est pas dans un agrégat doit figurer dans le GROUP BY.</p>
<div class="piege"><b>COUNT et NULL.</b> COUNT(*) compte les lignes, COUNT(colonne) ne compte que les valeurs non nulles. AVG ignore aussi les NULL, ce qui change le dénominateur.</div>
<h4>Sous-requêtes</h4>
<pre><code>SELECT nom FROM Etudiant
WHERE num_etu IN (
    SELECT num_etu FROM Inscription WHERE note &gt;= 16
);</code></pre>
<p>Une sous-requête corrélée est réévaluée pour chaque ligne : c'est puissant mais coûteux. Une jointure fait souvent la même chose plus efficacement.</p>`,
retenir:"WHERE avant regroupement, HAVING après. Jointure interne pour les correspondances, externe pour tout garder. COUNT(*) et COUNT(colonne) ne comptent pas la même chose.",
exos:[{q:"Comment lister les UE sans aucun inscrit ?",r:"Par une jointure externe depuis UE vers Inscription, en gardant les lignes où la clé de l'inscription est NULL. On peut aussi utiliser NOT EXISTS."},{q:"Pourquoi SELECT nom, COUNT(*) FROM T GROUP BY annee échoue-t-il ?",r:"Parce que nom n'est ni dans le GROUP BY ni dans un agrégat : le SGBD ne saurait pas quel nom afficher pour un groupe qui en contient plusieurs."}]},

{t:"SQL : modifier et normaliser", obj:["Insérer, mettre à jour, supprimer","Comprendre les dépendances fonctionnelles","Atteindre la troisième forme normale"], html:`
<h4>Modification des données</h4>
<pre><code>INSERT INTO Etudiant (num_etu, nom, prenom, annee)
VALUES (12345, 'Lemaire', 'Yanis', 1);

UPDATE Inscription SET note = 15.5
WHERE num_etu = 12345 AND code_ue = 'EP2.2.1';

DELETE FROM Inscription WHERE num_etu = 12345;</code></pre>
<div class="piege"><b>Le WHERE oublié.</b> Un UPDATE ou un DELETE sans clause WHERE s'applique à toute la table. Écris toujours d'abord le SELECT correspondant pour vérifier les lignes visées.</div>
<h4>Pourquoi normaliser</h4>
<p>Un schéma mal conçu entraîne trois anomalies : à l'insertion (impossible d'ajouter une information sans en connaître une autre), à la mise à jour (une donnée dupliquée modifiée à un seul endroit), à la suppression (perte d'information collatérale).</p>
<h4>Dépendance fonctionnelle</h4>
<div class="def"><b>Dépendance fonctionnelle.</b> A détermine B lorsque, à une valeur de A, correspond toujours une seule valeur de B.</div>
<p>Exemple : le numéro d'étudiant détermine le nom. Le code postal détermine la ville, mais la ville ne détermine pas le code postal.</p>
<h4>Les trois premières formes normales</h4>
<ul>
<li><strong>1FN</strong> : chaque attribut est atomique, pas de liste dans une cellule.</li>
<li><strong>2FN</strong> : 1FN, et aucun attribut non clé ne dépend d'une partie seulement d'une clé composée.</li>
<li><strong>3FN</strong> : 2FN, et aucun attribut non clé n'en détermine un autre (pas de dépendance transitive).</li>
</ul>
<p>La formule mnémotechnique : chaque attribut dépend de la clé, de toute la clé, et de rien d'autre que la clé.</p>
<h4>Dénormalisation</h4>
<p>On duplique parfois volontairement une donnée pour accélérer des lectures très fréquentes. C'est un choix assumé, avec un mécanisme pour maintenir la cohérence — jamais un accident de conception.</p>`,
retenir:"Toujours écrire le SELECT avant l'UPDATE ou le DELETE. Normaliser jusqu'en 3FN : chaque attribut dépend de la clé, de toute la clé, et de rien que la clé.",
exos:[{q:"Une table Commande contenant le nom du client à côté de son identifiant est-elle en 3FN ?",r:"Non : le nom dépend de l'identifiant du client, pas de la clé de la commande. C'est une dépendance transitive, il faut une table Client séparée."},{q:"Que se passe-t-il si on stocke plusieurs numéros de téléphone dans une seule colonne ?",r:"La 1FN est violée : la valeur n'est plus atomique, ce qui rend la recherche et la mise à jour très pénibles. Il faut une table dédiée."}]}
]};
const SE = {code:"EP2.2.2", nom:"Systèmes d'exploitation", ects:4, h:"15h CM · 9h TD · 6h TP",
resume:"Ce que fait vraiment le système sous tes programmes : processus, ordonnancement, mémoire virtuelle, fichiers, concurrence. Le prolongement direct d'Architecture et Système, et le prérequis de Programmation Système en L2.",
chapitres:[
{t:"Rôle et structure d'un système", obj:["Situer le noyau","Distinguer les grandes familles de services","Comprendre l'appel système"], html:`
<h4>Deux missions</h4>
<p>Le système est à la fois une <strong>machine virtuelle</strong>, qui offre aux programmes une vue simple et uniforme du matériel, et un <strong>arbitre</strong>, qui partage les ressources entre les programmes en compétition.</p>
<h4>Les grands sous-systèmes</h4>
<ul>
<li>Gestion des processus : création, ordonnancement, terminaison.</li>
<li>Gestion de la mémoire : allocation, protection, mémoire virtuelle.</li>
<li>Système de fichiers : nommage, organisation, droits.</li>
<li>Entrées-sorties : pilotes, tampons.</li>
<li>Réseau et sécurité.</li>
</ul>
<h4>Noyau monolithique ou micro-noyau</h4>
<p>Un noyau monolithique, comme Linux, met tous les services en mode noyau : rapide, mais une faute dans un pilote peut tout faire tomber. Un micro-noyau réduit le mode noyau au strict minimum et déplace les services en mode utilisateur : plus robuste, plus lent à cause des communications.</p>
<h4>Appel système en pratique</h4>
<pre><code>#include &lt;unistd.h&gt;
#include &lt;fcntl.h&gt;

int fd = open("donnees.txt", O_RDONLY);
char tampon[1024];
ssize_t n = read(fd, tampon, sizeof(tampon));
close(fd);</code></pre>
