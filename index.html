<table><tr><th>f(x)</th><th>f'(x)</th></tr>
<tr><td>x^n</td><td>n x^(n-1)</td></tr>
<tr><td>exp(x)</td><td>exp(x)</td></tr>
<tr><td>ln(x)</td><td>1/x</td></tr>
<tr><td>sin(x)</td><td>cos(x)</td></tr>
<tr><td>cos(x)</td><td>-sin(x)</td></tr>
<tr><td>racine de x</td><td>1 / (2 fois racine de x)</td></tr></table>
<h4>Variations</h4>
<p>Le signe de la dérivée donne le sens de variation. Une dérivée qui s'annule en changeant de signe donne un extremum local. Attention : une dérivée nulle sans changement de signe ne donne pas d'extremum.</p>
<h4>Accroissements finis</h4>
<p>Si f est continue sur un segment et dérivable à l'intérieur, il existe un point où la dérivée égale la pente de la corde. L'inégalité qui en découle, majorant l'écart des images par le maximum de la dérivée fois l'écart des antécédents, sert à contrôler les erreurs d'approximation numérique.</p>
<h4>Méthode de Newton</h4>
<p>Pour résoudre f(x) = 0, on itère en remplaçant f par sa tangente. La convergence est très rapide quand on part assez près de la solution. C'est un exemple direct de suite définie par récurrence, et un algorithme que tu implémenteras en TP.</p>`,
retenir:"Signe de la dérivée = sens de variation. La composition est la règle qu'on rate le plus souvent. L'inégalité des accroissements finis borne l'erreur d'une approximation.",
exos:[{q:"Dérive f(x) = x² × exp(x).",r:"f'(x) = 2x exp(x) + x² exp(x) = (x² + 2x) exp(x), par la règle du produit."},{q:"Écris l'itération de Newton pour approcher la racine carrée de 2.",r:"On applique Newton à f(x) = x² - 2, ce qui donne u(n+1) = (u(n) + 2/u(n)) / 2. Convergence très rapide en partant de 1."}]},

{t:"Développements limités", obj:["Écrire un développement limité usuel","Lever une indétermination par DL","Comprendre la notion de reste"], html:`
<h4>Idée</h4>
<p>Approcher une fonction au voisinage d'un point par un polynôme, avec un contrôle de l'erreur. La dérivée donne l'approximation affine ; le développement limité pousse l'idée à l'ordre n.</p>
<h4>Développements en zéro à connaître</h4>
<ul>
<li>exp(x) = 1 + x + x²/2 + x³/6 + reste</li>
<li>1/(1-x) = 1 + x + x² + x³ + reste</li>
<li>ln(1+x) = x - x²/2 + x³/3 + reste</li>
<li>sin(x) = x - x³/6 + reste</li>
<li>cos(x) = 1 - x²/2 + x⁴/24 + reste</li>
<li>(1+x)^a = 1 + a x + a(a-1)x²/2 + reste</li>
</ul>
<h4>Usage</h4>
<p>Pour lever une indétermination, on remplace chaque fonction par son développement à un ordre suffisant, on simplifie, et on lit le terme dominant. Il faut développer tous les termes au même ordre, sinon le résultat est faux.</p>
<p>Exemple : le quotient de sin(x) par x tend vers 1, puisque sin(x) vaut x plus un terme en x³.</p>
<h4>Reste</h4>
<p>La notation du reste signifie que le terme négligé devient négligeable devant la dernière puissance conservée quand x tend vers 0. Ce n'est pas une constante : c'est une famille de fonctions dominées.</p>
<div class="piege"><b>Ordre insuffisant.</b> Si les premiers termes se simplifient, l'ordre choisi ne suffit plus et on obtient une forme indéterminée résiduelle. Il faut alors recommencer un cran plus loin.</div>
<h4>Lien numérique</h4>
<p>Les bibliothèques mathématiques calculent les fonctions transcendantes par des approximations polynomiales de ce type. Comprendre les DL, c'est comprendre comment une machine calcule un sinus.</p>`,
retenir:"Un DL approche localement par un polynôme, avec un reste contrôlé. On développe tout au même ordre, et on augmente l'ordre si les premiers termes s'annulent.",
exos:[{q:"Limite en 0 de (exp(x) - 1 - x) / x² ?",r:"1/2. Le développement de exp(x) donne 1 + x + x²/2, donc le numérateur vaut x²/2 plus un reste négligeable."},{q:"Quel est le DL de ln(1+x) à l'ordre 2 ?",r:"x - x²/2 plus un reste négligeable devant x²."}]},

{t:"Intégration", obj:["Calculer une primitive","Utiliser l'intégration par parties et le changement de variable","Interpréter une intégrale"], html:`
<h4>Primitive et intégrale</h4>
<p>Une primitive de f est une fonction dont la dérivée vaut f. Le théorème fondamental relie les deux notions : l'intégrale de f entre a et b vaut la différence des valeurs d'une primitive aux bornes.</p>
<h4>Primitives usuelles</h4>
<p>À connaître : les puissances, l'exponentielle, l'inverse qui donne le logarithme de la valeur absolue, sinus et cosinus. Toute expression de la forme « dérivée divisée par la fonction » a pour primitive le logarithme de la valeur absolue de la fonction.</p>
<h4>Intégration par parties</h4>
<p>Elle transforme l'intégrale d'un produit en une autre intégrale, souvent plus simple. On l'utilise typiquement quand un facteur se simplifie en dérivant (un polynôme) et que l'autre s'intègre facilement (une exponentielle, un sinus).</p>
<h4>Changement de variable</h4>
<p>On pose une nouvelle variable, on remplace l'expression et le différentiel, et surtout on <strong>change les bornes</strong>. L'oubli des bornes est l'erreur la plus fréquente.</p>
<h4>Interprétations</h4>
<p>Aire algébrique sous la courbe, valeur moyenne d'une fonction sur un intervalle, accumulation d'une grandeur. En probabilités, l'intégrale d'une densité donne une probabilité — ce que le module de Mathématiques pour l'ingénieur utilisera.</p>
<h4>Calcul numérique</h4>
<p>Quand aucune primitive ne s'exprime simplement, on approche : méthode des rectangles, des trapèzes, de Simpson. Ce sont des sommes finies, donc des boucles, et c'est un TP classique de première année.</p>`,
retenir:"Intégrer, c'est chercher une primitive. Par parties quand un facteur se simplifie en dérivant ; changement de variable en n'oubliant pas de convertir les bornes.",
exos:[{q:"Calcule une primitive de x × exp(x).",r:"Par parties : (x - 1) exp(x). On dérive le polynôme et on intègre l'exponentielle."},{q:"Quelle méthode numérique donne un résultat exact pour une fonction affine ?",r:"La méthode des trapèzes : elle approche par des segments, donc elle est exacte sur une fonction affine."}]}
]};

const MATHING1 = {code:"EP1.3.2", nom:"Mathématiques pour l'ingénieur", ects:4, h:"20h",
resume:"Le versant appliqué des maths : dénombrement, probabilités, statistiques descriptives. Ce sont les outils qui servent à évaluer un algorithme en moyenne, à dimensionner une table de hachage, à interpréter des mesures de performance.",
chapitres:[
{t:"Dénombrement", obj:["Compter sans énumérer","Choisir entre arrangement et combinaison","Utiliser le principe d'inclusion-exclusion"], html:`
<h4>Les principes de base</h4>
<ul>
<li><strong>Principe additif</strong> : si deux choix sont exclusifs, on additionne les possibilités.</li>
<li><strong>Principe multiplicatif</strong> : si l'on fait successivement deux choix indépendants, on multiplie les possibilités.</li>
</ul>
<h4>Les quatre situations classiques</h4>
<table><tr><th>Situation</th><th>Nombre</th><th>Exemple</th></tr>
<tr><td>p-listes (avec répétition, ordonné)</td><td>n puissance p</td><td>mots de passe de p caractères</td></tr>
<tr><td>Arrangements (sans répétition, ordonné)</td><td>n!/(n-p)!</td><td>podium de p places parmi n</td></tr>
<tr><td>Permutations</td><td>n!</td><td>ordres de tri possibles</td></tr>
<tr><td>Combinaisons (sans répétition, non ordonné)</td><td>coefficient binomial</td><td>choisir p éléments parmi n</td></tr></table>
<p>La question à se poser à chaque fois : l'ordre compte-t-il ? peut-on répéter ? Ces deux réponses déterminent la formule.</p>
<h4>Coefficients binomiaux</h4>
<p>Le nombre de parties à p éléments d'un ensemble à n éléments. Propriétés utiles : la symétrie entre p et n-p, la relation de Pascal qui construit le triangle, et la formule du binôme de Newton.</p>
<p>La somme de tous les coefficients binomiaux pour un n donné vaut 2 puissance n : c'est le nombre de parties de l'ensemble, résultat déjà rencontré en Logique.</p>
<h4>Inclusion-exclusion</h4>
<p>Pour compter les éléments d'une union, on additionne les cardinaux puis on retranche les intersections comptées deux fois. Avec trois ensembles, on ajoute l'intersection triple.</p>
<h4>Applications informatiques</h4>
<p>Taille d'un espace de clés, nombre de tests exhaustifs à effectuer, nombre de chemins dans un graphe, complexité d'une énumération. Le dénombrement dit très vite si une approche par force brute est envisageable.</p>`,
retenir:"Deux questions décident de la formule : l'ordre compte-t-il, y a-t-il répétition. Combinaisons pour choisir sans ordre, arrangements pour choisir avec ordre.",
exos:[{q:"Combien de mots de passe de 8 caractères avec 62 symboles possibles ?",r:"62 puissance 8, soit environ 2 × 10^14. Suffisant contre un humain, très peu contre une machine moderne."},{q:"Combien de façons de choisir 3 délégués parmi 25 étudiants ?",r:"Le coefficient binomial de 3 parmi 25, soit 2300. L'ordre ne compte pas."}]},

{t:"Probabilités : les bases", obj:["Modéliser une expérience aléatoire","Calculer une probabilité conditionnelle","Appliquer la formule de Bayes"], html:`
<h4>Vocabulaire</h4>
<p>Une expérience aléatoire a un ensemble de résultats possibles appelé univers. Un événement en est une partie. Une probabilité attribue à chaque événement un nombre entre 0 et 1, avec une probabilité totale égale à 1 et l'additivité sur les événements incompatibles.</p>
<p>En situation d'équiprobabilité, la probabilité d'un événement est le quotient du nombre de cas favorables par le nombre de cas possibles : d'où l'importance du dénombrement.</p>
<h4>Opérations</h4>
<p>Probabilité du contraire : 1 moins la probabilité. Probabilité d'une union : somme des probabilités moins celle de l'intersection.</p>
<h4>Conditionnement</h4>
<div class="def"><b>Probabilité conditionnelle.</b> La probabilité de A sachant B est le quotient de la probabilité de l'intersection par celle de B, définie quand B n'est pas négligeable.</div>
<p>Deux événements sont <strong>indépendants</strong> quand la probabilité de leur intersection est le produit de leurs probabilités. Indépendant n'est pas synonyme d'incompatible : deux événements incompatibles de probabilités non nulles sont au contraire fortement dépendants.</p>
<h4>Probabilités totales et Bayes</h4>
<p>La formule des probabilités totales décompose un événement selon un système complet de cas. La formule de Bayes renverse le conditionnement : elle exprime la probabilité de la cause sachant l'effet à partir de la probabilité de l'effet sachant la cause.</p>
<h4>Le paradoxe du test médical</h4>
<p>Un test fiable à 99 % pour une maladie touchant une personne sur dix mille donne, en cas de résultat positif, moins de 1 % de chance d'être réellement malade. La raison : les faux positifs, très nombreux en valeur absolue, écrasent les vrais positifs. C'est le même raisonnement qui sert à évaluer un filtre anti-spam ou un détecteur d'intrusion.</p>`,
retenir:"Conditionner, c'est restreindre l'univers. Bayes renverse le sens du conditionnement. Indépendance et incompatibilité sont deux notions différentes, souvent confondues en examen.",
exos:[{q:"On lance deux dés. Probabilité que la somme fasse 7 ?",r:"6 cas favorables sur 36, soit 1/6. C'est la somme la plus probable."},{q:"Un antivirus détecte 95 % des virus et donne 2 % de fausses alertes. Si 1 % des fichiers sont infectés, quelle est la probabilité qu'un fichier signalé le soit vraiment ?",r:"Par Bayes : 0,95 × 0,01 divisé par (0,95 × 0,01 + 0,02 × 0,99), soit environ 32 %. Deux alertes sur trois sont fausses."}]},

{t:"Variables aléatoires et lois usuelles", obj:["Définir une variable aléatoire discrète","Calculer espérance et variance","Reconnaître les lois classiques"], html:`
<h4>Variable aléatoire</h4>
<p>Une fonction qui associe un nombre à chaque résultat d'une expérience. Sa <strong>loi</strong> donne la probabilité de chaque valeur possible.</p>
<h4>Espérance et variance</h4>
<div class="def"><b>Espérance.</b> Moyenne pondérée des valeurs par leurs probabilités : la valeur moyenne obtenue si l'on répétait l'expérience un très grand nombre de fois.</div>
<p>La variance mesure la dispersion autour de l'espérance ; l'écart type en est la racine carrée et s'exprime dans la même unité que la variable. L'espérance est linéaire, y compris pour des variables dépendantes — propriété très pratique en analyse d'algorithmes.</p>
<h4>Lois discrètes usuelles</h4>
<ul>
<li><strong>Uniforme</strong> : toutes les valeurs équiprobables. Modélise un tirage sans biais, un index de table de hachage idéal.</li>
<li><strong>Bernoulli</strong> : succès ou échec avec probabilité p. Espérance p.</li>
<li><strong>Binomiale</strong> : nombre de succès sur n épreuves indépendantes. Espérance np.</li>
<li><strong>Géométrique</strong> : rang du premier succès. Espérance l'inverse de p — d'où le nombre moyen d'essais avant de trouver.</li>
<li><strong>Poisson</strong> : nombre d'événements rares sur une période. Modélise des arrivées de requêtes sur un serveur.</li>
</ul>
<h4>Loi normale</h4>
<p>Loi continue en cloche, caractérisée par sa moyenne et son écart type. Le théorème central limite explique son omniprésence : la somme de nombreuses petites contributions indépendantes tend vers une loi normale, quelle que soit la loi de départ. C'est pourquoi les temps de réponse mesurés sur un système ressemblent souvent à une gaussienne.</p>
<h4>Application en algorithmique</h4>
<p>La complexité en moyenne d'un algorithme est une espérance. Le tri rapide est quadratique au pire mais quasi-linéaire en moyenne : c'est un calcul d'espérance sur le choix aléatoire du pivot qui le justifie.</p>`,
retenir:"L'espérance est une moyenne pondérée et elle est toujours linéaire. Binomiale pour compter des succès, géométrique pour attendre le premier, Poisson pour des événements rares.",
exos:[{q:"Espérance du nombre de faces obtenues en lançant 10 pièces équilibrées ?",r:"5. C'est une loi binomiale de paramètres 10 et 0,5, d'espérance np."},{q:"Combien de lancers en moyenne pour obtenir un 6 avec un dé ?",r:"6. Loi géométrique de paramètre 1/6, d'espérance égale à l'inverse de p."}]},

{t:"Statistiques descriptives", obj:["Résumer un jeu de données","Choisir entre moyenne et médiane","Lire un écart type et une corrélation"], html:`
<h4>Indicateurs de position</h4>
<p>Moyenne, médiane, mode. La médiane est robuste : une valeur aberrante la déplace peu, alors qu'elle peut déplacer fortement la moyenne. Pour des temps d'exécution, la médiane et les quantiles élevés sont plus informatifs que la moyenne.</p>
<h4>Indicateurs de dispersion</h4>
<p>Étendue, écart interquartile, variance, écart type. Deux séries de même moyenne peuvent avoir des comportements radicalement différents : c'est la dispersion qui les distingue.</p>
<h4>Quantiles</h4>
<p>Le quantile d'ordre 0,9 est la valeur en dessous de laquelle se trouvent 90 % des observations. Dans l'industrie, on mesure les performances par ces quantiles élevés : une latence médiane excellente peut masquer une expérience désastreuse pour quelques pour cent des utilisateurs.</p>
<h4>Représentations</h4>
<p>Histogramme pour la distribution, boîte à moustaches pour comparer des groupes, nuage de points pour deux variables. Le choix du nombre de classes d'un histogramme change radicalement l'impression visuelle : c'est un choix à justifier.</p>
<h4>Corrélation</h4>
<p>Le coefficient de corrélation linéaire varie entre -1 et 1 et mesure l'intensité d'une liaison <em>linéaire</em>. Une corrélation nulle n'exclut pas une relation forte mais non linéaire.</p>
<div class="piege"><b>Corrélation n'est pas causalité.</b> Deux variables peuvent varier ensemble parce qu'une troisième les influence toutes deux. C'est le point le plus souvent oublié dans un rapport de projet.</div>
<h4>Application</h4>
<p>Comparer deux implémentations demande de mesurer plusieurs exécutions, de reporter médiane et dispersion, et de se méfier des conclusions tirées d'une mesure unique. Le module Outils de la rédaction scientifique te demandera précisément ce type de rigueur.</p>`,
retenir:"Médiane et quantiles plutôt que moyenne pour des mesures bruitées. Toujours accompagner un indicateur de position d'un indicateur de dispersion. Une corrélation ne prouve rien sur les causes.",
exos:[{q:"Sur les valeurs 2, 3, 3, 4, 100, que valent moyenne et médiane ?",r:"Moyenne 22,4 ; médiane 3. La valeur aberrante déforme complètement la moyenne."},{q:"Pourquoi reporter le quantile 0,95 des temps de réponse d'un serveur ?",r:"Parce qu'il décrit l'expérience des utilisateurs les moins bien servis, que la moyenne masque totalement."}]}
]};

const ANGLAIS1 = {code:"EP1.4.1", nom:"Anglais", ects:2, h:"18h TD",
resume:"Anglais de spécialité, présent aux six semestres de la licence. L'objectif n'est pas la littérature mais la capacité à lire une documentation technique, comprendre une conférence et présenter son travail.",
chapitres:[
{t:"Lire de la documentation technique", obj:["Décoder la structure d'une page de documentation","Se constituer un lexique du domaine","Lire vite sans tout traduire"], html:`
<h4>Pourquoi c'est le vrai enjeu</h4>
<p>La quasi-totalité de la documentation informatique de référence est en anglais, et les traductions sont souvent en retard ou incomplètes. Savoir lire sans traduire mentalement fait gagner un temps considérable en TP.</p>
<h4>Structure d'une page de référence</h4>
<p>Une entrée de documentation suit presque toujours le même plan : nom, synopsis (signature), description, valeur de retour, erreurs possibles, exemples, renvois. Repérer ce squelette permet d'aller directement à l'information cherchée.</p>
<h4>Lexique de base à maîtriser</h4>
<table><tr><th>Anglais</th><th>Français</th></tr>
<tr><td>array</td><td>tableau</td></tr>
<tr><td>pointer</td><td>pointeur</td></tr>
<tr><td>loop</td><td>boucle</td></tr>
<tr><td>statement</td><td>instruction</td></tr>
<tr><td>issue</td><td>problème, ticket</td></tr>
<tr><td>deprecated</td><td>obsolète, déconseillé</td></tr>
<tr><td>to handle</td><td>traiter, gérer</td></tr>
<tr><td>to raise / to throw</td><td>lever (une erreur)</td></tr></table>
<h4>Faux amis fréquents</h4>
<p>« Eventually » signifie finalement, pas éventuellement. « Actually » signifie en réalité, pas actuellement. « To support » signifie prendre en charge. « Library » est une bibliothèque, pas une librairie.</p>
<h4>Méthode</h4>
<p>Lis d'abord les titres et le code d'exemple : le code est un langage que tu connais déjà et il désambiguïse le texte. Ne cherche dans un dictionnaire que les mots qui bloquent réellement la compréhension.</p>`,
retenir:"La documentation suit toujours la même structure : apprends le squelette plutôt que chaque page. Lis le code d'abord, il éclaire le texte.",
exos:[{q:"Que signifie « this function is deprecated but still supported » ?",r:"La fonction est déconseillée et destinée à disparaître, mais elle fonctionne encore. Il faut prévoir son remplacement."},{q:"Traduis « the loop iterates over the array until the condition is met ».",r:"La boucle parcourt le tableau jusqu'à ce que la condition soit remplie."}]},
{t:"Présenter son travail à l'oral", obj:["Structurer une présentation courte","Utiliser les tournures de présentation","Gérer les questions"], html:`
<h4>Structure</h4>
<p>Introduction annonçant le plan, développement en deux ou trois parties, conclusion rappelant le message principal. En anglais plus encore qu'en français, on annonce ce qu'on va dire, on le dit, puis on rappelle ce qu'on a dit.</p>
<h4>Formules utiles</h4>
<ul>
<li>Ouvrir : today I would like to present...</li>
<li>Annoncer : this talk is divided into three parts</li>
<li>Enchaîner : let us now move on to...</li>
<li>Illustrer : as you can see on this slide...</li>
<li>Conclure : to sum up... / to conclude...</li>
<li>Répondre : that is a good point, let me clarify...</li>
</ul>
<h4>Prononciation à surveiller</h4>
<p>Les mots techniques que les francophones déforment le plus : data, query, cache, queue, schedule, algorithm, variable, integer, height. Écoute une conférence technique et répète : c'est plus efficace qu'une liste apprise.</p>
<h4>Questions</h4>
<p>Si tu ne comprends pas une question, demande une reformulation : « could you rephrase that, please ». C'est parfaitement acceptable, et bien mieux que de répondre à côté.</p>`,
retenir:"Annoncer, développer, résumer. Quelques formules de liaison bien maîtrisées valent mieux qu'un vocabulaire riche mal prononcé.",
exos:[{q:"Comment demander poliment de répéter une question ?",r:"Could you repeat that, please? ou Would you mind rephrasing the question?"},{q:"Comment annoncer un plan en trois parties ?",r:"I will first present..., then I will explain..., and finally I will discuss..."}]},
{t:"Écrire un rapport et un CV", obj:["Rédiger un résumé en anglais","Adopter le registre technique","Préparer un CV pour un stage"], html:`
<h4>Le résumé</h4>
<p>Un abstract fait cinq à huit phrases : contexte, problème, méthode, résultats, conclusion. Une phrase par élément. Le temps dominant est le passé pour ce qui a été fait, le présent pour ce qui est vrai en général.</p>
<h4>Registre</h4>
<p>Phrases courtes, voix active de préférence, pas de familiarités, pas de « I think ». Les connecteurs logiques doivent être explicites : however, therefore, moreover, in contrast.</p>
<h4>CV et lettre</h4>
<p>Un CV anglophone se concentre sur les compétences et les réalisations, sans photo ni état civil détaillé. Décris chaque expérience par un verbe d'action au passé : developed, implemented, tested, designed. Le stage obligatoire de la licence te fera écrire ces documents pour de vrai.</p>
<h4>Erreurs de francophone</h4>
<p>Pas de majuscules aux noms de langues ou de mois en français mais bien en anglais. Attention aux nombres : la virgule sépare les milliers, le point marque la décimale.</p>`,
retenir:"Abstract : une phrase par étape du raisonnement. CV : des verbes d'action au passé et des résultats concrets. Point décimal et virgule des milliers inversés par rapport au français.",
exos:[{q:"Traduis « nous avons développé un prototype et mesuré ses performances ».",r:"We developed a prototype and measured its performance. Le mot performance reste au singulier dans ce sens."},{q:"Comment s'écrit trois mille cinq dixièmes en anglais ?",r:"3,000.5 — virgule pour les milliers, point pour la décimale."}]}
]};

const DOC = {code:"EP1.4.2", nom:"Compétences documentaires", ects:0, h:"6h TD",
resume:"Court module de méthodologie : chercher, évaluer et citer des sources. Il conditionne la qualité de tous tes rapports jusqu'en L3, et te protège du plagiat.",
chapitres:[
{t:"Chercher et évaluer l'information", obj:["Construire une requête efficace","Évaluer la fiabilité d'une source","Utiliser les ressources de la BU"], html:`
<h4>Construire une requête</h4>
<p>Identifie les concepts clés, cherche leurs synonymes et leur traduction anglaise, puis combine avec des opérateurs : guillemets pour une expression exacte, opérateurs booléens pour croiser ou exclure. Les connecteurs du cours de Logique sont exactement ceux des moteurs de recherche.</p>
<h4>Hiérarchie des sources</h4>
<ol>
<li>Articles de revues et de conférences à comité de lecture.</li>
<li>Ouvrages universitaires et documentation officielle d'un projet.</li>
<li>Sites institutionnels, thèses, rapports techniques.</li>
<li>Blogs et forums : utiles pour débloquer un TP, jamais citables comme référence.</li>
</ol>
<h4>Grille d'évaluation</h4>
<p>Qui est l'auteur et quelle est sa légitimité ? Quand le document a-t-il été publié ou mis à jour ? Les affirmations sont-elles sourcées ? Le site a-t-il un intérêt commercial dans le propos ? En informatique, la date est cruciale : une réponse de 2013 sur une bibliothèque peut être totalement obsolète.</p>
<h4>Ressources de l'université</h4>
<p>La bibliothèque universitaire donne accès, via l'ENT, à des bases de données et à des revues payantes. C'est un accès qui disparaît à la fin de tes études : autant apprendre à s'en servir maintenant.</p>
<h4>Outils génératifs</h4>
<p>Un assistant conversationnel peut expliquer un concept mais invente parfois des références. Toute affirmation destinée à un rapport doit être vérifiée dans une source primaire. Les règles de l'université sur l'usage de ces outils s'appliquent, et le non-respect est traité comme une fraude.</p>`,
retenir:"Une source se juge sur son auteur, sa date et ses références. En informatique, une source de plus de cinq ans doit être vérifiée avant usage.",
exos:[{q:"Pourquoi une réponse très votée sur un forum n'est-elle pas une référence acceptable ?",r:"Parce qu'elle n'est ni relue par des pairs, ni datée de façon fiable, et qu'elle peut décrire une pratique devenue obsolète. Elle peut servir de piste, pas de preuve."},{q:"Comment restreindre une recherche aux sites universitaires ?",r:"En utilisant un filtre de domaine, par exemple site:.edu ou site:.fr couplé au nom d'un établissement, ou en passant par un moteur académique."}]},
{t:"Citer et éviter le plagiat", obj:["Citer selon une norme","Distinguer citation et paraphrase","Gérer une bibliographie"], html:`
<h4>Ce qu'est le plagiat</h4>
<div class="def"><b>Plagiat.</b> Présenter comme sien le travail, les idées ou la formulation d'autrui, sans attribution. Cela vaut pour le texte, les images, les schémas et le code source.</div>
<p>L'université utilise des outils de détection de similitudes. Les sanctions vont jusqu'à l'exclusion. La copie de code d'un camarade en TP relève du même régime.</p>
<h4>Citation directe et paraphrase</h4>
<p>Une citation reprend les mots exacts entre guillemets, avec la référence précise. Une paraphrase reformule entièrement l'idée avec tes propres mots — et exige tout de même la référence. Changer trois mots à une phrase n'est pas une paraphrase.</p>
<h4>Format d'une référence</h4>
<p>Une référence doit permettre de retrouver le document : auteurs, titre, support, éditeur ou revue, année, pages, et pour le web l'adresse avec la date de consultation. Reste cohérent avec une seule norme dans tout le document.</p>
<h4>Outils</h4>
<p>Un gestionnaire bibliographique stocke tes références et génère la bibliographie automatiquement. Couplé à LaTeX, vu dans le module de rédaction scientifique, il rend la mise en forme totalement automatique.</p>
<h4>Cas du code</h4>
<p>Réutiliser du code trouvé en ligne suppose de vérifier sa licence et de le signaler en commentaire. Une licence libre n'autorise pas toujours n'importe quel usage : certaines imposent de publier ton propre code sous la même licence.</p>`,
retenir:"Toute idée qui n'est pas de toi se cite, qu'elle soit citée mot à mot ou reformulée. Le code aussi a des auteurs et des licences.",
exos:[{q:"Faut-il citer une idée qu'on a entièrement reformulée ?",r:"Oui. La paraphrase dispense des guillemets, jamais de la référence."},{q:"Que vérifier avant de réutiliser une fonction trouvée sur un dépôt public ?",r:"Sa licence, sa compatibilité avec l'usage prévu, et la nécessité de créditer l'auteur. Il faut aussi la comprendre avant de l'intégrer."}]}
]};

const REDAC = {code:"EP1.4.3b", nom:"Outils de la rédaction scientifique", ects:2, h:"18h TD",
resume:"Produire un document scientifique propre : structure, figures, tableaux, formules, bibliographie. En pratique, c'est le module où l'on apprend LaTeX, l'outil que tu utiliseras pour tous tes rapports jusqu'au master.",
chapitres:[
{t:"Structurer un document scientifique", obj:["Organiser un rapport","Écrire une introduction et une conclusion","Séparer fond et forme"], html:`
<h4>Le plan type</h4>
<ol>
<li><strong>Introduction</strong> : contexte, problème, objectif, annonce du plan.</li>
<li><strong>État de l'existant</strong> : ce qui a déjà été fait, avec références.</li>
<li><strong>Méthode</strong> : ce que tu as fait, assez précisément pour être reproduit.</li>
<li><strong>Résultats</strong> : les faits, sans interprétation.</li>
<li><strong>Discussion</strong> : interprétation, limites, comparaison.</li>
<li><strong>Conclusion</strong> : réponse à la question posée et perspectives.</li>
</ol>
<h4>Fond et forme</h4>
<p>L'idée directrice des outils de rédaction scientifique est de séparer le contenu de sa présentation. Tu décris qu'un texte est un titre de section ; l'outil décide de sa taille et de sa numérotation. Cela garantit la cohérence et permet de changer toute la mise en forme en une ligne.</p>
<h4>Figures et tableaux</h4>
<p>Chaque figure porte une légende sous elle, chaque tableau une légende au-dessus, tous deux numérotés et <strong>appelés dans le texte</strong>. Une figure jamais mentionnée n'a pas de raison d'être. Les axes d'un graphique portent un nom et une unité.</p>
<h4>Style</h4>
<p>Phrases courtes, une idée par paragraphe, pas de « on » vague, pas d'affirmation sans justification. Le présent pour les vérités générales, le passé composé pour ce que tu as fait.</p>`,
retenir:"Un rapport répond à une question posée en introduction. Sépare toujours ce que tu as observé de ce que tu en déduis. Toute figure est légendée, numérotée et citée dans le texte.",
exos:[{q:"Où placer la légende d'un tableau ?",r:"Au-dessus, contrairement à celle d'une figure qui se place en dessous."},{q:"Quelle différence entre section Résultats et section Discussion ?",r:"Les résultats exposent les faits mesurés sans interprétation ; la discussion les interprète, les compare et en expose les limites."}]},
{t:"LaTeX : premiers pas", obj:["Compiler un document","Structurer avec les commandes de sectionnement","Écrire des formules"], html:`
<h4>Un document minimal</h4>
<pre><code>\\documentclass[11pt,a4paper]{article}
\\usepackage[utf8]{inputenc}
\\usepackage[T1]{fontenc}
\\usepackage[french]{babel}

\\title{Rapport de TP}
\\author{Prenom Nom}
\\date{\\today}

\\begin{document}
\\maketitle
\\tableofcontents

\\section{Introduction}
Le texte de l'introduction.

\\section{Methode}
\\subsection{Materiel}
Description.

\\end{document}</code></pre>
<p>Le préambule charge les extensions et règle les options ; le corps contient le texte. La compilation produit un PDF. Il faut souvent compiler deux fois pour que la table des matières et les références se mettent à jour.</p>
<h4>Formules</h4>
<p>Une formule dans le texte se place entre deux symboles dollar ; une formule isolée et numérotée s'écrit dans un environnement d'équation. La syntaxe des fractions, racines, indices, exposants, sommes et intégrales s'apprend en une séance et sert ensuite pendant cinq ans.</p>
<h4>Références croisées</h4>
<p>On étiquette une section, une figure ou une équation, et on y renvoie par une commande de référence. Les numéros sont recalculés automatiquement : plus jamais de « voir figure 3 » qui pointe vers la figure 4 après une insertion.</p>
<h4>Bibliographie</h4>
<p>Les références sont stockées dans un fichier séparé, appelées par une commande de citation, et la bibliographie se génère seule dans le style choisi.</p>
<h4>Erreurs fréquentes</h4>
<ul>
<li>Accolade non fermée : l'erreur est signalée bien après sa cause réelle.</li>
<li>Caractères spéciaux non protégés, comme le pourcentage qui commence un commentaire.</li>
<li>Figures placées ailleurs que là où on les a écrites : c'est normal, LaTeX optimise la mise en page.</li>
</ul>`,
retenir:"Préambule puis corps, compilation deux fois, étiquettes et références automatiques. LaTeX prend une heure à apprendre et fait gagner des semaines sur cinq ans d'études.",
exos:[{q:"Pourquoi faut-il parfois compiler deux fois ?",r:"Parce que la première passe collecte les numéros de sections, figures et références, et la seconde les insère dans le texte."},{q:"Comment insérer un caractère pourcentage dans un texte LaTeX ?",r:"En le faisant précéder d'une barre oblique inverse, sinon il est interprété comme un début de commentaire."}]}
]};

const LINUX = {code:"EP1.4.4", nom:"Environnement Linux", ects:2, h:"6h CM · 12h TP",
resume:"La ligne de commande, l'arborescence, les droits, les scripts. C'est l'environnement de travail de tous les TP d'informatique de la licence : plus tôt il est acquis, plus vite le reste avance.",
chapitres:[
{t:"Arborescence et navigation", obj:["Se repérer dans le système de fichiers","Utiliser chemins absolus et relatifs","Manipuler fichiers et répertoires"], html:`
<h4>Une seule racine</h4>
<p>Contrairement à Windows et ses lettres de lecteur, Linux organise tout sous une racine unique notée par une barre oblique. Les périphériques et partitions sont montés en des points de cette arborescence.</p>
<table><tr><th>Répertoire</th><th>Contenu</th></tr>
<tr><td>/home</td><td>répertoires personnels des utilisateurs</td></tr>
<tr><td>/etc</td><td>fichiers de configuration</td></tr>
<tr><td>/bin, /usr/bin</td><td>programmes exécutables</td></tr>
<tr><td>/tmp</td><td>fichiers temporaires</td></tr>
<tr><td>/var</td><td>données variables, journaux</td></tr></table>
<h4>Chemins</h4>
<p>Un chemin absolu part de la racine, un chemin relatif part du répertoire courant. Le point désigne le répertoire courant, deux points le parent, le tilde ton répertoire personnel.</p>
<h4>Commandes de base</h4>
<pre><code>pwd              # ou suis-je
ls -l            # lister en detail
ls -la           # y compris les fichiers caches
cd /home/yaya    # se deplacer
cd ..            # remonter d'un niveau
mkdir projets    # creer un repertoire
cp a.txt b.txt   # copier
mv a.txt dossier/ # deplacer ou renommer
rm fichier       # supprimer
rm -r dossier    # supprimer recursivement</code></pre>
<div class="piege"><b>Pas de corbeille.</b> <code>rm</code> supprime définitivement. La combinaison de la suppression récursive et forcée à la racine est la façon classique de détruire un système. Vérifie toujours ton répertoire courant avant un rm récursif.</div>
<h4>Aide</h4>
<p>La commande <code>man</code> affiche le manuel d'une commande, et <code>--help</code> donne un résumé rapide. Savoir lire un manuel est une compétence évaluée : c'est aussi de l'anglais technique.</p>`,
retenir:"Une racine unique, des chemins absolus ou relatifs, et un manuel pour chaque commande. rm ne pardonne pas : pas de corbeille.",
exos:[{q:"Que fait cd - ?",r:"Il revient au répertoire précédent, comme un bouton retour."},{q:"Comment lister les fichiers cachés triés par date ?",r:"ls -lat : l pour le format long, a pour les fichiers cachés, t pour le tri par date de modification."}]},
{t:"Droits, utilisateurs, processus", obj:["Lire et modifier des permissions","Comprendre le rôle du superutilisateur","Surveiller et arrêter un processus"], html:`
<h4>Lire les droits</h4>
<p>Une ligne comme <code>-rwxr-xr--</code> se décompose en quatre parties : type de fichier, puis droits du propriétaire, du groupe et des autres. Les trois lettres signifient lecture, écriture et exécution.</p>
<h4>Notation octale</h4>
<p>Lecture vaut 4, écriture 2, exécution 1. On additionne par catégorie : 7 pour tous les droits, 5 pour lecture et exécution, 6 pour lecture et écriture.</p>
<pre><code>chmod 755 script.sh   # rwx pour le proprietaire, rx pour les autres
chmod u+x script.sh   # ajouter l'execution au proprietaire
chown yaya fichier    # changer de proprietaire (necessite les droits)</code></pre>
<h4>Superutilisateur</h4>
<p>Le compte root a tous les droits. On utilise <code>sudo</code> pour exécuter ponctuellement une commande avec ces privilèges. Travailler en permanence en root est une mauvaise pratique : la moindre erreur devient irréversible.</p>
<h4>Processus</h4>
<pre><code>ps aux           # lister les processus
top              # activite en temps reel
kill 1234        # demander l'arret du processus 1234
kill -9 1234     # forcer l'arret
programme &amp;      # lancer en arriere-plan</code></pre>
<p>Chaque processus a un identifiant, un propriétaire et un processus parent. La combinaison Ctrl-C envoie un signal d'interruption au processus au premier plan. Le cours de Systèmes d'exploitation du semestre 2 explique ce qui se passe réellement derrière ces commandes.</p>`,
retenir:"Trois catégories, trois droits, une notation octale. sudo ponctuellement plutôt que root en permanence. Un processus s'arrête d'abord poliment, par la force en dernier recours.",
exos:[{q:"Que signifie chmod 644 fichier ?",r:"Lecture et écriture pour le propriétaire, lecture seule pour le groupe et les autres. C'est le réglage standard d'un fichier de données."},{q:"Pourquoi éviter kill -9 en premier réflexe ?",r:"Parce que le processus n'a pas la possibilité de fermer proprement ses fichiers, ce qui peut corrompre des données."}]},
{t:"Redirections, filtres et scripts", obj:["Chaîner des commandes","Utiliser les filtres classiques","Écrire un script shell simple"], html:`
<h4>Les trois flux</h4>
<p>Tout programme dispose d'une entrée standard, d'une sortie standard et d'une sortie d'erreur. Les rediriger permet de composer des outils simples pour résoudre des problèmes complexes — c'est la philosophie Unix.</p>
<pre><code>commande &gt; sortie.txt      # rediriger la sortie (ecrase)
commande &gt;&gt; sortie.txt     # ajouter a la fin
commande 2&gt; erreurs.txt    # rediriger les erreurs
commande &lt; entree.txt      # lire depuis un fichier
cmd1 | cmd2                # tube : sortie de cmd1 vers entree de cmd2</code></pre>
<h4>Filtres utiles</h4>
<table><tr><th>Commande</th><th>Rôle</th></tr>
<tr><td>grep</td><td>filtrer les lignes correspondant à un motif</td></tr>
<tr><td>sort</td><td>trier</td></tr>
<tr><td>uniq</td><td>éliminer les doublons consécutifs</td></tr>
<tr><td>wc -l</td><td>compter les lignes</td></tr>
<tr><td>head, tail</td><td>début, fin d'un fichier</td></tr>
<tr><td>cut</td><td>extraire des colonnes</td></tr></table>
<pre><code>grep "erreur" journal.txt | sort | uniq -c | sort -rn | head</code></pre>
<p>Cette ligne compte les messages d'erreur distincts et affiche les plus fréquents. Aucune de ces commandes ne sait faire cela seule : c'est leur composition qui produit le résultat.</p>
<h4>Script shell</h4>
<pre><code>#!/bin/bash
# sauvegarde.sh : archive un repertoire
if [ $# -ne 1 ]; then
    echo "usage: $0 repertoire"
    exit 1
fi
tar czf sauvegarde.tar.gz "$1"
echo "Sauvegarde terminee"</code></pre>
<p>La première ligne indique l'interpréteur. Les variables sont accessibles par leur nom précédé du symbole dollar, les paramètres par leur numéro. Il faut rendre le script exécutable avant de le lancer.</p>
<h4>Compléments utiles</h4>
<p>La complétion par tabulation, l'historique avec les flèches, la recherche dans l'historique et les alias font gagner un temps considérable. Prends l'habitude dès les premiers TP.</p>`,
retenir:"Des petits outils composés par des tubes valent mieux qu'un gros programme. Redirections pour les fichiers, tubes pour les enchaînements, scripts pour automatiser ce que tu répètes.",
exos:[{q:"Compte le nombre de fichiers .c d'un répertoire en une ligne.",r:"ls *.c | wc -l — ou find . -name \"*.c\" | wc -l pour inclure les sous-répertoires."},{q:"Que fait cmd > fichier 2>&1 ?",r:"Elle redirige la sortie standard vers le fichier, puis la sortie d'erreur vers la même destination. Tout se retrouve dans le fichier."}]}
]};
const CH_NOMBRES = [
{t:"Les ensembles de nombres", obj:["Situer ℕ, ℤ, ℚ, ℝ les uns dans les autres","Écrire une fraction sous forme irréductible","Savoir ce qu'un ensemble apporte de plus que le précédent"], html:`
<h4>La chaîne d'inclusions</h4>
<p>Chaque ensemble est construit pour résoudre une équation que le précédent ne sait pas résoudre.</p>
<table><tr><th>Ensemble</th><th>Contenu</th><th>Ce qu'il permet enfin</th></tr>
<tr><td>ℕ</td><td>0, 1, 2, 3, …</td><td>compter</td></tr>
<tr><td>ℤ</td><td>…, -2, -1, 0, 1, 2, …</td><td>résoudre x + 3 = 1</td></tr>
<tr><td>ℚ</td><td>les fractions p/q</td><td>résoudre 2x = 3</td></tr>
<tr><td>ℝ</td><td>tous les points d'une droite</td><td>résoudre x² = 2</td></tr></table>
<p>On a donc ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ. Chaque flèche ajoute des nombres, jamais n'en retire.</p>
<h4>Divisibilité</h4>
<div class="def"><b>Définition.</b> Pour m et n dans ℤ, on dit que m divise n s'il existe un entier k tel que n = mk.</div>
<p>n est <strong>pair</strong> si 2 divise n, c'est-à-dire s'il s'écrit n = 2k. Sinon il est <strong>impair</strong> et s'écrit n = 2k + 1. Ces deux écritures sont les outils de la moitié des démonstrations d'arithmétique du semestre.</p>
<h4>Les rationnels</h4>
<p>Un rationnel est un nombre de la forme p/q avec p et q entiers et q non nul. C'est l'unique solution de l'équation qx - p = 0.</p>
<p>La même fraction admet une infinité d'écritures, puisque p/q = np/(nq). On choisit donc toujours la forme <strong>irréductible</strong> : q strictement positif, et p et q sans diviseur commun autre que 1.</p>
<p><em>Exemple du poly.</em> 4/(-6) désigne le même nombre que -2/3, et c'est cette seconde écriture qui est irréductible.</p>
<h4>Les réels</h4>
<p>L'équation x² - 2 = 0 n'a pas de solution rationnelle. On agrandit donc encore, et on obtient ℝ, qui contient √2, mais aussi π, e et ln 2 — tous irrationnels.</p>
<div class="def"><b>Corps.</b> Dans ℚ comme dans ℝ, on peut additionner, multiplier, et diviser par tout élément non nul. On note ℚ* et ℝ* ces ensembles privés de 0.</div>
<div class="piege"><b>Attention.</b> ℤ n'est pas un corps : 2 n'y a pas d'inverse, puisque 1/2 n'est pas entier. C'est exactement la raison d'être de ℚ.</div>`,
retenir:"ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ, et chaque étape existe pour résoudre une équation de plus. Pair = 2k, impair = 2k+1 : ces deux écritures servent partout. Une fraction se met toujours sous forme irréductible.",
exos:[
{q:"Mets 126/98 sous forme irréductible.",r:"126 = 2×63 = 2×9×7 et 98 = 2×49 = 2×7×7. On simplifie par 14 : 126/98 = 9/7."},
{q:"Mets 15/(-25) sous forme irréductible.",r:"On remonte le signe au numérateur et on simplifie par 5 : -3/5."},
{q:"Montre que la somme de deux nombres pairs est paire.",r:"Soient n = 2k et m = 2k'. Alors n + m = 2k + 2k' = 2(k + k'), qui est de la forme 2 fois un entier, donc pair."},
{q:"Montre que le produit de deux nombres impairs est impair.",r:"Soient n = 2k+1 et m = 2k'+1. Alors nm = 4kk' + 2k + 2k' + 1 = 2(2kk' + k + k') + 1, de la forme 2K+1, donc impair."},
{q:"Montre que si n est impair alors n² est impair.",r:"n = 2k+1 donne n² = 4k² + 4k + 1 = 2(2k² + 2k) + 1, donc impair. C'est la contraposée de « si n² est pair alors n est pair »."},
{q:"√2 est-il rationnel ? Donne l'idée de la preuve.",r:"Non. Par l'absurde : si √2 = p/q irréductible, alors p² = 2q², donc p² est pair, donc p est pair (exercice précédent), donc p = 2k et 4k² = 2q², d'où q² = 2k² et q est pair aussi. Contradiction avec l'irréductibilité."},
{q:"3 divise-t-il -12 ? Et -12 divise-t-il 3 ?",r:"Oui pour le premier : -12 = 3 × (-4). Non pour le second : il n'existe pas d'entier k tel que 3 = -12k."},
{q:"Le nombre 0,25 est-il rationnel ? Et 0,333… ?",r:"Oui pour les deux : 0,25 = 1/4 et 0,333… = 1/3. Tout nombre décimal ou à développement périodique est rationnel."}
]},

{t:"Puissances et identités remarquables", obj:["Appliquer les règles de calcul sur les puissances","Manipuler les exposants négatifs et rationnels","Reconnaître une identité remarquable"], html:`
<h4>Définition</h4>
<p>Pour x réel et n entier strictement positif, x<sup>n</sup> est le produit de n facteurs égaux à x. Pour x non nul on pose ensuite</p>
<p style="text-align:center">x<sup>-n</sup> = 1 / x<sup>n</sup> &nbsp;&nbsp;et&nbsp;&nbsp; x<sup>0</sup> = 1.</p>
<p>La convention x<sup>0</sup> = 1 n'est pas arbitraire : c'est la seule qui rende la règle suivante valable pour tous les exposants.</p>
<h4>Les quatre règles</h4>
<ul>
<li>x<sup>n+m</sup> = x<sup>n</sup> × x<sup>m</sup></li>
<li>x<sup>nm</sup> = (x<sup>n</sup>)<sup>m</sup></li>
<li>(xy)<sup>n</sup> = x<sup>n</sup> y<sup>n</sup></li>
<li>(x/y)<sup>n</sup> = x<sup>n</sup> / y<sup>n</sup></li>
</ul>
<div class="piege"><b>Le piège classique.</b> Il n'existe aucune règle pour (x + y)<sup>n</sup>. En particulier (a+b)² n'est pas a² + b². C'est l'erreur la plus fréquente de tout le semestre.</div>
<h4>Identités remarquables</h4>
<p>(a + b)² = a² + 2ab + b²<br>
(a - b)² = a² - 2ab + b²<br>
a² - b² = (a - b)(a + b)</p>
<p>La troisième sert surtout dans l'autre sens, pour <strong>factoriser</strong> : dès que tu vois une différence de deux carrés, tu peux couper en deux facteurs.</p>
<h4>Racines n-ièmes</h4>
<p>Pour tout réel positif x et tout entier n non nul, il existe un unique réel positif y tel que x = y<sup>n</sup>. On le note y = <sup>n</sup>√x = x<sup>1/n</sup>. Cela étend les puissances aux exposants rationnels, et les quatre règles restent valables.</p>
<div class="piege"><b>Positivité obligatoire.</b> Cette définition ne vaut que pour x positif. C'est précisément ce blocage qui motivera l'introduction des nombres complexes au chapitre suivant.</div>
<h4>Exemple guidé</h4>
<p>Simplifier (2<sup>3</sup> × 2<sup>-5</sup>) / 2<sup>-4</sup>.<br>
Au numérateur : 2<sup>3-5</sup> = 2<sup>-2</sup>. Puis diviser par 2<sup>-4</sup> revient à multiplier par 2<sup>4</sup> : 2<sup>-2+4</sup> = 2² = 4.</p>`,
retenir:"On additionne les exposants pour un produit, on les multiplie pour une puissance de puissance. Aucune règle pour une somme : (a+b)² se développe. Une différence de carrés se factorise toujours.",
exos:[
{q:"Simplifie (3⁴ × 3⁻²) / 3³.",r:"3^(4-2-3) = 3^(-1) = 1/3."},
{q:"Développe (2x - 3)².",r:"4x² - 12x + 9. Attention au double produit et au signe."},
{q:"Factorise 9x² - 25.",r:"Différence de carrés : (3x - 5)(3x + 5)."},
{q:"Factorise x² - 7.",r:"(x - √7)(x + √7). L'identité marche aussi avec des racines."},
{q:"Simplifie (x²y³)³ / (xy)⁴ pour x et y non nuls.",r:"Numérateur : x⁶y⁹. Dénominateur : x⁴y⁴. Quotient : x²y⁵."},
{q:"Que vaut (-2)⁴ et -2⁴ ?",r:"(-2)⁴ = 16 car la parenthèse élève le nombre négatif. -2⁴ = -16 car la puissance s'applique avant le signe."},
{q:"Écris √8 sous la forme a√2.",r:"√8 = √(4×2) = 2√2."},
{q:"Simplifie (a + b)² - (a - b)².",r:"En développant : 4ab. On peut aussi voir une différence de carrés : [(a+b)-(a-b)][(a+b)+(a-b)] = 2b × 2a."},
{q:"Que vaut 16^(3/4) ?",r:"16^(1/4) = 2, puis 2³ = 8."}
]},

{t:"Ordre sur ℝ et intervalles", obj:["Utiliser les règles de manipulation des inégalités","Écrire un intervalle en compréhension","Repérer le piège de la multiplication par un négatif"], html:`
<h4>La relation d'ordre</h4>
<p>ℝ est muni de la relation ≤, qui vérifie trois propriétés :</p>
<ul>
<li><strong>Réflexivité</strong> : x ≤ x.</li>
<li><strong>Antisymétrie</strong> : si x ≤ y et y ≤ x, alors x = y.</li>
<li><strong>Transitivité</strong> : si x ≤ y et y ≤ z, alors x ≤ z.</li>
</ul>
<p>Ce sont exactement les trois axiomes d'une relation d'ordre vus en Logique pour l'informatique. On écrit x &lt; y lorsque x ≤ y et x ≠ y.</p>
<h4>Les trois règles à retenir</h4>
<p>Ce sont celles du haut de la page 3 de ton poly :</p>
<ul>
<li>Si x ≤ y et z ≤ t, alors x + z ≤ y + t. <em>(on additionne deux inégalités de même sens)</em></li>
<li>Si x ≤ y et 0 ≤ z, alors xz ≤ yz. <em>(multiplier par un positif conserve le sens)</em></li>
<li>Si x ≤ y et z ≤ 0, alors xz ≥ yz. <em>(multiplier par un négatif renverse le sens)</em></li>
</ul>
<div class="piege"><b>Les deux fautes mortelles.</b> On ne soustrait jamais deux inégalités membre à membre. Et on n'oublie jamais de renverser le sens en multipliant ou divisant par un nombre négatif — donc jamais par une lettre dont on ne connaît pas le signe.</div>
<h4>Intervalles</h4>
<div class="def"><b>Définition 2.1 du poly.</b> Pour a et b réels, [a, b] = { x ∈ ℝ | a ≤ x ≤ b }.</div>
<p>En remplaçant ≤ par &lt; d'un côté ou de l'autre, on obtient [a, b[, ]a, b] et ]a, b[. Le crochet tourné vers l'extérieur signifie que la borne est exclue.</p>
<p>Intervalles infinis : [a, +∞[ = { x ∈ ℝ | a ≤ x }, et de même ]a, +∞[, ]-∞, b] et ]-∞, b[. Enfin ℝ = ]-∞, +∞[.</p>
<div class="piege"><b>Toujours ouvert du côté de l'infini.</b> Écrire [a, +∞] est faux : +∞ n'est pas un réel, il ne peut pas être atteint.</div>
<h4>Exemple guidé</h4>
<p>Résoudre -3x + 2 ≤ 8.<br>
On retranche 2 : -3x ≤ 6. On divise par -3, qui est négatif, donc on <strong>renverse</strong> : x ≥ -2. L'ensemble des solutions est [-2, +∞[.</p>`,
retenir:"Multiplier par un négatif renverse l'inégalité. On additionne deux inégalités de même sens, on ne les soustrait jamais. Crochet vers l'extérieur = borne exclue, et l'infini est toujours exclu.",
exos:[
{q:"Résous 2x - 5 < 1 et donne le résultat en intervalle.",r:"2x < 6, donc x < 3. Solutions : ]-∞, 3[."},
{q:"Résous -4x + 1 ≥ 9.",r:"-4x ≥ 8, puis division par -4 avec renversement : x ≤ -2. Solutions : ]-∞, -2]."},
{q:"Écris en compréhension l'intervalle ]-1, 4].",r:"{ x ∈ ℝ | -1 < x ≤ 4 }."},
{q:"Si 2 ≤ x ≤ 5 et 1 ≤ y ≤ 3, encadre x + y.",r:"On additionne les inégalités de même sens : 3 ≤ x + y ≤ 8."},
{q:"Avec les mêmes hypothèses, encadre x - y.",r:"On ne soustrait pas les inégalités. On encadre d'abord -y : -3 ≤ -y ≤ -1. Puis on additionne : -1 ≤ x - y ≤ 4."},
{q:"Si 2 ≤ x ≤ 5, encadre -3x.",r:"On multiplie par -3 en renversant : -15 ≤ -3x ≤ -6."},
{q:"Peut-on déduire de x ≤ y que x² ≤ y² ?",r:"Non. Avec x = -3 et y = 1 on a x ≤ y mais x² = 9 > 1 = y². C'est vrai seulement si x et y sont tous deux positifs."},
{q:"Résous (x - 1)(x + 2) > 0 par un tableau de signes.",r:"Les racines sont 1 et -2. Le produit est positif à l'extérieur des racines : ]-∞, -2[ ∪ ]1, +∞[."},
{q:"Résous 1/x < 2 en discutant le signe de x.",r:"Si x > 0 : on multiplie par x sans renverser, 1 < 2x, donc x > 1/2. Si x < 0 : 1/x est négatif donc l'inégalité est toujours vraie. Solutions : ]-∞, 0[ ∪ ]1/2, +∞[."}
]},

{t:"Le symbole somme Σ", obj:["Lire et écrire une somme indexée","Comprendre la variable muette","Utiliser les trois sommes classiques"], html:`
<h4>Ce que ça veut dire</h4>
<p>Si pour chaque entier i entre n et p on dispose d'un réel x<sub>i</sub>, la notation Σ (de i = n à p) x<sub>i</sub> désigne la somme</p>
<p style="text-align:center">x<sub>n</sub> + x<sub>n+1</sub> + … + x<sub>p</sub></p>
<p>C'est une simple abréviation. En informatique, c'est exactement une boucle <code>for</code> qui accumule dans une variable.</p>
<pre><code>int s = 0;
for (int i = n; i &lt;= p; i++) s = s + x[i];</code></pre>
<h4>Variable muette</h4>
<div class="def"><b>Point important du poly.</b> La lettre i n'a aucune signification propre : elle peut être remplacée par n'importe quelle autre. Σ(i=n à p) x<sub>i</sub> = Σ(k=n à p) x<sub>k</sub>.</div>
<p>C'est la même idée que le nom d'une variable locale dans une fonction : il ne sort pas de la boucle.</p>
<h4>Les trois sommes classiques</h4>
<ul>
<li><strong>Somme des entiers</strong> : Σ (i = 0 à n) i = n(n+1)/2.</li>
<li><strong>Somme géométrique</strong> : pour q ≠ 1, Σ (i = 0 à n) q<sup>i</sup> = (q<sup>n+1</sup> - 1)/(q - 1).</li>
<li><strong>Binôme de Newton</strong> : traité au chapitre suivant.</li>
</ul>
<h4>Règles de manipulation</h4>
<ul>
<li>Linéarité : une constante sort de la somme, et la somme d'une somme se sépare.</li>
<li>Σ (i = 0 à n) c = (n + 1) × c : attention, il y a n+1 termes et non n.</li>
<li>Changement d'indice : poser j = i + 1 décale les bornes. C'est la manipulation clé de la preuve du binôme dans ton poly.</li>
</ul>
<h4>Exemple guidé</h4>
<p>Calculer Σ (i = 1 à 10) (2i + 3).<br>
On sépare : 2 Σ i + Σ 3. La première somme va de 1 à 10 et vaut 10×11/2 = 55, donc 2×55 = 110. La seconde compte 10 termes égaux à 3, soit 30. Total : 140.</p>
<div class="piege"><b>Compter les termes.</b> D'un indice n à un indice p, il y a p - n + 1 termes. De 0 à n, il y en a n+1, pas n.</div>`,
retenir:"Σ est une boucle. L'indice est muet. Somme des entiers : n(n+1)/2. Somme géométrique : (q^(n+1) - 1)/(q - 1). Et il y a p - n + 1 termes entre les bornes n et p.",
exos:[
{q:"Écris en toutes lettres Σ (i = 2 à 5) i².",r:"4 + 9 + 16 + 25 = 54."},
{q:"Combien de termes dans Σ (i = 3 à 17) x_i ?",r:"17 - 3 + 1 = 15 termes."},
{q:"Calcule la somme des entiers de 1 à 100.",r:"100 × 101 / 2 = 5050."},
{q:"Calcule Σ (i = 0 à 5) 2^i.",r:"Somme géométrique de raison 2 : (2⁶ - 1)/(2 - 1) = 63."},
{q:"Calcule Σ (i = 1 à n) (3i - 1) en fonction de n.",r:"3 Σi - Σ1 = 3n(n+1)/2 - n = (3n² + 3n - 2n)/2 = (3n² + n)/2 = n(3n+1)/2."},
{q:"Calcule la somme des entiers de 10 à 50.",r:"Somme de 1 à 50 moins somme de 1 à 9 : 1275 - 45 = 1230."},
{q:"Écris Σ (i = 1 à n) x_i en fonction d'une somme d'indice j partant de 0.",r:"En posant j = i - 1 : Σ (j = 0 à n-1) x_(j+1). Les bornes se décalent en sens inverse de l'indice."},
{q:"Que vaut Σ (i = 0 à n) 1 ?",r:"n + 1, car chaque terme vaut 1 et il y a n+1 termes."},
{q:"Calcule Σ (i = 0 à 4) (1/2)^i.",r:"(q^5 - 1)/(q - 1) avec q = 1/2, soit (1/32 - 1)/(-1/2) = 31/16."},
{q:"Écris le code C qui calcule Σ (i = 1 à n) i² sans formule.",r:"int s = 0; for (int i = 1; i <= n; i++) s += i*i; — la borne i <= n reproduit exactement l'indice supérieur du symbole somme."}
]},

{t:"Factorielle et coefficients binomiaux", obj:["Calculer une factorielle et un coefficient binomial","Utiliser la symétrie et la formule de Pascal","Interpréter en dénombrement"], html:`
<h4>Factorielle</h4>
<div class="def"><b>Définition.</b> n! = 1 × 2 × … × n, avec la convention 0! = 1.</div>
<p>Valeurs à connaître : 1! = 1, 2! = 2, 3! = 6, 4! = 24, 5! = 120. La croissance est brutale : 20! dépasse déjà 10<sup>18</sup>.</p>
<p>n! compte le nombre de façons d'ordonner n objets distincts. C'est aussi le nombre de permutations possibles d'un tableau, donc le nombre d'ordres qu'un algorithme de tri doit pouvoir distinguer.</p>
<h4>Coefficient binomial</h4>
<div class="def"><b>Définition du poly.</b> Pour 0 ≤ i ≤ n, le coefficient binomial « i parmi n » vaut n! / (i! (n - i)!).</div>
<p>Il compte le nombre de façons de choisir i éléments parmi n <strong>sans tenir compte de l'ordre</strong>.</p>
<h4>Propriétés</h4>
<ul>
<li><strong>Bords</strong> : « 0 parmi n » = « n parmi n » = 1.</li>
<li><strong>Symétrie</strong> : « i parmi n » = « n - i parmi n ». Choisir i éléments, c'est en rejeter n - i.</li>
<li><strong>Formule de Pascal</strong> : « i parmi n » + « i+1 parmi n » = « i+1 parmi n+1 ».</li>
</ul>
<h4>La formule de Pascal, démontrée</h4>
<p>C'est le calcul de la page 4 de ton poly. On met les deux fractions au même dénominateur (i+1)!(n-i-1)! :</p>
<p>n!/(i!(n-i)!) + n!/((i+1)!(n-i-1)!) = n!/((i+1)!(n-i)!) × [(i+1) + (n-i)] = n!(n+1)/((i+1)!(n-i)!) = (n+1)!/((i+1)!(n-i)!)</p>
<p>et c'est bien « i+1 parmi n+1 ». Retiens surtout la technique : mettre au même dénominateur puis factoriser.</p>
<h4>Triangle de Pascal</h4>
<p>Chaque coefficient est la somme des deux du dessus. C'est la traduction directe de la formule, et c'est le moyen le plus rapide de calculer à la main :</p>
<pre><code>n=0        1
n=1       1 1
n=2      1 2 1
n=3     1 3 3 1
n=4    1 4 6 4 1
n=5   1 5 10 10 5 1</code></pre>`,
retenir:"n! ordonne, le coefficient binomial choisit sans ordre. Symétrie entre i et n-i, formule de Pascal pour construire le triangle ligne par ligne. Et 0! = 1.",
exos:[
{q:"Calcule 6!.",r:"720."},
{q:"Calcule « 2 parmi 5 ».",r:"5!/(2!3!) = 120/12 = 10."},
{q:"Calcule « 4 parmi 6 » en utilisant la symétrie.",r:"C'est « 2 parmi 6 » = 6!/(2!4!) = 15. Bien plus rapide que le calcul direct."},
{q:"Simplifie (n+1)!/n!.",r:"n+1. Tous les autres facteurs se simplifient."},
{q:"Simplifie n!/(n-2)!.",r:"n(n-1)."},
{q:"Écris la ligne n = 6 du triangle de Pascal.",r:"1, 6, 15, 20, 15, 6, 1 — chaque terme est la somme des deux au-dessus dans la ligne n = 5."},
{q:"Combien de façons de choisir 3 délégués parmi 25 étudiants ?",r:"« 3 parmi 25 » = 25×24×23 / 6 = 2300."},
{q:"Combien de mains de 5 cartes dans un jeu de 32 ?",r:"« 5 parmi 32 » = 201 376. L'ordre de réception ne compte pas, donc c'est bien un coefficient binomial."},
{q:"Vérifie la formule de Pascal avec n = 4 et i = 1.",r:"« 1 parmi 4 » + « 2 parmi 4 » = 4 + 6 = 10, et « 2 parmi 5 » = 10. C'est bien égal."},
{q:"Pourquoi « n parmi n » vaut-il 1 ?",r:"n!/(n!0!) = 1, avec la convention 0! = 1. Il n'y a qu'une façon de choisir tout l'ensemble."}
]},

{t:"Binôme de Newton et récurrence", obj:["Développer une puissance de somme","Rédiger une démonstration par récurrence","Suivre la preuve du binôme du poly"], html:`
<h4>La formule</h4>
<div class="def"><b>Binôme de Newton.</b> Pour a et b réels et n entier, (a + b)<sup>n</sup> = Σ (i = 0 à n) « i parmi n » a<sup>i</sup> b<sup>n-i</sup>.</div>
<p>Les coefficients sont exactement la ligne n du triangle de Pascal. Pour n = 2, on retrouve a² + 2ab + b² : l'identité remarquable n'est qu'un cas particulier.</p>
<p>Exemple avec n = 3 : (a+b)³ = b³ + 3ab² + 3a²b + a³.</p>
<h4>Le schéma de récurrence</h4>
<p>Pour montrer qu'une propriété P(n) est vraie pour tout n, trois étapes, toujours rédigées :</p>
<ol>
<li><strong>Initialisation</strong> : on vérifie P au premier rang.</li>
<li><strong>Hérédité</strong> : on suppose P(n) vraie pour un n fixé, et on démontre P(n+1).</li>
<li><strong>Conclusion</strong> : la propriété est vraie pour tout n.</li>
</ol>
<div class="piege"><b>Sans initialisation, rien n'est prouvé.</b> La propriété « n = n+1 » est héréditaire et pourtant fausse partout. L'hérédité seule ne fait que propager, elle ne démarre pas.</div>
<h4>La preuve du binôme, étape par étape</h4>
<p>C'est le calcul de la page 4 de ton poly. On note (P<sub>n</sub>) la formule.</p>
<p><strong>Initialisation.</strong> Pour n = 1, la somme vaut a + b : (P<sub>1</sub>) est vraie.</p>
<p><strong>Hérédité.</strong> On suppose (P<sub>n</sub>) et on écrit (a+b)<sup>n+1</sup> = (a+b)(a+b)<sup>n</sup>. On distribue, ce qui donne deux sommes : l'une avec a<sup>i+1</sup>b<sup>n-i</sup>, l'autre avec a<sup>i</sup>b<sup>n+1-i</sup>.</p>
<p>Dans la première, on fait le <strong>changement d'indice</strong> j = i + 1 pour que les deux sommes portent sur la même puissance de a. On sort ensuite les termes extrêmes b<sup>n+1</sup> et a<sup>n+1</sup>, on regroupe le reste, et la <strong>formule de Pascal</strong> fusionne les deux coefficients en un seul. On reconnaît (P<sub>n+1</sub>).</p>
<p>Les deux seules astuces sont donc : décaler un indice, et appliquer Pascal. Si tu retiens ces deux gestes, tu peux refaire la preuve.</p>
<h4>Remarque</h4>
<p>Ton poly annonce qu'on reviendra sur la récurrence dans un chapitre ultérieur. Elle réapparaîtra aussi en Logique pour l'informatique, et sous forme d'induction structurelle en algorithmique.</p>`,
retenir:"(a+b)^n se développe avec la ligne n du triangle de Pascal. Une récurrence se rédige en trois étapes explicites. Dans la preuve du binôme, tout tient au changement d'indice puis à la formule de Pascal.",
exos:[
{q:"Développe (a + b)⁴.",r:"a⁴ + 4a³b + 6a²b² + 4ab³ + b⁴, avec les coefficients 1, 4, 6, 4, 1."},
{q:"Développe (x + 2)³.",r:"x³ + 3x²(2) + 3x(4) + 8 = x³ + 6x² + 12x + 8."},
{q:"Développe (x - 1)⁴.",r:"On applique le binôme avec b = -1 : x⁴ - 4x³ + 6x² - 4x + 1. Les signes alternent."},
{q:"Quel est le coefficient de x³ dans (x + 3)⁵ ?",r:"« 3 parmi 5 » × 3² = 10 × 9 = 90."},
{q:"Que vaut Σ (i = 0 à n) « i parmi n » ?",r:"2^n. Il suffit d'appliquer le binôme avec a = b = 1."},
{q:"Que vaut Σ (i = 0 à n) (-1)^i « i parmi n » pour n ≥ 1 ?",r:"0. On applique le binôme avec a = -1 et b = 1, ce qui donne (1 - 1)^n = 0."},
{q:"Prouve par récurrence que la somme des entiers de 0 à n vaut n(n+1)/2.",r:"Initialisation n = 0 : la somme vaut 0 et la formule donne 0. Hérédité : si la somme jusqu'à n vaut n(n+1)/2, ajouter n+1 donne n(n+1)/2 + (n+1) = (n+1)(n+2)/2, qui est la formule au rang n+1. Conclusion pour tout n."},
{q:"Prouve par récurrence que 2^n ≥ n + 1 pour tout n ≥ 0.",r:"Initialisation : 2⁰ = 1 ≥ 1. Hérédité : si 2^n ≥ n+1 alors 2^(n+1) = 2 × 2^n ≥ 2(n+1) = 2n + 2 ≥ n + 2. Conclusion."},
{q:"Prouve par récurrence que 3 divise 4^n - 1.",r:"Initialisation : 4⁰ - 1 = 0, divisible par 3. Hérédité : 4^(n+1) - 1 = 4(4^n - 1) + 3. Le premier terme est divisible par 3 par hypothèse, le second aussi, donc la somme l'est."},
{q:"Où est l'erreur : « P(n) est héréditaire donc P(n) est vraie pour tout n » ?",r:"Il manque l'initialisation. Sans un rang de départ vérifié, l'hérédité ne propage rien."}
]},

{t:"Ensembles : premières notions", obj:["Décrire un ensemble en extension ou en compréhension","Utiliser le symbole d'appartenance","Manipuler union, intersection, inclusion"], html:`
<h4>Ce qu'est un ensemble</h4>
<p>Ton poly le dit simplement : un ensemble est une collection d'objets tous différents. Il n'y a ni ordre ni répétition.</p>
<h4>Deux façons de décrire</h4>
<ul>
<li><strong>En extension</strong>, entre accolades, en listant les éléments : ℕ = {0, 1, 2, 3, 4, 5, …}.</li>
<li><strong>En compréhension</strong>, par une propriété : { x | x vérifie certaines propriétés }. Par exemple { n ∈ ℕ | n est pair }.</li>
</ul>
<p>La barre verticale se lit « tel que ». C'est la même construction que les intervalles vus plus haut : [a, b] = { x ∈ ℝ | a ≤ x ≤ b }.</p>
<h4>Appartenance</h4>
<div class="def"><b>Symbole ∈.</b> La phrase x ∈ A signifie que x est un élément de l'ensemble A. Sa négation se note x ∉ A.</div>
<div class="piege"><b>Ne pas confondre ∈ et ⊂.</b> ∈ relie un élément à un ensemble, ⊂ relie deux ensembles. On écrit 2 ∈ ℕ et ℕ ⊂ ℤ, jamais l'inverse.</div>
<h4>Opérations</h4>
<ul>
<li><strong>Union</strong> A ∪ B : les éléments qui sont dans A <em>ou</em> dans B (ou dans les deux).</li>
<li><strong>Intersection</strong> A ∩ B : ceux qui sont dans A <em>et</em> dans B.</li>
<li><strong>Différence</strong> A \\ B : ceux de A qui ne sont pas dans B.</li>
<li><strong>Inclusion</strong> A ⊂ B : tout élément de A est aussi dans B.</li>
</ul>
<p>Le parallèle avec la logique est exact : union et « ou », intersection et « et », complémentaire et négation. Les lois de De Morgan s'écrivent donc aussi bien sur les ensembles.</p>
<h4>Ensemble vide et cardinal</h4>
<p>L'ensemble vide, sans aucun élément, est inclus dans tout ensemble. Le cardinal d'un ensemble fini est son nombre d'éléments. Pour deux ensembles finis, le cardinal de l'union vaut la somme des cardinaux moins celui de l'intersection.</p>
<div class="def"><b>Remarque.</b> Ton poly annonce qu'on reviendra plus tard sur les rudiments de théorie des ensembles. Le cours de Logique pour l'informatique traite ces notions en détail, relations et applications comprises.</div>`,
retenir:"En extension on liste, en compréhension on décrit par une propriété. ∈ pour un élément, ⊂ pour un ensemble. Union = ou, intersection = et : c'est la logique traduite en ensembles.",
exos:[
{q:"Décris en compréhension l'ensemble {0, 2, 4, 6, 8, …}.",r:"{ n ∈ ℕ | n est pair }, ou encore { 2k | k ∈ ℕ }."},
{q:"Décris en extension { n ∈ ℕ | n² < 20 }.",r:"{0, 1, 2, 3, 4}, car 4² = 16 < 20 mais 5² = 25 > 20."},
{q:"Vrai ou faux : 3 ⊂ ℕ.",r:"Faux. 3 est un élément, pas un ensemble : il faut écrire 3 ∈ ℕ."},
{q:"Vrai ou faux : {3} ⊂ ℕ.",r:"Vrai. {3} est bien un ensemble, et son unique élément appartient à ℕ."},
{q:"Avec A = {1,2,3,4} et B = {3,4,5}, donne A ∪ B, A ∩ B et A \\ B.",r:"A ∪ B = {1,2,3,4,5} ; A ∩ B = {3,4} ; A \\ B = {1,2}."},
{q:"Vérifie la formule des cardinaux sur l'exemple précédent.",r:"|A| + |B| - |A ∩ B| = 4 + 3 - 2 = 5, ce qui est bien le cardinal de l'union."},
{q:"Décris [2, 5[ en compréhension.",r:"{ x ∈ ℝ | 2 ≤ x < 5 }."},
{q:"Que vaut [0, 3] ∩ [2, 7] ?",r:"[2, 3] : les réels qui sont à la fois dans les deux intervalles."},
{q:"Que vaut ℚ ∩ ℤ ?",r:"ℤ, puisque ℤ est inclus dans ℚ. L'intersection avec un sur-ensemble redonne l'ensemble de départ."},
{q:"Combien de sous-ensembles a l'ensemble {a, b, c} ?",r:"2³ = 8, y compris l'ensemble vide et l'ensemble entier."}
]}
];

{t:"Angles et cercle trigonométrique", obj:["Convertir degrés et radians","Placer un point sur le cercle trigonométrique","Retrouver les valeurs classiques de cos et sin"], html:`
<h4>Mesure d'un angle</h4>
<p>Un angle se mesure en degrés ou en <strong>radians</strong>, l'unité préférée en mathématiques. Le radian mesure directement la longueur de l'arc sur un cercle de rayon 1 : un tour complet vaut 2π radians, soit 360 degrés.</p>
<p>Conversion : angle en radians = angle en degrés × π / 180.</p>
<h4>Angle orienté</h4>
<p>Un angle porte un signe. Le sens positif, dit <strong>sens trigonométrique</strong>, est le sens inverse des aiguilles d'une montre. C'est pourquoi l'angle AMB et l'angle BMA sont opposés : on les parcourt en sens contraires.</p>
<h4>Le cercle trigonométrique</h4>
<p>Dans un repère cartésien, c'est le cercle de centre O et de rayon 1. Le point A de coordonnées (1, 0) sert de référence. Pour un point M du cercle de coordonnées (x, y), on note α la mesure en radians de l'angle AOM, et l'on définit :</p>
<div class="def"><b>Définitions.</b> cos(α) = x, l'abscisse de M. &nbsp; sin(α) = y, l'ordonnée de M.</div>
<p>Le cosinus est donc horizontal, le sinus vertical. C'est le seul moyen fiable de ne jamais les confondre.</p>
<h4>Les valeurs à connaître par cœur</h4>
<table><tr><th>degrés</th><td>0</td><td>30</td><td>45</td><td>60</td><td>90</td><td>180</td></tr>
<tr><th>radians</th><td>0</td><td>π/6</td><td>π/4</td><td>π/3</td><td>π/2</td><td>π</td></tr>
<tr><th>cos</th><td>1</td><td>√3/2</td><td>√2/2</td><td>1/2</td><td>0</td><td>-1</td></tr>
<tr><th>sin</th><td>0</td><td>1/2</td><td>√2/2</td><td>√3/2</td><td>1</td><td>0</td></tr></table>
<p>Astuce de mémorisation : pour les sinus de 0, 30, 45, 60, 90 degrés, écris √0/2, √1/2, √2/2, √3/2, √4/2. Les cosinus sont la même liste à l'envers.</p>
<h4>Lien avec le triangle rectangle</h4>
<p>En projetant M sur l'axe des abscisses en M', le triangle OMM' est rectangle en M' et d'hypoténuse OM. On retrouve alors les formules du collège : le cosinus est le rapport du côté adjacent sur l'hypoténuse, le sinus celui du côté opposé sur l'hypoténuse.</p>`,
retenir:"Cosinus en abscisse, sinus en ordonnée, sur un cercle de rayon 1. Un tour = 2π. Les valeurs de 0, π/6, π/4, π/3, π/2 doivent être immédiates.",
exos:[
{q:"Convertis 135 degrés en radians.",r:"135 × π/180 = 3π/4."},
{q:"Convertis 5π/6 en degrés.",r:"5π/6 × 180/π = 150 degrés."},
{q:"Que vaut cos(π/3) ?",r:"1/2. Ne pas confondre avec sin(π/3) = √3/2."},
{q:"Que vaut sin(π) ?",r:"0. Le point est en (-1, 0), donc d'ordonnée nulle."},
{q:"Que vaut cos(3π/2) ?",r:"0. Le point est en (0, -1), donc d'abscisse nulle et d'ordonnée -1."},
{q:"Dans quel quadrant se trouve un angle de 2π/3 ? Quels sont les signes de cos et sin ?",r:"Deuxième quadrant : cosinus négatif, sinus positif."},
{q:"Un angle de 7π/4 correspond à combien de degrés, et quels sont les signes ?",r:"315 degrés, quatrième quadrant : cosinus positif, sinus négatif."},
{q:"Quelle est la longueur d'un arc de cercle de rayon 1 correspondant à un angle de π/4 ?",r:"π/4, puisqu'en radians la mesure de l'angle est exactement la longueur de l'arc sur un cercle unité."}
]},

{t:"Les formules de trigonométrie", obj:["Utiliser périodicité et parité","Appliquer les formules d'addition","Retrouver les formules de duplication"], html:`
<h4>Périodicité</h4>
<p>Ajouter un tour complet ne change pas le point sur le cercle. Les fonctions cos et sin sont donc <strong>2π-périodiques</strong> :</p>
<p style="text-align:center">cos(α + 2π) = cos(α) &nbsp;&nbsp; et &nbsp;&nbsp; sin(α + 2π) = sin(α)</p>
<h4>Parité</h4>
<p>Changer α en -α revient à symétriser M par rapport à l'axe des abscisses : l'abscisse ne bouge pas, l'ordonnée change de signe.</p>
<p style="text-align:center">cos(-α) = cos(α) &nbsp;&nbsp; et &nbsp;&nbsp; sin(-α) = -sin(α)</p>
<p>Le cosinus est donc pair, le sinus impair.</p>
<h4>La relation fondamentale</h4>
<div class="def"><b>Pythagore sur le cercle.</b> cos²(α) + sin²(α) = 1, pour tout α.</div>
<p>C'est le théorème de Pythagore appliqué au triangle OMM', d'hypoténuse 1. Elle permet de retrouver un sinus à partir d'un cosinus, au signe près — signe que l'on détermine par le quadrant.</p>
<h4>Formules d'addition</h4>
<p>cos(α + β) = cos(α)cos(β) - sin(α)sin(β)<br>
sin(α + β) = sin(α)cos(β) + cos(α)sin(β)</p>
<p>Moyen mnémotechnique : le cosinus mélange les mêmes fonctions avec un signe moins ; le sinus mélange les fonctions croisées avec un plus.</p>
<h4>Formules de soustraction</h4>
<p>On remplace β par -β et on applique la parité :</p>
<p>cos(α - β) = cos(α)cos(β) + sin(α)sin(β)<br>
sin(α - β) = sin(α)cos(β) - cos(α)sin(β)</p>
<h4>Formules de duplication</h4>
<p>On pose β = α dans les formules d'addition :</p>
<p>cos(2α) = cos²(α) - sin²(α) = 2cos²(α) - 1 = 1 - 2sin²(α)<br>
sin(2α) = 2 sin(α) cos(α)</p>
<p>Les trois écritures du cosinus double s'obtiennent en remplaçant cos² par 1 - sin², ou l'inverse. Elles servent constamment en intégration.</p>
<div class="piege"><b>Erreur fréquente.</b> cos(2α) n'est pas 2cos(α), et sin(α + β) n'est pas sin(α) + sin(β). Les fonctions trigonométriques ne sont pas linéaires.</div>`,
retenir:"cos pair, sin impair, tous deux 2π-périodiques. cos² + sin² = 1. Addition : cos mélange les mêmes avec un moins, sin croise avec un plus. Duplication = addition avec β = α.",
exos:[
{q:"Sachant cos(α) = 3/5 et α dans le premier quadrant, calcule sin(α).",r:"sin²(α) = 1 - 9/25 = 16/25, donc sin(α) = 4/5, positif car premier quadrant."},
{q:"Sachant sin(α) = -1/2 et α dans le quatrième quadrant, calcule cos(α).",r:"cos²(α) = 1 - 1/4 = 3/4, donc cos(α) = √3/2, positif dans le quatrième quadrant."},
{q:"Calcule cos(π/12) avec une formule de soustraction.",r:"π/12 = π/3 - π/4. Donc cos = cos(π/3)cos(π/4) + sin(π/3)sin(π/4) = (1/2)(√2/2) + (√3/2)(√2/2) = (√2 + √6)/4."},
{q:"Calcule sin(7π/12).",r:"7π/12 = π/3 + π/4. sin = sin(π/3)cos(π/4) + cos(π/3)sin(π/4) = (√6 + √2)/4."},
{q:"Simplifie cos(α + π).",r:"cos(α)cos(π) - sin(α)sin(π) = -cos(α)."},
{q:"Simplifie sin(π/2 - α).",r:"sin(π/2)cos(α) - cos(π/2)sin(α) = cos(α). C'est la formule de complémentarité."},
{q:"Sachant sin(α) = 3/5 et cos(α) = 4/5, calcule sin(2α) et cos(2α).",r:"sin(2α) = 2 × (3/5)(4/5) = 24/25. cos(2α) = (16 - 9)/25 = 7/25."},
{q:"Exprime cos²(α) en fonction de cos(2α).",r:"À partir de cos(2α) = 2cos²(α) - 1 : cos²(α) = (1 + cos(2α))/2. Formule essentielle pour intégrer un carré."},
{q:"Résous cos(x) = 1/2 sur [0, 2π[.",r:"x = π/3 ou x = 5π/3, les deux points d'abscisse 1/2 sur le cercle."},
{q:"Résous sin(x) = √2/2 sur [0, 2π[.",r:"x = π/4 ou x = 3π/4, les deux points d'ordonnée √2/2."}
]},

{t:"Écriture algébrique d'un complexe", obj:["Identifier partie réelle et partie imaginaire","Reconnaître un réel et un imaginaire pur","Comprendre d'où vient le nombre i"], html:`
<h4>Pourquoi les complexes</h4>
<p>Historiquement, ils apparaissent au XVI<sup>e</sup> siècle pour écrire les solutions des équations de degré 3. L'idée est d'introduire un nombre, noté i, dont le carré vaut -1 — ce qu'aucun réel ne peut faire.</p>
<h4>Définition</h4>
<div class="def"><b>Définition 2.1 du poly.</b> Un nombre complexe est toute expression de la forme a + ib, avec a et b réels. L'ensemble des complexes se note ℂ.</div>
<p>Pour z = a + ib :</p>
<ul>
<li>a est la <strong>partie réelle</strong>, notée Re(z) ;</li>
<li>b est la <strong>partie imaginaire</strong>, notée Im(z).</li>
</ul>
<div class="piege"><b>Im(z) est un réel.</b> Dans z = 3 + 5i, la partie imaginaire est 5, pas 5i. C'est une faute très fréquente en début de semestre.</div>
<h4>Écriture algébrique</h4>
<p>L'écriture z = a + ib s'appelle l'écriture algébrique de z. Elle est <strong>unique</strong> : deux complexes sont égaux si et seulement si leurs parties réelles sont égales et leurs parties imaginaires aussi. Une égalité entre complexes équivaut donc toujours à un système de deux équations réelles.</p>
<h4>Cas particuliers</h4>
<ul>
<li>Si b = 0, on écrit simplement a : les réels sont des complexes, donc ℝ ⊂ ℂ.</li>
<li>Si a = 0, on écrit ib et l'on dit que z est <strong>imaginaire pur</strong>.</li>
</ul>
<p>Autrement dit : Im(z) = 0 signifie z réel, et Re(z) = 0 signifie z imaginaire pur.</p>
<h4>La chaîne complète</h4>
<p>ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ. Chaque étape résout une équation impossible dans la précédente ; ℂ résout x² = -1, et en fait beaucoup plus, puisque toute équation polynomiale y admet des solutions.</p>`,
retenir:"z = a + ib avec a et b réels, écriture unique. Re(z) = a, Im(z) = b, et Im(z) est un réel. Réel équivaut à Im nulle, imaginaire pur à Re nulle.",
exos:[
{q:"Donne Re(z) et Im(z) pour z = -4 + 7i.",r:"Re(z) = -4 et Im(z) = 7."},
{q:"Donne Re(z) et Im(z) pour z = 3i.",r:"Re(z) = 0 et Im(z) = 3. C'est un imaginaire pur."},
{q:"Donne Re(z) et Im(z) pour z = 5.",r:"Re(z) = 5 et Im(z) = 0. C'est un réel."},
{q:"Résous l'équation complexe x + iy = 2 - 3i avec x et y réels.",r:"Par unicité de l'écriture algébrique : x = 2 et y = -3."},
{q:"Trouve les réels x et y tels que (x + 2) + i(y - 1) = 5 + 3i.",r:"x + 2 = 5 et y - 1 = 3, donc x = 3 et y = 4."},
{q:"z = (2 - m) + i(m + 1) est réel pour quelle valeur réelle de m ?",r:"Il faut la partie imaginaire nulle : m + 1 = 0, donc m = -1."},
{q:"Pour quelle valeur de m le même z est-il imaginaire pur ?",r:"Il faut 2 - m = 0, donc m = 2."},
{q:"Vrai ou faux : tout réel est un complexe.",r:"Vrai. Un réel a s'écrit a + i0, donc ℝ ⊂ ℂ."},
{q:"Vrai ou faux : 0 est imaginaire pur.",r:"Vrai selon la définition, puisque sa partie réelle est nulle. Il est à la fois réel et imaginaire pur."}
]},

{t:"Somme, produit, inverse", obj:["Calculer avec les complexes","Retrouver la règle du produit","Mettre un quotient sous forme algébrique"], html:`
<h4>Addition</h4>
<p>On ajoute les parties réelles entre elles et les parties imaginaires entre elles :</p>
<p style="text-align:center">(a + ib) + (a' + ib') = (a + a') + i(b + b')</p>
<h4>Multiplication</h4>
<p>On développe comme d'habitude, puis on remplace i² par -1 :</p>
<p style="text-align:center">(a + ib)(a' + ib') = aa' + iab' + iba' + i²bb' = (aa' - bb') + i(ab' + ba')</p>
<p>Le poly vérifie d'ailleurs la cohérence : avec cette règle, i × i = (0×0 - 1×1) + i(0×1 + 1×0) = -1. La définition tient debout.</p>
<div class="piege"><b>Le signe moins.</b> Dans la partie réelle du produit, c'est aa' <strong>moins</strong> bb'. Ce moins vient de i² = -1 et s'oublie une fois sur deux.</div>
<h4>Inverse</h4>
<p>Tout complexe non nul admet un inverse. Le résultat du poly :</p>
<p style="text-align:center">1/z = a/(a² + b²) - i b/(a² + b²) = (a - ib)/(a² + b²)</p>
<p>En pratique on ne retient pas cette formule : on utilise la <strong>méthode du conjugué</strong>, qui donne le même résultat sans effort.</p>
<h4>Méthode : mettre un quotient sous forme algébrique</h4>
<p>On multiplie le numérateur et le dénominateur par le conjugué du dénominateur. Le dénominateur devient alors un réel.</p>
<p><em>Exemple guidé.</em> Calculons (3 + 2i)/(1 - i).<br>
On multiplie en haut et en bas par 1 + i :<br>
Numérateur : (3 + 2i)(1 + i) = 3 + 3i + 2i + 2i² = 1 + 5i.<br>
Dénominateur : (1 - i)(1 + i) = 1 - i² = 2.<br>
Résultat : 1/2 + (5/2)i.</p>
<h4>Puissances</h4>
<p>z<sup>n</sup> est le produit de n facteurs égaux à z, avec z<sup>0</sup> = 1 et z<sup>-n</sup> = (1/z)<sup>n</sup>. Les puissances de i sont cycliques de période 4 : i⁰ = 1, i¹ = i, i² = -1, i³ = -i, i⁴ = 1, et ainsi de suite. Pour calculer i<sup>n</sup>, il suffit donc de regarder le reste de n dans la division par 4.</p>`,
retenir:"On développe et on remplace i² par -1. Le produit donne (aa' - bb') + i(ab' + ba'). Pour un quotient, multiplier haut et bas par le conjugué du dénominateur. Les puissances de i sont cycliques de période 4.",
exos:[
{q:"Calcule (2 + 3i) + (5 - i).",r:"7 + 2i."},
{q:"Calcule (2 + 3i)(1 - 2i).",r:"2 - 4i + 3i - 6i² = 2 - i + 6 = 8 - i."},
{q:"Calcule (1 + i)².",r:"1 + 2i + i² = 2i."},
{q:"Calcule (1 + i)⁴.",r:"C'est ((1+i)²)² = (2i)² = -4."},
{q:"Que vaut i^2026 ?",r:"2026 = 4 × 506 + 2, donc i^2026 = i² = -1."},
{q:"Mets 1/(2 + i) sous forme algébrique.",r:"On multiplie par le conjugué : (2 - i)/((2+i)(2-i)) = (2 - i)/5 = 2/5 - (1/5)i."},
{q:"Mets (1 + 2i)/(3 - i) sous forme algébrique.",r:"Multiplier par 3 + i : numérateur (1+2i)(3+i) = 3 + i + 6i - 2 = 1 + 7i ; dénominateur 9 + 1 = 10. Résultat : 1/10 + (7/10)i."},
{q:"Résous z + 2i = 3z - 4 dans ℂ.",r:"-2z = -4 - 2i, donc z = 2 + i. On calcule comme dans ℝ."},
{q:"Calcule (2 - i)(2 + i).",r:"4 - i² = 5. Un produit de conjugués donne toujours un réel positif."},
{q:"Développe (1 + i)³ avec le binôme de Newton.",r:"1 + 3i + 3i² + i³ = 1 + 3i - 3 - i = -2 + 2i. Le binôme vaut aussi dans ℂ."}
]},

{t:"Conjugué et module", obj:["Calculer conjugué et module","Utiliser leurs propriétés","Démontrer l'inégalité triangulaire"], html:`
<h4>Conjugué</h4>
<div class="def"><b>Définition 2.2 du poly.</b> Pour z = a + ib, le conjugué de z est le complexe a - ib. On le note z barre.</div>
<p>On a donc Re(z barre) = Re(z) et Im(z barre) = -Im(z). Géométriquement, c'est le symétrique par rapport à l'axe des abscisses.</p>
<h4>Module</h4>
<div class="def"><b>Définition.</b> Le module de z = a + ib est le réel positif |z| = √(a² + b²).</div>
<p>Si z est réel, |z| est simplement sa valeur absolue : le module généralise la valeur absolue. Géométriquement, c'est la distance de l'origine au point d'affixe z.</p>
<h4>La relation centrale</h4>
<p>z × z barre = (a + ib)(a - ib) = a² + b² = |z|². C'est un <strong>réel positif</strong>, et c'est ce qui fait fonctionner la méthode du conjugué : pour z non nul, 1/z = z barre / |z|².</p>
<h4>Propriétés du conjugué</h4>
<ul>
<li>Le conjugué d'une somme est la somme des conjugués, idem pour le produit et le quotient.</li>
<li>Le conjugué du conjugué est z.</li>
<li>z + z barre = 2 Re(z) &nbsp; et &nbsp; z - z barre = 2i Im(z).</li>
<li>z barre = z équivaut à z réel ; z barre = -z équivaut à z imaginaire pur.</li>
</ul>
<h4>Propriétés du module</h4>
<ul>
<li>|z|² = z × z barre, et |z barre| = |z|.</li>
<li>|zz'| = |z| |z'| et |z/z'| = |z| / |z'|.</li>
<li>|z| = 0 équivaut à z = 0.</li>
</ul>
<div class="piege"><b>Pas de linéarité.</b> Le module d'une somme n'est pas la somme des modules. C'est justement l'objet de l'inégalité triangulaire.</div>
<h4>Inégalité triangulaire</h4>
<p style="text-align:center">|z + z'| ≤ |z| + |z'|</p>
<p><strong>Preuve du poly, en trois idées.</strong> D'abord on remarque que |Re(z)| = |a| = √a² ≤ √(a² + b²) = |z|. Ensuite on développe |z + z'|² = (z + z')(z barre + z' barre) = |z|² + 2Re(z z' barre) + |z'|². Enfin on majore Re(z z' barre) par |z z' barre| = |z||z'|, ce qui donne |z|² + 2|z||z'| + |z'|² = (|z| + |z'|)². On conclut en prenant la racine carrée.</p>
<p>Géométriquement, elle dit qu'un côté d'un triangle est plus court que la somme des deux autres.</p>`,
retenir:"Conjugué = on change le signe de la partie imaginaire. Module = distance à l'origine. z fois son conjugué donne |z|², un réel positif : c'est la clé de tous les calculs de quotient.",
exos:[
{q:"Donne le conjugué et le module de z = 3 - 4i.",r:"Conjugué : 3 + 4i. Module : √(9 + 16) = 5."},
{q:"Donne le module de z = -2i.",r:"|z| = √(0 + 4) = 2."},
{q:"Calcule |(1 + i)(2 - 3i)| sans développer.",r:"|1+i| × |2-3i| = √2 × √13 = √26."},
{q:"Calcule |(3 + 4i)/(1 - i)|.",r:"5/√2, soit 5√2/2."},
{q:"Montre que z + z barre est toujours réel.",r:"Avec z = a + ib, la somme vaut 2a, qui est réel. C'est aussi 2 Re(z)."},
{q:"Résous z barre = 2z dans ℂ.",r:"a - ib = 2a + 2ib donne a = 2a et -b = 2b, donc a = 0 et b = 0 : z = 0."},
{q:"Détermine l'ensemble des z tels que |z| = 3.",r:"Le cercle de centre O et de rayon 3, puisque le module est la distance à l'origine."},
{q:"Détermine l'ensemble des z tels que |z - 1| = 2.",r:"Le cercle de centre le point d'affixe 1 et de rayon 2 : |z - a| est la distance entre les points d'affixes z et a."},
{q:"Vérifie l'inégalité triangulaire avec z = 3 et z' = 4i.",r:"|z + z'| = |3 + 4i| = 5, et |z| + |z'| = 3 + 4 = 7. On a bien 5 ≤ 7."},
{q:"Quand y a-t-il égalité dans l'inégalité triangulaire ?",r:"Quand Re(z z' barre) = |z||z'|, c'est-à-dire quand z et z' ont le même argument : les deux vecteurs sont alignés et de même sens."}
]},

{t:"Plan d'Argand, forme exponentielle et argument", obj:["Placer un complexe dans le plan","Passer de la forme algébrique à la forme exponentielle","Manipuler l'argument"], html:`
<h4>Plan d'Argand</h4>
